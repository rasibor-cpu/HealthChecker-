<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HealthChecker+ | Medical Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- THEME -->
<meta name="theme-color" content="#4da3ff">

<!-- CHARTS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== MEDICAL CLOUD THEME ===== */
:root{
  --bg:#f4f9ff;
  --card:#ffffff;
  --primary:#4da3ff;
  --accent:#1f6fd6;
  --text:#1b2a3a;
  --muted:#6b7c93;
  --border:#dbe7f3;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}

header{
  padding:16px;
  background:linear-gradient(90deg,#4da3ff,#7bbcff);
  color:white;
}
header h1{margin:0;font-size:20px}
header small{opacity:.9}

main{padding:14px;max-width:1100px;margin:auto}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}

.metric{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
}
.metric h4{margin:0;font-size:13px;color:var(--muted)}
.metric .val{font-size:20px;font-weight:700;margin-top:4px}

label{font-size:13px;color:var(--muted)}
input,select{
  width:100%;
  padding:8px;
  margin-top:4px;
  border-radius:8px;
  border:1px solid var(--border);
  font-size:14px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-weight:600;
  cursor:pointer;
}
button.secondary{
  background:white;
  color:var(--primary);
  border:1px solid var(--primary);
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

canvas{max-width:100%}

hr{border:none;border-top:1px solid var(--border);margin:14px 0}
</style>
</head>

<body>

<header>
  <h1>HealthChecker+</h1>
  <small>Personal Medical Snapshot & Trends</small>
</header>

<main>

<!-- PROFILE -->
<div class="card">
  <h3>Profile</h3>
  <div class="grid">
    <div>
      <label>Date of Birth</label>
      <input type="date" id="dob">
    </div>
    <div>
      <label>Age</label>
      <input type="text" id="age" disabled>
    </div>
    <div>
      <label>Height (cm)</label>
      <input type="number" id="height">
    </div>
    <div>
      <label>Weight (kg)</label>
      <input type="number" id="weight">
    </div>
    <div>
      <label>BMI</label>
      <input type="text" id="bmi" disabled>
    </div>
  </div>
</div>

<!-- SNAPSHOT INPUT -->
<div class="card">
  <h3>Add New Health Snapshot</h3>
  <div class="grid">
    <div>
      <label>Glucose (mg/dL)</label>
      <input type="number" id="glucose">
    </div>
    <div>
      <label>Systolic BP</label>
      <input type="number" id="sys">
    </div>
    <div>
      <label>Diastolic BP</label>
      <input type="number" id="dia">
    </div>
    <div>
      <label>Sleep Score</label>
      <input type="number" id="sleep">
    </div>
    <div>
      <label>Lowest SpO₂ (%)</label>
      <input type="number" id="spo2">
    </div>
  </div>

  <div class="actions">
    <button onclick="saveSnapshot()">Save Snapshot</button>
  </div>
</div>

<!-- CURRENT SNAPSHOT -->
<div class="card">
  <h3>Current Snapshot</h3>
  <div class="grid">
    <div class="metric"><h4>Glucose</h4><div class="val" id="v_glucose">—</div></div>
    <div class="metric"><h4>BP</h4><div class="val" id="v_bp">—</div></div>
    <div class="metric"><h4>Sleep</h4><div class="val" id="v_sleep">—</div></div>
    <div class="metric"><h4>SpO₂</h4><div class="val" id="v_spo2">—</div></div>
    <div class="metric"><h4>Est. HbA1c</h4><div class="val" id="v_hba1c">—</div></div>
  </div>
</div>

<!-- TRENDS -->
<div class="card">
  <h3>Trends</h3>
  <canvas id="trendChart"></canvas>
</div>

<!-- MEDICAL REPORT UPLOAD -->
<div class="card">
  <h3>Medical Reports</h3>
  <label>Attach report (image or PDF)</label>
  <input type="file" accept="image/*,.pdf">
  <p style="font-size:12px;color:var(--muted)">
    Automatic extraction (OCR) will be enabled in next update.
  </p>
</div>

</main>

<script>
/* ===== STORAGE ===== */
const KEY="hc_snapshots_v1";
const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));

/* ===== AGE & BMI ===== */
dob.onchange=()=>{
  const d=new Date(dob.value);
  const a=new Date().getFullYear()-d.getFullYear();
  age.value=a>0?a:"";
};
function calcBMI(){
  const h=height.value/100,w=weight.value;
  if(h&&w) bmi.value=(w/(h*h)).toFixed(1);
}
height.oninput=weight.oninput=calcBMI;

/* ===== SAVE SNAPSHOT ===== */
function saveSnapshot(){
  const data=load();
  data.push({
    ts:Date.now(),
    glucose:+glucose.value||null,
    sys:+sys.value||null,
    dia:+dia.value||null,
    sleep:+sleep.value||null,
    spo2:+spo2.value||null
  });
  save(data);
  render();
}

/* ===== HBA1C EST ===== */
function estA1c(avg){
  return avg?((avg+46.7)/28.7).toFixed(2):"—";
}

/* ===== RENDER ===== */
let chart;
function render(){
  const d=load();
  if(!d.length) return;

  const last=d[d.length-1];
  v_glucose.textContent=last.glucose??"—";
  v_bp.textContent=last.sys?`${last.sys}/${last.dia}`:"—";
  v_sleep.textContent=last.sleep??"—";
  v_spo2.textContent=last.spo2??"—";

  const avgG=d.map(x=>x.glucose).filter(Boolean)
    .reduce((a,b)=>a+b,0)/(d.filter(x=>x.glucose).length||1);
  v_hba1c.textContent=estA1c(avgG);

  const labels=d.map(x=>new Date(x.ts).toLocaleDateString());
  const glucoseData=d.map(x=>x.glucose);

  if(chart) chart.destroy();
  chart=new Chart(trendChart,{
    type:"line",
    data:{labels,datasets:[{
      label:"Glucose",
      data:glucoseData,
      borderColor:"#4da3ff",
      tension:.3
    }]},
    options:{responsive:true}
  });
}
render();
</script>

</body>
</html>
