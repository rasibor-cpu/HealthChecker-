<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>HealthChecker+ — Iteration 25 v1.2.0</title>

  <style>
    :root{ color-scheme: dark; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#0b0f14; color:#e9eef5; }
    .topbar{ position:sticky; top:0; z-index:10; background:#0b0f14; border-bottom:1px solid #1b2430; padding:14px 16px; }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .title{ font-weight:900; font-size:18px; }
    .sub{ opacity:.75; font-size:12px; margin-top:2px; }
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
    .tabs button{ border:1px solid #223043; background:#0f1620; color:#e9eef5; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:13px; }
    .tabs button.active{ border-color:#6a4d00; background:#16120a; }
    select, input, textarea{ border:1px solid #223043; background:#0b0f14; color:#e9eef5; border-radius:10px; padding:10px; font-size:13px; outline:none; }
    textarea{ min-height:90px; width:100%; }
    .btn{ border:1px solid #223043; background:#0b0f14; color:#e9eef5; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13px; }
    .btnPrimary{ border:1px solid #6a4d00; background:#16120a; color:#fff; font-weight:900; }
    .btnDanger{ border:1px solid #5c1a1a; background:#160a0a; }
    .card{ border:1px solid #1b2430; background:#0f1620; border-radius:14px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
    .h{ font-weight:900; margin-bottom:10px; }
    .label{ opacity:.8; font-size:12px; margin-bottom:4px; }
    .val{ font-weight:900; }
    .hr{ height:1px; background:#1b2430; margin:12px 0; }
    .badge{ display:inline-block; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:900; letter-spacing:.4px; margin:8px 0; }
    .badge.urgent{ background:#5c1a1a; }
    .badge.soon{ background:#6b4d00; }
    .badge.routine{ background:#143b5a; }
    .badge.stable{ background:#1f5a2a; }
    .kvs{ display:flex; gap:12px; flex-wrap:wrap; }
    .kv{ min-width:140px; }
    .check{ display:flex; gap:10px; align-items:center; padding:10px; border:1px solid #223043; border-radius:10px; background:#0b0f14; }
    .checkgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; }
    ul{ margin:8px 0 0 18px; }
    li{ margin-bottom:6px; }
    .entry{ border:1px solid #223043; background:#0b0f14; border-radius:12px; padding:12px; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; opacity:.9; }
    .muted{ opacity:.75; }
    .mini{ font-size:12px; opacity:.85; }
    a.link{ color:#e9eef5; text-decoration:none; border-bottom:1px dashed #6a4d00; }
    a.link:hover{ opacity:.85; }
    canvas{ width:100%; height:220px; border:1px solid #223043; border-radius:12px; background:#0b0f14; }
    .pill{ display:inline-flex; gap:8px; align-items:center; border:1px solid #223043; background:#0b0f14; padding:8px 10px; border-radius:999px; }
    .right{ margin-left:auto; }
    @media print{
      .topbar, .noPrint { display:none !important; }
      body{ background:#fff; color:#000; }
      .card{ box-shadow:none; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
  (function(){
    const APP_NAME = "HealthChecker+";
    const APP_VERSION = "Iteration 25 v1.2.0";

    // -------------------- Storage keys --------------------
    const LS = {
      USERS: "hc_users_v2",
      ACTIVE_USER: "hc_active_user_v2",
      PROFILE_PREFIX: "hc_profile_v2_",      // + userId
      METRICS_PREFIX: "hc_metrics_v2_",      // + userId
      GI_PREFIX: "hc_gi_entries_v2_",        // + userId
      SYMPTOMS_PREFIX: "hc_symptoms_v2_",    // + userId
    };

    // -------------------- Limits / defaults --------------------
    const MAX_USERS = 10;

    const DEFAULT_USERS = [{ id:"me", name:"Me" }];

    const DEFAULT_PROFILE = {
      name: "Me",
      dob: "",              // YYYY-MM-DD
      sex: "",              // "Male" | "Female" | "Other"
      heightCm: "",         // number
      weightKg: "",         // number
      bmi: "",              // computed
      existingConditions: [], // array of strings
      conditionsOther: "",
      medications: "",      // free text
    };

    // -------------------- Body parts (simple, complete-enough for lay users) --------------------
    const BODY_PARTS = [
      "Head / Face",
      "Eyes",
      "Ears",
      "Nose / Sinuses",
      "Mouth / Throat",
      "Neck",
      "Chest / Lungs",
      "Heart / Circulation",
      "Upper Back",
      "Lower Back",
      "Stomach / Abdomen",
      "Pelvis / Groin",
      "Urinary (Bladder / Urine)",
      "Reproductive / Sexual health",
      "Skin",
      "Arms / Shoulders",
      "Hands / Fingers",
      "Hips / Buttocks",
      "Legs / Knees",
      "Feet / Ankles",
      "Nerves / Neurology",
      "Mental / Mood / Sleep",
      "General / Whole body",
      "Other (not sure)"
    ];

    // -------------------- Symptom Library (small default; you can paste your FULL library here) --------------------
    // Expected shape:
    // { "Body Part": [ "symptom 1", "symptom 2", ... ], ... }
    //
    // If you already have the full hcplus_symptom_library_v1.js content,
    // paste/replace SYMPTOM_LIBRARY with that exported object content.
    const SYMPTOM_LIBRARY = {
      "General / Whole body": [
        "Fever", "Chills", "Fatigue / weakness", "Unintentional weight loss", "Night sweats", "Body aches"
      ],
      "Head / Face": [
        "Headache", "Dizziness / lightheadedness", "Facial pain", "Head pressure", "Fainting / blackout"
      ],
      "Eyes": [
        "Blurred vision", "Eye pain", "Red eye", "Sensitivity to light", "Double vision"
      ],
      "Chest / Lungs": [
        "Shortness of breath", "Cough", "Wheezing", "Chest tightness", "Coughing blood"
      ],
      "Heart / Circulation": [
        "Chest pain", "Palpitations", "Swollen legs", "High blood pressure", "Cold hands/feet"
      ],
      "Stomach / Abdomen": [
        "Nausea", "Vomiting", "Abdominal pain", "Heartburn", "Bloating", "Diarrhea", "Constipation"
      ],
      "Urinary (Bladder / Urine)": [
        "Painful urination", "Frequent urination", "Blood in urine", "Foamy urine", "Reduced urine output"
      ],
      "Skin": [
        "Rash", "Itching", "Hives", "Wound not healing", "Skin infection"
      ],
      "Mental / Mood / Sleep": [
        "Anxiety", "Low mood", "Poor sleep", "Daytime sleepiness", "Confusion"
      ],
      "Other (not sure)": [
        "Other (type it in)"
      ]
    };

    // -------------------- GI red flags --------------------
    const DEFAULT_RED_FLAGS = {
      blood: false,
      blackTarry: false,
      fever: false,
      severePain: false,
      vomiting: false,
      weightLoss: false,
      wateryOver48h: false,
    };

    // -------------------- Utils --------------------
    function uid(){ return `${Date.now()}_${Math.random().toString(16).slice(2)}`; }
    function safeParse(json, fallback){ try{ return JSON.parse(json) ?? fallback; }catch{ return fallback; } }
    function qs(sel, root=document){ return root.querySelector(sel); }
    function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
    function setHTML(el, html){ el.innerHTML = html; }
    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function clampInt(v, min, max){
      const n = Number.isFinite(+v) ? Math.floor(+v) : min;
      return Math.max(min, Math.min(max, n));
    }
    function fmtDateTime(iso){ try{ return new Date(iso).toLocaleString(); }catch{ return iso; } }
    function toISODate(d){ return new Date(d).toISOString().slice(0,10); }

    function calcAge(dob){
      if(!dob) return null;
      const d = new Date(dob + "T00:00:00");
      if(Number.isNaN(d.getTime())) return null;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return age >= 0 ? age : null;
    }

    function calcBMI(heightCm, weightKg){
      const h = parseFloat(heightCm);
      const w = parseFloat(weightKg);
      if(!h || !w) return "";
      const m = h / 100;
      if(m <= 0) return "";
      const bmi = w / (m*m);
      return Number.isFinite(bmi) ? bmi.toFixed(1) : "";
    }

    function triageStyle(triage){
      if(triage === "URGENT") return "badge urgent";
      if(triage === "SOON") return "badge soon";
      if(triage === "ROUTINE") return "badge routine";
      return "badge stable";
    }

    // -------------------- IndexedDB for attachments --------------------
    const IDB_NAME = "hcplus_db_v2";
    const IDB_STORE = "attachments";

    function idbOpen(){
      return new Promise((resolve, reject)=>{
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(IDB_STORE)){
            db.createObjectStore(IDB_STORE, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbPutAttachment(rec){
      const db = await idbOpen();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(rec);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGetAttachment(id){
      const db = await idbOpen();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function fileToDataUrl(file){
      return new Promise((resolve, reject)=>{
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(file);
      });
    }

    // -------------------- GI scoring --------------------
    function computeGiStability(entry){
      const bristol = clampInt(entry.bristol, 1, 7);
      const frequency = clampInt(entry.frequency, 0, 20);
      const urgency = entry.urgency || "none";
      const pain = entry.pain || "none";
      const durationDays = clampInt(entry.durationDays, 0, 365);
      const urineColor = clampInt(entry.urineColor || 0, 0, 8);
      const rf = entry.redFlags || DEFAULT_RED_FLAGS;

      const anyRedFlag = Object.values(rf).some(Boolean);

      let triageOverride = null;
      if(anyRedFlag){
        if(rf.blackTarry || rf.blood || rf.severePain || rf.vomiting) triageOverride = "URGENT";
        else triageOverride = "SOON";
      }

      let score = 100;
      const bristolPenalty = { 4:0, 3:5, 5:10, 2:15, 6:20, 1:25, 7:30 };
      score -= (bristolPenalty[bristol] ?? 15);

      if(frequency === 0) score -= 15;
      else if(frequency === 3) score -= 5;
      else if(frequency >= 4 && frequency <= 5) score -= 10;
      else if(frequency >= 6) score -= 20;

      if(urgency === "sometimes") score -= 5;
      else if(urgency === "often") score -= 15;

      if(pain === "mild") score -= 5;
      else if(pain === "moderate") score -= 10;
      else if(pain === "severe") score -= 20;

      if(durationDays >= 2 && durationDays <= 3) score -= 5;
      else if(durationDays >= 4 && durationDays <= 7) score -= 10;
      else if(durationDays > 7) score -= 15;

      if(urineColor >= 4 && urineColor <= 5) score -= 5;
      else if(urineColor >= 6 && urineColor <= 8) score -= 10;

      score = clampInt(score, 0, 100);

      let band = "Stable";
      if(score < 40) band = "Highly unstable";
      else if(score < 60) band = "Unstable";
      else if(score < 80) band = "Mildly unstable";

      let triage = "ROUTINE";
      if(triageOverride) triage = triageOverride;
      else {
        if(score < 40) triage = "SOON";
        else if(score < 60 && durationDays >= 4) triage = "SOON";
        else if(score >= 80) triage = "STABLE";
        else triage = "ROUTINE";
      }

      const summary = `Bristol ${bristol}, ${frequency}/day, urgency: ${urgency}, pain: ${pain}, red flags: ${anyRedFlag ? "yes":"no"}.`;
      return { score, band, triage, summary, anyRedFlag };
    }

    function buildGiActionPlan(entry, computed){
      const bristol = clampInt(entry.bristol, 1, 7);
      if(computed.triage === "URGENT"){
        return [
          "Urgent pattern detected (red flags). Seek urgent medical assessment.",
          "Hydrate in small frequent sips while arranging care if safe.",
          "Avoid NSAIDs (ibuprofen/naproxen) unless clinician-approved (kidney safety)."
        ];
      }
      if(computed.triage === "SOON"){
        return [
          "Concerning or persistent pattern. Arrange prompt clinical review (24–72h).",
          "Prioritize hydration; consider oral rehydration solution if stools are loose.",
          "Avoid heavy/fatty meals and alcohol until stable."
        ];
      }
      if(bristol === 1 || bristol === 2){
        return [
          "Constipation tendency: increase water and add fiber gradually (vegetables; psyllium if tolerated).",
          "Gentle daily activity (10–20 minutes walking).",
          "Escalate if pain, bleeding, or no stool >3 days."
        ];
      }
      if(bristol === 6 || bristol === 7){
        return [
          "Diarrhea tendency: prioritize hydration; consider electrolytes.",
          "Reduce greasy/high-fat foods, very spicy meals, excess caffeine temporarily.",
          "Escalate if watery diarrhea >48h (or >24h with dehydration/CKD risk)."
        ];
      }
      return [
        "Maintain: Types 3–4 are typically the target range.",
        "If urgency/pain persists, review trigger foods and hydration.",
        "Reassess if new red flags appear."
      ];
    }

    // -------------------- Data load/save --------------------
    function usersLoad(){
      const stored = safeParse(localStorage.getItem(LS.USERS), null);
      if(Array.isArray(stored) && stored.length) return stored.slice(0, MAX_USERS);
      localStorage.setItem(LS.USERS, JSON.stringify(DEFAULT_USERS));
      localStorage.setItem(LS.ACTIVE_USER, "me");
      return DEFAULT_USERS;
    }
    function usersSave(users){ localStorage.setItem(LS.USERS, JSON.stringify(users.slice(0, MAX_USERS))); }
    function activeUserLoad(){ return localStorage.getItem(LS.ACTIVE_USER) || "me"; }
    function activeUserSave(id){ localStorage.setItem(LS.ACTIVE_USER, id); }

    function profileKey(userId){ return LS.PROFILE_PREFIX + userId; }
    function metricsKey(userId){ return LS.METRICS_PREFIX + userId; }
    function giKey(userId){ return LS.GI_PREFIX + userId; }
    function symptomsKey(userId){ return LS.SYMPTOMS_PREFIX + userId; }

    function profileLoad(userId){
      const p = safeParse(localStorage.getItem(profileKey(userId)), null);
      if(p && typeof p === "object") return { ...DEFAULT_PROFILE, ...p };
      // Seed minimal profile name from users list if possible
      const u = state.users.find(x=>x.id===userId);
      const seeded = { ...DEFAULT_PROFILE, name: u?.name || "Me" };
      localStorage.setItem(profileKey(userId), JSON.stringify(seeded));
      return seeded;
    }
    function profileSave(userId, profile){ localStorage.setItem(profileKey(userId), JSON.stringify(profile)); }

    function metricsLoad(userId){
      const arr = safeParse(localStorage.getItem(metricsKey(userId)), []);
      return Array.isArray(arr) ? arr : [];
    }
    function metricsSave(userId, arr){ localStorage.setItem(metricsKey(userId), JSON.stringify(arr)); }

    function giLoad(userId){
      const arr = safeParse(localStorage.getItem(giKey(userId)), []);
      return Array.isArray(arr) ? arr : [];
    }
    function giSave(userId, arr){ localStorage.setItem(giKey(userId), JSON.stringify(arr)); }

    function symptomsLoad(userId){
      const arr = safeParse(localStorage.getItem(symptomsKey(userId)), []);
      return Array.isArray(arr) ? arr : [];
    }
    function symptomsSave(userId, arr){ localStorage.setItem(symptomsKey(userId), JSON.stringify(arr)); }

    // -------------------- State --------------------
    let state = {
      tab: "SNAPSHOT",
      users: usersLoad(),
      activeUserId: activeUserLoad(),
      profile: null,
      metrics: [],
      gi: [],
      symptoms: [],
    };

    function refreshUserData(){
      state.profile = profileLoad(state.activeUserId);
      // compute BMI live
      state.profile.bmi = calcBMI(state.profile.heightCm, state.profile.weightKg);
      profileSave(state.activeUserId, state.profile);

      state.metrics = metricsLoad(state.activeUserId);
      state.gi = giLoad(state.activeUserId).map(e=>{
        if(e.computed && typeof e.computed.score === "number") return e;
        const computed = computeGiStability(e);
        computed.actionPlan = buildGiActionPlan(e, computed);
        return { ...e, computed };
      });
      giSave(state.activeUserId, state.gi);

      state.symptoms = symptomsLoad(state.activeUserId);
    }
    refreshUserData();

    // -------------------- Snapshot helpers --------------------
    function getLatestMetric(type){
      return state.metrics.find(m=>m.type===type) || null;
    }
    function getLatestGi(){
      return state.gi[0] || null;
    }
    function getLatestSymptomSession(){
      return state.symptoms[0] || null;
    }

    // -------------------- Minimal interpretation engine (placeholder) --------------------
    // Uses profile age/sex/conditions to adjust warnings. Not a medical diagnosis.
    function interpretSymptoms(session, profile){
      const age = calcAge(profile.dob);
      const isChild = (age !== null && age < 18);
      const conditions = (profile.existingConditions || []).map(x=>String(x).toLowerCase());
      const hasCkd = conditions.some(x=>x.includes("kidney") || x.includes("ckd") || x.includes("proteinuria"));

      const sx = (session.symptoms || []).map(s=>s.toLowerCase());
      const redFlags = [];

      if(sx.some(s=>s.includes("chest pain")) || sx.some(s=>s.includes("shortness of breath"))){
        redFlags.push("Possible cardiopulmonary red flag (chest pain / shortness of breath).");
      }
      if(sx.some(s=>s.includes("faint")) || sx.some(s=>s.includes("blackout"))){
        redFlags.push("Syncope/fainting can be urgent depending on context.");
      }
      if(isChild && sx.some(s=>s.includes("fever"))){
        redFlags.push("Child + fever: monitor hydration and escalation threshold is lower.");
      }
      if(hasCkd && (sx.some(s=>s.includes("vomit")) || sx.some(s=>s.includes("diarrhea")))){
        redFlags.push("CKD risk: dehydration from vomiting/diarrhea can worsen kidney function and BP.");
      }

      let triage = "ROUTINE";
      if(redFlags.length >= 2) triage = "SOON";
      if(sx.some(s=>s.includes("coughing blood")) || sx.some(s=>s.includes("cough blood"))){
        triage = "URGENT";
      }

      return {
        triage,
        notes: [
          "This module provides triage-style guidance, not a medical diagnosis.",
          ...(redFlags.length ? redFlags : ["No obvious red flags from selected symptoms; use clinical judgment and context."]),
        ],
        suggestedNextSteps: [
          triage==="URGENT" ? "Seek urgent medical evaluation now." :
          triage==="SOON" ? "Arrange clinical review within 24–72 hours." :
          "Monitor symptoms; if worsening or new red flags appear, escalate.",
          "Attach screenshots (labs, BP, glucose) to improve record completeness."
        ]
      };
    }

    // -------------------- Export helpers --------------------
    function downloadText(filename, text, mime="text/plain"){
      const blob = new Blob([text], {type:mime});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 500);
    }

    function toCSV(rows){
      const esc = (v)=> `"${String(v ?? "").replaceAll('"','""')}"`;
      if(!rows.length) return "";
      const headers = Object.keys(rows[0]);
      const lines = [headers.map(esc).join(",")];
      for(const r of rows){
        lines.push(headers.map(h=>esc(r[h])).join(","));
      }
      return lines.join("\n");
    }

    // -------------------- Simple trend chart (canvas) --------------------
    function drawLineChart(canvas, series, opts){
      // series: [{name, points:[{x:Date, y:number}]}]
      // opts: {yMin, yMax, title}
      const ctx = canvas.getContext("2d");
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = 220 * devicePixelRatio;

      ctx.clearRect(0,0,w,h);

      // background border is via CSS; keep chart minimal and readable
      const pad = 26 * devicePixelRatio;
      const plotW = w - pad*2;
      const plotH = h - pad*2;

      const all = series.flatMap(s=>s.points);
      if(!all.length){
        ctx.globalAlpha = 0.8;
        ctx.font = `${12*devicePixelRatio}px system-ui`;
        ctx.fillText("No data yet.", pad, pad + 14*devicePixelRatio);
        return;
      }

      const xs = all.map(p=>p.x.getTime());
      const ys = all.map(p=>p.y);

      const xMin = Math.min(...xs), xMax = Math.max(...xs);
      let yMin = (opts?.yMin ?? Math.min(...ys));
      let yMax = (opts?.yMax ?? Math.max(...ys));
      if(yMin === yMax){ yMin -= 1; yMax += 1; }

      // axes
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 1 * devicePixelRatio;
      ctx.strokeStyle = "#223043";
      ctx.beginPath();
      ctx.moveTo(pad, pad);
      ctx.lineTo(pad, pad + plotH);
      ctx.lineTo(pad + plotW, pad + plotH);
      ctx.stroke();

      // title
      ctx.fillStyle = "#e9eef5";
      ctx.globalAlpha = 0.9;
      ctx.font = `${12*devicePixelRatio}px system-ui`;
      if(opts?.title) ctx.fillText(opts.title, pad, (pad - 8*devicePixelRatio));

      // map
      const xMap = (t)=> pad + ((t - xMin) / (xMax - xMin || 1)) * plotW;
      const yMap = (v)=> pad + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH;

      // draw series with different alphas (no hardcoded colors per your earlier style approach)
      series.forEach((s, i)=>{
        const pts = s.points.slice().sort((a,b)=>a.x-b.x);
        if(!pts.length) return;
        ctx.globalAlpha = 0.7 - (i*0.15);
        ctx.strokeStyle = "#e9eef5";
        ctx.lineWidth = (2 - i*0.3) * devicePixelRatio;

        ctx.beginPath();
        ctx.moveTo(xMap(pts[0].x.getTime()), yMap(pts[0].y));
        for(let k=1;k<pts.length;k++){
          ctx.lineTo(xMap(pts[k].x.getTime()), yMap(pts[k].y));
        }
        ctx.stroke();

        // last point label
        const last = pts[pts.length-1];
        ctx.globalAlpha = 0.85;
        ctx.font = `${11*devicePixelRatio}px system-ui`;
        ctx.fillText(`${s.name}: ${last.y}`, xMap(last.x.getTime()) + 6*devicePixelRatio, yMap(last.y) - 6*devicePixelRatio);
      });

      // y labels (min/max)
      ctx.globalAlpha = 0.8;

    // -------------------- Small HTML helpers --------------------
    function fieldSelect(label, id, options, defaultValue){
      const opts = options.map(o=>{
        const v=String(o); const sel=(v===String(defaultValue))?"selected":"";
        return `<option value="${escapeHtml(v)}" ${sel}>${escapeHtml(v)}</option>`;
      }).join("");
      return `<div><div class="label">${escapeHtml(label)}</div><select id="${escapeHtml(id)}">${opts}</select></div>`;
    }
    function fieldNumber(label, id, defaultValue, min, max){
      return `<div><div class="label">${escapeHtml(label)}</div><input id="${escapeHtml(id)}" type="number" value="${defaultValue}" min="${min}" max="${max}"></div>`;
    }
    function check(id, label){
      return `<label class="check"><input type="checkbox" id="${escapeHtml(id)}"><span>${escapeHtml(label)}</span></label>`;
    }

    // -------------------- Wiring --------------------
    async function loadLatestAttachmentsList(){
      // look through latest metrics + symptom sessions for attachment ids
      const ids = [];
      for(const m of state.metrics.slice(0,20)){
        if(m?.data?.attachmentId) ids.push(m.data.attachmentId);
      }
      for(const s of state.symptoms.slice(0,10)){
        if(s?.attachmentId) ids.push(s.attachmentId);
      }
      // GI currently does not store attachments in this build (can be added similarly)
      const unique = Array.from(new Set(ids)).slice(0,5);
      const box = qs("#attList");
      if(!box) return;

      if(!unique.length){
        box.textContent = "No attachments yet.";
        return;
      }

      const lines = [];
      for(const id of unique){
        try{
          const rec = await idbGetAttachment(id);
          if(rec){
            lines.push(`<div class="entry">
              <div class="mini"><b>${escapeHtml(rec.title || "Attachment")}</b></div>
              <div class="mini muted">${fmtDateTime(rec.ts)} • ${escapeHtml(rec.filename || rec.mime || "")}</div>

            </div>`);

        }
      }
      box.innerHTML = lines.join("") || "No attachments yet.";

    function wireMetricForm(){

      const resetBtn = qs("#resetMetricBtn");

          wireMetricForm();
        });
      }

      if(saveBtn){
        saveBtn.addEventListener("click", async ()=>{
          const type = saveBtn.getAttribute("data-type");
          const ts = new Date().toISOString();

          let payload = {};
          let attachmentId = "";

          if(type==="glucose"){
            const f = qs("#g_file")?.files?.[0] || null;
            if(f){
              attachmentId = uid();
              const dataUrl = await fileToDataUrl(f);
              await idbPutAttachment({

                userId: state.activeUserId,

              context: (qs("#g_ctx")?.value || "").slice(0,200),
              attachmentId

            if(f){
              attachmentId = uid();
              const dataUrl = await fileToDataUrl(f);
              await idbPutAttachment({
                id: attachmentId,
                ts,
                userId: state.activeUserId,
                title: "BP screenshot",
                filename: f.name,
                mime: f.type,
                dataUrl
              });
            }
            payload = {
              sys: clampInt(qs("#bp_sys")?.value ?? 0, 0, 300),
              dia: clampInt(qs("#bp_dia")?.value ?? 0, 0, 200),
              pulse: (qs("#bp_pulse")?.value || "").trim(),
              context: (qs("#bp_ctx")?.value || "").slice(0,200),
              attachmentId
            };
          }

          const entry = { id: uid(), ts, type, data: payload };
          state.metrics = [entry, ...state.metrics];

    function wireSymptoms(){
      const bodySel = qs("#sx_bodypart");
      const symptomSel = qs("#sx_symptomSelect");
      const selectedBox = qs("#sx_selected");
      const addBtn = qs("#sx_addSymptomBtn");
      const otherInput = qs("#sx_other");
      const addOtherBtn = qs("#sx_addOtherBtn");
      const runBtn = qs("#sx_runBtn");
      const resetBtn = qs("#sx_resetBtn");
      const outBox = qs("#sx_output");

      let selected = [];

      function fillSymptoms(){
        if(!bodySel || !symptomSel) return;
        const bp = bodySel.value;
        const list = SYMPTOM_LIBRARY[bp] || SYMPTOM_LIBRARY["Other (not sure)"] || [];
        symptomSel.innerHTML = list.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      }

      function renderSelected(){
        if(!selectedBox) return;
        if(!selected.length){
          selectedBox.textContent = "None selected.";
          return;
        }
        selectedBox.innerHTML = `<div class="mono">${escapeHtml(selected.join(" | "))}</div>
          <div class="row" style="margin-top:8px;">
            <button class="btn btnDanger" id="sx_clearSelectedBtn">Clear selected</button>
          </div>`;
        const clearBtn = qs("#sx_clearSelectedBtn");
        if(clearBtn){
          clearBtn.addEventListener("click", ()=>{
            selected = [];
            renderSelected();
          });
        }
      }

      async function saveAttachmentIfAny(ts){
        const f = qs("#sx_file")?.files?.[0] || null;
        if(!f) return "";
        const id = uid();
        const dataUrl = await fileToDataUrl(f);
        await idbPutAttachment({
          id,
          ts,
          userId: state.activeUserId,
          title: "Symptom attachment",
          filename: f.name,
          mime: f.type,
          dataUrl
        });
        return id;
      }

      if(bodySel){
        bodySel.addEventListener("change", ()=>{
          fillSymptoms();
        });
      }

      fillSymptoms();
      renderSelected();

      if(addBtn){
        addBtn.addEventListener("click", ()=>{
          const v = symptomSel?.value || "";
          if(!v) return;
          if(!selected.includes(v)) selected.push(v);
          renderSelected();
        });
      }

      if(addOtherBtn){
        addOtherBtn.addEventListener("click", ()=>{
          const v = (otherInput?.value || "").trim();
          if(!v) return;
          if(!selected.includes(v)) selected.push(v);
          otherInput.value = "";
          renderSelected();
        });
      }

      if(resetBtn){
        resetBtn.addEventListener("click", ()=>{
          selected = [];
          if(outBox) outBox.textContent = "Run the triage summary to see results here.";
          if(qs("#sx_notes")) qs("#sx_notes").value = "";
          if(qs("#sx_severity")) qs("#sx_severity").value = "moderate";
          if(qs("#sx_file")) qs("#sx_file").value = "";
          renderSelected();
        });
      }

      if(runBtn){
        runBtn.addEventListener("click", async ()=>{
          if(!selected.length){
            alert("Please add at least one symptom.");
            return;
          }

          const ts = new Date().toISOString();
          const bp = bodySel?.value || "Other (not sure)";
          const severity = qs("#sx_severity")?.value || "moderate";
          const notes = (qs("#sx_notes")?.value || "").slice(0,2000);
          const attachmentId = await saveAttachmentIfAny(ts);

          const session = {
            id: uid(),
            ts,
            bodyPart: bp,
            severity,
            symptoms: selected.slice(0, 50),
            notes,
            attachmentId
          };

          const output = interpretSymptoms(session, state.profile);
          session.output = output;

          state.symptoms = [session, ...state.symptoms];
          symptomsSave(state.activeUserId, state.symptoms);

          // show output
          if(outBox){
            outBox.innerHTML = `
              <div class="${triageStyle(output.triage)}">${escapeHtml(output.triage)}</div>
              <div class="hr"></div>
              <div class="label">Key notes</div>
              <ul>${(output.notes||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>
              <div class="hr"></div>
              <div class="label">Suggested next steps</div>
              <ul>${(output.suggestedNextSteps||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>
              ${attachmentId ? `<div class="hr"></div><a class="link" href="#" data-openatt="${escapeHtml(attachmentId)}">Open attached file</a>` : ""}
            `;
          }

          // snapshot must update automatically
          refreshUserData();
          // keep user in Symptoms tab, but make sure attachment open handler is wired
          wire();
        });
      }
    }

    function wireReports(){
      const preset = qs("#rep_preset");
      const start = qs("#rep_start");
      const end = qs("#rep_end");
      const genBtn = qs("#rep_generateBtn");
      const out = qs("#rep_output");
      const printBtn = qs("#rep_printBtn");
      const exportCsvBtn = qs("#rep_exportCsvBtn");
      const exportJsonBtn = qs("#rep_exportJsonBtn");

      const today = new Date();
      if(start && !start.value) start.value = toISODate(today);
      if(end && !end.value) end.value = toISODate(today);

      function getRange(){
        const now = new Date();
        let s = new Date(now);
        let e = new Date(now);
        const p = preset?.value || "daily";
        if(p==="daily"){
          s = new Date(now); e = new Date(now);
        } else if(p==="weekly"){
          s = new Date(now.getTime() - 7*24*3600*1000);
          e = now;
        } else if(p==="monthly"){
          s = new Date(now.getTime() - 30*24*3600*1000);
          e = now;
        } else {
          // custom
          s = start?.value ? new Date(start.value+"T00:00:00") : new Date(now);
          e = end?.value ? new Date(end.value+"T23:59:59") : new Date(now);
        }
        return { s, e };
      }

      if(preset){
        preset.addEventListener("change", ()=>{
          if(preset.value!=="custom"){
            const r = getRange();
            if(start) start.value = toISODate(r.s);
            if(end) end.value = toISODate(r.e);
          }
        });
      }

      if(genBtn){
        genBtn.addEventListener("click", ()=>{
          const {s,e} = getRange();
          const ms = (d)=>new Date(d).getTime();
          const inRange = (iso)=> {
            const t = ms(iso);
            return t >= s.getTime() && t <= e.getTime();
          };

          const mets = state.metrics.filter(m=>inRange(m.ts));
          const gi = state.gi.filter(g=>inRange(g.ts));
          const sx = state.symptoms.filter(x=>inRange(x.ts));

          const latestG = mets.find(m=>m.type==="glucose") || null;
          const latestBP = mets.find(m=>m.type==="bp") || null;

          out.innerHTML = `
            <div class="card" style="background:#0b0f14;">
              <div class="h">Report: ${escapeHtml(currentUser().name)}</div>
              <div class="mini muted">${s.toLocaleDateString()} → ${e.toLocaleDateString()}</div>

              <div class="hr"></div>
              <div class="h">Snapshot within range</div>
              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));">
                ${metricCardGlucose(latestG)}
                ${metricCardBP(latestBP)}
                ${metricCardGI(gi[0]||null)}
                ${metricCardSymptoms(sx[0]||null)}
              </div>

              <div class="hr"></div>
              <div class="h">Counts</div>
              <div class="kvs">
                <div class="kv"><div class="label">Metric entries</div><div class="val">${mets.length}</div></div>
                <div class="kv"><div class="label">GI entries</div><div class="val">${gi.length}</div></div>
                <div class="kv"><div class="label">Symptom sessions</div><div class="val">${sx.length}</div></div>
              </div>
            </div>
          `;
          wire(); // re-wire attachment open links inside output
        });
      }

      if(printBtn){
        printBtn.addEventListener("click", ()=>window.print());
      }

      if(exportCsvBtn){
        exportCsvBtn.addEventListener("click", ()=>{
          const rows = state.metrics.map(m=>{
            if(m.type==="glucose"){
              return { type:"glucose", ts:m.ts, mgdl:m.data.mgdl, trend:m.data.trend||"", context:m.data.context||"" };
            }
            if(m.type==="bp"){
              return { type:"bp", ts:m.ts, sys:m.data.sys, dia:m.data.dia, pulse:m.data.pulse||"", context:m.data.context||"" };
            }
            return { type:m.type, ts:m.ts };
          });
          downloadText(`${APP_NAME}_metrics_${state.activeUserId}.csv`, toCSV(rows), "text/csv");
        });
      }

      if(exportJsonBtn){
        exportJsonBtn.addEventListener("click", ()=>{
          const backup = {
            app: APP_NAME,
            version: APP_VERSION,
            exportedAt: new Date().toISOString(),
            user: currentUser(),
            profile: state.profile,
            metrics: state.metrics,
            gi: state.gi,
            symptoms: state.symptoms
          };
          downloadText(`${APP_NAME}_backup_${state.activeUserId}.json`, JSON.stringify(backup, null, 2), "application/json");
        });
      }
    }

    function wireProfile(){
      // render conditions list
      const list = qs("#cond_list");
      function renderConds(){
        if(!list) return;
        const conds = state.profile.existingConditions || [];
        if(!conds.length){
          list.textContent = "None added.";
          return;
        }
        list.innerHTML = conds.map((c, i)=>`
          <div class="entry">
            <div class="row">
              <div><b>${escapeHtml(c)}</b></div>
              <button class="btn btnDanger right" data-delcond="${i}">Remove</button>
            </div>
          </div>
        `).join("");
        qsa("[data-delcond]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const i = parseInt(btn.getAttribute("data-delcond"), 10);
            state.profile.existingConditions.splice(i,1);
            profileSave(state.activeUserId, state.profile);
            refreshUserData();
            render();
          });
        });
      }
      renderConds();

      // Add condition
      const addBtn = qs("#cond_addBtn");
      if(addBtn){
        addBtn.addEventListener("click", ()=>{
          const v = (qs("#cond_input")?.value || "").trim();
          if(!v) return;
          state.profile.existingConditions = state.profile.existingConditions || [];
          state.profile.existingConditions.push(v);
          qs("#cond_input").value = "";
          profileSave(state.activeUserId, state.profile);
          refreshUserData();
          render();
        });
      }

      const clearBtn = qs("#cond_clearBtn");
      if(clearBtn){
        clearBtn.addEventListener("click", ()=>{
          if(!confirm("Clear all existing conditions for this person?")) return;
          state.profile.existingConditions = [];
          profileSave(state.activeUserId, state.profile);
          refreshUserData();
          render();
        });
      }

      // Save profile
      const saveBtn = qs("#p_saveBtn");
      if(saveBtn){
        saveBtn.addEventListener("click", ()=>{
          state.profile.name = (qs("#p_name")?.value || "").trim() || state.profile.name || "Me";
          state.profile.dob = (qs("#p_dob")?.value || "");
          state.profile.sex = (qs("#p_sex")?.value || "");
          state.profile.heightCm = (qs("#p_height")?.value || "");
          state.profile.weightKg = (qs("#p_weight")?.value || "");
          state.profile.bmi = calcBMI(state.profile.heightCm, state.profile.weightKg);
          state.profile.conditionsOther = (qs("#cond_other")?.value || "").slice(0,2000);
          state.profile.medications = (qs("#p_meds")?.value || "").slice(0,4000);

          profileSave(state.activeUserId, state.profile);

          // also update user display name in users list
          const u = state.users.find(x=>x.id===state.activeUserId);
          if(u){
            u.name = state.profile.name;
            usersSave(state.users);
          }

          refreshUserData();
          render();
        });
      }

      // Add person
      const addPersonBtn = qs("#addPersonBtn");
      if(addPersonBtn){
        addPersonBtn.addEventListener("click", ()=>{
          const name = (qs("#newPersonName")?.value || "").trim();
          if(!name) return;

          if(state.users.length >= MAX_USERS){
            alert(`Maximum of ${MAX_USERS} people reached.`);
            return;
          }

          const id = uid();
          state.users.push({id, name});
          usersSave(state.users);

          // seed profile
          const seeded = { ...DEFAULT_PROFILE, name };
          profileSave(id, seeded);

          state.activeUserId = id;
          activeUserSave(id);

          qs("#newPersonName").value = "";
          refreshUserData();
          render();
        });
      }

      // Delete person
      const delBtn = qs("#delPersonBtn");
      if(delBtn){
        delBtn.addEventListener("click", ()=>{
          if(state.activeUserId==="me") return;
          if(!confirm("Delete this person AND all their stored data? This cannot be undone.")) return;

          const id = state.activeUserId;
          state.users = state.users.filter(x=>x.id!==id);
          usersSave(state.users);

          // clear LocalStorage
          localStorage.removeItem(profileKey(id));
          localStorage.removeItem(metricsKey(id));
          localStorage.removeItem(giKey(id));
          localStorage.removeItem(symptomsKey(id));

          // Note: IndexedDB attachments remain; can be purged later if needed.

          state.activeUserId = "me";
          activeUserSave("me");
          refreshUserData();
          render();
        });
      }

      // live BMI update
      const h = qs("#p_height");
      const w = qs("#p_weight");
      function updateBMI(){
        const bmi = calcBMI(h?.value || "", w?.value || "");
        const bmiEl = qs("#p_bmi");
        if(bmiEl) bmiEl.value = bmi;
      }
      if(h) h.addEventListener("input", updateBMI);
      if(w) w.addEventListener("input", updateBMI);
    }

          .reverse();
        drawLineChart(gCanvas, [{name:"mg/dL", points:pts}], { title:"Glucose (last entries)" });

      if(bpCanvas){
        const sysPts = state.metrics
          .filter(m=>m.type==="bp")

          .map(m=>({ x:new Date(m.ts), y:Number(m.data.sys) }))
          .reverse();

          .filter(m=>m.type==="bp")

          .map(m=>({ x:new Date(m.ts), y:Number(m.data.dia) }))
          .reverse();
        drawLineChart(bpCanvas, [
          {name:"SYS", points:sysPts},
          {name:"DIA", points:diaPts},
        ], { title:"Blood Pressure (last entries)" });
      }
    }

    // -------------------- Start --------------------
    render();

  })();
  </script>
</body>
</html>
