<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HealthChecker+ v6 (Trend Intelligence)</title>
<style>
:root{--bg:#0b1220;--card:#0f1a30;--text:#eaf0ff;--muted:#9fb1d1;--ok:#2dd4bf;--warn:#fbbf24;--bad:#fb7185}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
header{padding:12px;background:#101a32}
nav{display:flex;gap:8px;padding:10px}
.tab{padding:8px 10px;border-radius:10px;background:#233458;cursor:pointer}
.tab.active{background:#4da3ff}
.screen{display:none;padding:12px}
.screen.active{display:block}
.card{background:var(--card);padding:12px;border-radius:12px;margin-bottom:10px}
.alert{padding:10px;border-radius:10px;margin-bottom:10px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
</style>
</head>
<body>
<header>HealthChecker+ v6</header>
<nav>
<div class="tab active" data="dash">Dashboard</div>
<div class="tab" data="add">Add</div>
<div class="tab" data="sym">Symptoms</div>
<div class="tab" data="rep">Reports</div>
</nav>

<div id="dash" class="screen active">
<div id="alerts"></div>
<div id="dashboard"></div>
</div>

<div id="add" class="screen">
<div class="card">
<input id="g" placeholder="Glucose" />
<input id="bp" placeholder="BP 120/80" />
<input id="egfr" placeholder="eGFR" />
<select id="prot"><option value="">Protein</option><option>none</option><option>trace</option><option>moderate</option><option>high</option></select>
<button onclick="save()">Save</button>
</div>
</div>

<div id="sym" class="screen">
<div class="card">
<input id="symi" placeholder="symptom" />
<button onclick="addSym()">Add</button>
<div id="syml"></div>
<button onclick="run()">Run Diagnosis</button>
<div id="dx"></div>
</div>
</div>

<div id="rep" class="screen">
<div class="card" id="report"></div>
</div>

<script>
const KEY='HC_V6';
function data(){return JSON.parse(localStorage.getItem(KEY)||'{"logs":[],"sym":[]}')}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d))}

function trend(arr){
 if(arr.length<3)return 'stable';
 let a=arr.slice(-3);
 if(a[2]>a[1] && a[1]>a[0]) return 'up';
 if(a[2]<a[1] && a[1]<a[0]) return 'down';
 return 'stable';
}

function save(){
 let d=data();
 let g=+gEl.value;
 let sys=+bpEl.value.split('/')[0];
 let e=+egfrEl.value;
 let p=protEl.value;
 d.logs.push({g,sys,e,p});
 saveData(d);
 render();
}

function alerts(d){
 let out=[];
 let gTrend=trend(d.logs.map(x=>x.g));
 let bpTrend=trend(d.logs.map(x=>x.sys));
 let eTrend=trend(d.logs.map(x=>x.e));

 if(gTrend==='up') out.push({t:'Glucose rising',c:'warn'});
 if(bpTrend==='up') out.push({t:'Blood pressure rising',c:'warn'});
 if(eTrend==='down') out.push({t:'Kidney function declining',c:'bad'});

 return out;
}

function render(){
 let d=data();

 // alerts
 let a=alerts(d);
 alertsDiv.innerHTML=a.map(x=>`<div class='alert ${x.c}'>${x.t}</div>`).join('');

 // dashboard
 let html='';
 d.logs.slice(-5).forEach(x=>{
 html+=`<div>G:${x.g} BP:${x.sys} eGFR:${x.e}</div>`
 });
 dashboard.innerHTML=html||'No data';

 // report
 report.innerHTML=`Total readings: ${d.logs.length}`;
}

function addSym(){
 let d=data();
 let v=symi.value;
 if(!v)return;
 d.sym.push(v);
 saveData(d);
 syml.innerHTML=d.sym.join('<br>');
}

function run(){
 let d=data();
 let txt=d.sym.join(' ');
 let urgency='Routine';
 if(txt.match(/chest|breath|stroke/i)) urgency='Urgent';
 dx.innerHTML=`Urgency: ${urgency}`;
}

let gEl=g,bpEl=bp,egfrEl=egfr,protEl=prot;
let dashboard=document.getElementById('dashboard');
let report=document.getElementById('report');
let alertsDiv=document.getElementById('alerts');
let syml=document.getElementById('syml');
let symi=document.getElementById('symi');
let dx=document.getElementById('dx');

let tabs=document.querySelectorAll('.tab');
tabs.forEach(t=>t.onclick=()=>{
 tabs.forEach(x=>x.classList.remove('active'));
 t.classList.add('active');
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(t.getAttribute('data')).classList.add('active');
});

render();
</script>
</body>
</html>
