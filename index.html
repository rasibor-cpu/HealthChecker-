<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>HealthChecker+ — Iteration 25 v1.2.0</title>

  <style>
    :root{ color-scheme:dark; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#0b0f14; color:#e9eef5; }
    .topbar{ position:sticky; top:0; z-index:20; background:#0b0f14; border-bottom:1px solid #1b2430; padding:12px 14px; }
    .wrap{ max-width:1180px; margin:0 auto; padding:14px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .title{ font-weight:900; font-size:16px; letter-spacing:.2px; }
    .sub{ opacity:.75; font-size:12px; margin-top:2px; }
    .pill{ display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:900; border:1px solid #223043; background:#0f1620; }
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
    .tabs button{ border:1px solid #223043; background:#0f1620; color:#e9eef5; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:13px; }
    .tabs button.active{ border-color:#6a4d00; background:#16120a; }
    select,input,textarea{ border:1px solid #223043; background:#0b0f14; color:#e9eef5; border-radius:10px; padding:10px; font-size:13px; outline:none; }
    textarea{ width:100%; min-height:90px; }
    .btn{ border:1px solid #223043; background:#0b0f14; color:#e9eef5; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13px; }
    .btnPrimary{ border:1px solid #6a4d00; background:#16120a; font-weight:900; }
    .btnDanger{ border-color:#5c1a1a; }
    .card{ border:1px solid #1b2430; background:#0f1620; border-radius:14px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
    .h{ font-weight:900; margin-bottom:10px; }
    .label{ opacity:.8; font-size:12px; margin-bottom:4px; }
    .hr{ height:1px; background:#1b2430; margin:12px 0; }
    .kvs{ display:flex; gap:12px; flex-wrap:wrap; }
    .kv{ min-width:140px; }
    .val{ font-weight:900; }
    .mono{ font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; opacity:.9; }
    .badge{ display:inline-block; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:900; letter-spacing:.4px; margin:8px 0; }
    .badge.urgent{ background:#5c1a1a; }
    .badge.soon{ background:#6b4d00; }
    .badge.routine{ background:#143b5a; }
    .badge.stable{ background:#1f5a2a; }

    .check{ display:flex; gap:10px; align-items:center; padding:10px; border:1px solid #223043; border-radius:10px; background:#0b0f14; }
    .checkgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; }

    .entry{ border:1px solid #223043; background:#0b0f14; border-radius:12px; padding:12px; }
    .muted{ opacity:.75; }
    a.link{ color:#e9eef5; text-decoration:none; border-bottom:1px dashed #6a4d00; }
    a.link:hover{ opacity:.85; }
    .small{ font-size:12px; opacity:.8; }
    .right{ margin-left:auto; }

    .canvasWrap{ width:100%; border:1px solid #223043; border-radius:12px; background:#0b0f14; padding:10px; }
    canvas{ width:100%; height:180px; display:block; }

    .chipRow{ display:flex; flex-wrap:wrap; gap:8px; }
    .chip{ border:1px solid #223043; background:#0b0f14; padding:7px 10px; border-radius:999px; font-size:12px; cursor:pointer; }
    .chip.active{ border-color:#6a4d00; background:#16120a; font-weight:900; }

    .split{ display:grid; grid-template-columns:1.1fr .9fr; gap:12px; }
    @media (max-width: 900px){ .split{ grid-template-columns:1fr; } }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
  (function(){
    const APP_NAME = "HealthChecker+";
    const APP_VERSION = "Iteration 25 v1.2.0";

    const LS = {
      USERS: "hc_users_v25",
      ACTIVE_USER: "hc_active_user_v25",
      PROFILE_PREFIX: "hc_profile_v25_",      // + userId
      METRICS_PREFIX: "hc_metrics_v25_",      // + userId
      GI_PREFIX: "hc_gi_entries_v25_",        // + userId
      SYMPTOMS_PREFIX: "hc_symptom_sessions_v25_", // + userId
      ATTACH_PREFIX: "hc_attachments_v25_",   // + userId
    };

    const MAX_FAMILY = 10;

    // ---------- Utilities ----------
    function uid(){ return `${Date.now()}_${Math.random().toString(16).slice(2)}`; }
    function safeParse(json, fallback){ try { return JSON.parse(json) ?? fallback; } catch { return fallback; } }
    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function fmtDateTime(iso){ try { return new Date(iso).toLocaleString(); } catch { return iso; } }
    function clampInt(v, min, max){ const n = Number.isFinite(+v) ? Math.floor(+v) : min; return Math.max(min, Math.min(max, n)); }
    function clampNum(v, min, max){ const n = Number.isFinite(+v) ? +v : min; return Math.max(min, Math.min(max, n)); }
    function qs(sel, root=document){ return root.querySelector(sel); }
    function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
    function setHTML(el, html){ el.innerHTML = html; }
    function todayISODate(){ return new Date().toISOString().slice(0,10); }

    function triageStyle(t){
      if (t === "URGENT") return "badge urgent";
      if (t === "SOON") return "badge soon";
      if (t === "ROUTINE") return "badge routine";
      return "badge stable";
    }

    function computeAge(dobISO){
      if(!dobISO) return null;
      const dob = new Date(dobISO+"T00:00:00");
      if(Number.isNaN(+dob)) return null;
      const now = new Date();
      let age = now.getFullYear() - dob.getFullYear();
      const m = now.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
      return age;
    }

    function calcBMI(heightCm, weightKg){
      const h = +heightCm;
      const w = +weightKg;
      if(!h || !w || h < 50 || h > 260 || w < 10 || w > 400) return null;
      const meters = h / 100;
      const bmi = w / (meters*meters);
      return Math.round(bmi * 10) / 10;
    }

    // ---------- Storage ----------
    function loadUsers(){
      const stored = safeParse(localStorage.getItem(LS.USERS), null);
      if (Array.isArray(stored) && stored.length) return stored;
      const defaults = [{ id:"me", name:"Me" }];
      localStorage.setItem(LS.USERS, JSON.stringify(defaults));
      localStorage.setItem(LS.ACTIVE_USER, "me");
      return defaults;
    }
    function saveUsers(users){ localStorage.setItem(LS.USERS, JSON.stringify(users)); }
    function loadActiveUserId(){ return localStorage.getItem(LS.ACTIVE_USER) || "me"; }
    function setActiveUserId(id){ localStorage.setItem(LS.ACTIVE_USER, id); }

    function keyProfile(userId){ return LS.PROFILE_PREFIX + userId; }
    function keyMetrics(userId){ return LS.METRICS_PREFIX + userId; }
    function keyGI(userId){ return LS.GI_PREFIX + userId; }
    function keySymptoms(userId){ return LS.SYMPTOMS_PREFIX + userId; }
    function keyAttach(userId){ return LS.ATTACH_PREFIX + userId; }

    function loadProfile(userId){
      const p = safeParse(localStorage.getItem(keyProfile(userId)), null);
      if(p) return p;
      const blank = {
        name: null, sex: "", dob: "", heightCm: "", weightKg: "",
        conditions: [], // blank until populated
        medications: [], // blank until populated
      };
      localStorage.setItem(keyProfile(userId), JSON.stringify(blank));
      return blank;
    }
    function saveProfile(userId, profile){ localStorage.setItem(keyProfile(userId), JSON.stringify(profile)); }

    function loadMetrics(userId){
      const m = safeParse(localStorage.getItem(keyMetrics(userId)), null);
      if(m) return m;
      const blank = {
        glucose: [], // {ts, value, source}
        bp: [],      // {ts, sys, dia, pulse, note}
        weight: [],  // {ts, kg}
        sleep: [],   // {ts, hours, score}
        spo2: [],    // {ts, min, note}
        labs: [],    // {ts, name, value, unit}
      };
      localStorage.setItem(keyMetrics(userId), JSON.stringify(blank));
      return blank;
    }
    function saveMetrics(userId, metrics){ localStorage.setItem(keyMetrics(userId), JSON.stringify(metrics)); }

    function loadGI(userId){
      const arr = safeParse(localStorage.getItem(keyGI(userId)), []);
      return Array.isArray(arr) ? arr : [];
    }
    function saveGI(userId, entries){ localStorage.setItem(keyGI(userId), JSON.stringify(entries)); }

    function loadSymptomSessions(userId){
      const arr = safeParse(localStorage.getItem(keySymptoms(userId)), []);
      return Array.isArray(arr) ? arr : [];
    }
    function saveSymptomSessions(userId, sessions){ localStorage.setItem(keySymptoms(userId), JSON.stringify(sessions)); }

    function loadAttachments(userId){
      const arr = safeParse(localStorage.getItem(keyAttach(userId)), []);
      return Array.isArray(arr) ? arr : [];
    }
    function saveAttachments(userId, items){ localStorage.setItem(keyAttach(userId), JSON.stringify(items)); }

    // ---------- GI Logic ----------
    const DEFAULT_RED_FLAGS = {
      blood:false, blackTarry:false, fever:false, severePain:false,
      vomiting:false, weightLoss:false, wateryOver48h:false
    };

    function computeGiStability(entry){
      const bristol = clampInt(entry.bristol, 1, 7);
      const frequency = clampInt(entry.frequency, 0, 20);
      const urgency = entry.urgency || "none";
      const pain = entry.pain || "none";
      const durationDays = clampInt(entry.durationDays, 0, 365);
      const urineColor = clampInt(entry.urineColor || 0, 0, 8);
      const rf = entry.redFlags || DEFAULT_RED_FLAGS;
      const anyRedFlag = Object.values(rf).some(Boolean);

      let triageOverride = null;
      if(anyRedFlag){
        if(rf.blackTarry || rf.blood || rf.severePain || rf.vomiting) triageOverride="URGENT";
        else triageOverride="SOON";
      }

      let score = 100;
      const bristolPenalty = {4:0,3:5,5:10,2:15,6:20,1:25,7:30};
      score -= (bristolPenalty[bristol] ?? 15);

      if(frequency===0) score -= 15;
      else if(frequency===3) score -= 5;
      else if(frequency>=4 && frequency<=5) score -= 10;
      else if(frequency>=6) score -= 20;

      if(urgency==="sometimes") score -= 5;
      else if(urgency==="often") score -= 15;

      if(pain==="mild") score -= 5;
      else if(pain==="moderate") score -= 10;
      else if(pain==="severe") score -= 20;

      if(durationDays>=2 && durationDays<=3) score -= 5;
      else if(durationDays>=4 && durationDays<=7) score -= 10;
      else if(durationDays>7) score -= 15;

      if(urineColor>=4 && urineColor<=5) score -= 5;
      else if(urineColor>=6) score -= 10;

      score = clampInt(score, 0, 100);

      let band="Stable";
      if(score<40) band="Highly unstable";
      else if(score<60) band="Unstable";
      else if(score<80) band="Mildly unstable";

      let triage="ROUTINE";
      if(triageOverride) triage = triageOverride;
      else{
        if(score<40) triage="SOON";
        else if(score<60 && durationDays>=4) triage="SOON";
        else if(score>=80) triage="STABLE";
        else triage="ROUTINE";
      }

      const summary = `Bristol ${bristol}, ${frequency}/day, urgency: ${urgency}, pain: ${pain}, red flags: ${anyRedFlag ? "yes":"no"}.`;
      return {score, band, triage, summary, anyRedFlag};
    }

    function giActionPlan(entry, computed){
      const bristol = clampInt(entry.bristol, 1, 7);
      if(computed.triage==="URGENT"){
        return [
          "Urgent pattern detected (red flags). Seek urgent medical assessment now.",
          "Hydrate in small frequent sips while arranging care if safe.",
          "Avoid NSAIDs (ibuprofen/naproxen) unless clinician-approved (kidney safety)."
        ];
      }
      if(computed.triage==="SOON"){
        return [
          "Concerning or persistent pattern. Arrange prompt clinical review (24–72h).",
          "Prioritize hydration; consider oral rehydration solution if stools are loose.",
          "Avoid heavy/fatty meals and alcohol until stable."
        ];
      }
      if(bristol===1 || bristol===2){
        return [
          "Constipation tendency: increase water and add fiber gradually (vegetables; psyllium if tolerated).",
          "Gentle daily activity (10–20 minutes walking).",
          "Escalate if pain, bleeding, or no stool >3 days."
        ];
      }
      if(bristol===6 || bristol===7){
        return [
          "Diarrhea tendency: prioritize hydration; consider electrolytes.",
          "Reduce greasy/high-fat foods, very spicy meals, excess caffeine temporarily.",
          "Escalate if watery diarrhea >48h (or >24h with dehydration/CKD risk)."
        ];
      }
      return [
        "Maintain: Types 3–4 are typically the target range.",
        "If urgency/pain persists, review trigger foods and hydration.",
        "Reassess if new red flags appear."
      ];
    }

    // ---------- Symptom Diagnoser (Option B framework) ----------
    // Lay-friendly body areas, mapped to complete coverage.
    const BODY_AREAS = [
      {key:"head", label:"Head (scalp/headache)"},
      {key:"face", label:"Face (cheeks/jaw)"},
      {key:"eyes", label:"Eyes (vision)"},
      {key:"ears", label:"Ears (hearing/balance)"},
      {key:"nose", label:"Nose / Sinuses"},
      {key:"mouth", label:"Mouth / Teeth / Gums"},
      {key:"throat_neck", label:"Throat / Neck"},
      {key:"chest", label:"Chest (general)"},
      {key:"breathing", label:"Breathing / Lungs"},
      {key:"heart", label:"Heart / Palpitations"},
      {key:"upper_stomach", label:"Upper stomach (heartburn/indigestion)"},
      {key:"abdomen", label:"Belly / Abdomen"},
      {key:"nausea_vomit", label:"Nausea / Vomiting"},
      {key:"bowel", label:"Bowel movements (stool/diarrhea/constipation)"},
      {key:"liver_gall", label:"Right upper belly (liver/gallbladder area)"},
      {key:"urine_bladder", label:"Urine / Bladder"},
      {key:"kidney_flank", label:"Kidneys / Flank (side/back near ribs)"},
      {key:"male", label:"Male reproductive"},
      {key:"female", label:"Female reproductive"},
      {key:"sexual", label:"Sexual health"},
      {key:"shoulder", label:"Shoulder"},
      {key:"arm_elbow", label:"Arm / Elbow"},
      {key:"wrist_hand", label:"Wrist / Hand / Fingers"},
      {key:"hip", label:"Hip"},
      {key:"leg_knee", label:"Leg / Knee"},
      {key:"ankle_foot", label:"Ankle / Foot / Toes"},
      {key:"joints_multi", label:"Joints (multiple)"},
      {key:"upper_back", label:"Upper back"},
      {key:"lower_back", label:"Lower back"},
      {key:"spine_stiff", label:"Spine / Neck stiffness"},
      {key:"skin", label:"Skin (rash/itch)"},
      {key:"hair", label:"Hair / Scalp"},
      {key:"nails", label:"Nails"},
      {key:"fever", label:"Fever / Chills"},
      {key:"fatigue", label:"Fatigue / Weakness"},
      {key:"weight_appetite", label:"Weight change / Appetite"},
      {key:"sleep", label:"Sleep"},
      {key:"swelling", label:"Swelling (general)"},
      {key:"pain_all", label:"Pain (all over)"},
      {key:"mood", label:"Mood / Anxiety / Stress"},
      {key:"memory", label:"Memory / Confusion"},
      {key:"numbness", label:"Numbness / Tingling"},
      {key:"tremor", label:"Tremor / Movement"},
      {key:"dizzy", label:"Dizziness / Fainting"},
      {key:"seizure", label:"Seizure-like symptoms"},
    ];

    // Starter library (large enough to operate well now) + scalable structure for full Option B.
    // Add more symptoms by appending to the arrays below.
    const SYMPTOM_LIBRARY = {
      head: [
        {name:"Headache", synonyms:["head pain","migraine","pressure in head"]},
        {name:"Severe sudden headache", synonyms:["worst headache","thunderclap"], redFlag:true},
        {name:"Head pressure", synonyms:["tight head","band-like pressure"]},
        {name:"Scalp tenderness", synonyms:["sore scalp"]},
        {name:"Dizziness (spinning)", synonyms:["vertigo"]},
        {name:"Light sensitivity", synonyms:["photophobia"]},
      ],
      eyes: [
        {name:"Blurred vision", synonyms:["vision blurry","can't see well"]},
        {name:"Double vision", synonyms:["seeing double"], redFlag:true},
        {name:"Eye pain", synonyms:["pain in eye"]},
        {name:"Red eye", synonyms:["bloodshot eye"]},
        {name:"Sudden vision loss", synonyms:["blindness suddenly"], redFlag:true},
        {name:"Flashing lights/floaters", synonyms:["floaters","flashes"], redFlag:true},
      ],
      ears: [
        {name:"Ear pain", synonyms:["ear ache"]},
        {name:"Hearing loss", synonyms:["can't hear"]},
        {name:"Ringing in ear", synonyms:["tinnitus"]},
        {name:"Balance problems", synonyms:["unsteady","off balance"]},
      ],
      nose: [
        {name:"Runny nose", synonyms:["nasal discharge"]},
        {name:"Blocked nose", synonyms:["congestion"]},
        {name:"Nosebleed", synonyms:["epistaxis"]},
        {name:"Sinus pain/pressure", synonyms:["face pressure"]},
      ],
      throat_neck: [
        {name:"Sore throat", synonyms:["throat pain"]},
        {name:"Trouble swallowing", synonyms:["pain swallowing","dysphagia"], redFlag:true},
        {name:"Neck stiffness", synonyms:["stiff neck"], redFlag:true},
        {name:"Swollen glands", synonyms:["neck lumps"]},
        {name:"Hoarse voice", synonyms:["voice change"]},
      ],
      chest: [
        {name:"Chest pain", synonyms:["tight chest","pressure chest"], redFlag:true},
        {name:"Chest tightness", synonyms:["tight chest"]},
        {name:"Chest wall pain", synonyms:["pain when pressing ribs"]},
      ],
      breathing: [
        {name:"Shortness of breath", synonyms:["breathless"], redFlag:true},
        {name:"Wheezing", synonyms:["whistling breathing"]},

      ],
      heart: [

        {name:"Fast heart rate", synonyms:["tachy"]},
        {name:"Fainting", synonyms:["passed out"], redFlag:true},
        {name:"Near-fainting", synonyms:["almost passed out"]},
      ],
      upper_stomach: [
        {name:"Heartburn", synonyms:["acid reflux","burning chest after eating"]},
        {name:"Indigestion", synonyms:["upset stomach"]},
        {name:"Bloating", synonyms:["gas","fullness"]},
      ],
      abdomen: [

        {name:"Cramping", synonyms:["cramps"]},

      ],
      nausea_vomit: [

      ],
      bowel: [

      ],

      ],

      ],

      ],

      ],

      ],
      fatigue: [

        {name:"Exercise intolerance", synonyms:["get tired quickly"]},
      ],
      dizzy: [

        {name:"Spinning sensation", synonyms:["vertigo"]},
        {name:"Fainting spells", synonyms:["syncope"], redFlag:true},
      ],
      numbness: [
        {name:"Numbness", synonyms:["no feeling"]},
        {name:"Tingling", synonyms:["pins and needles"]},
        {name:"One-sided weakness", synonyms:["weak on one side"], redFlag:true},
      ],
      seizure: [
        {name:"Seizure", synonyms:["fit","convulsion"], redFlag:true},
        {name:"Loss of awareness episodes", synonyms:["blank spells"], redFlag:true},
      ],
      // More areas exist; empty arrays are fine until expanded.
      face: [], mouth: [], liver_gall: [], male: [], female: [], sexual: [],
      shoulder: [], arm_elbow: [], wrist_hand: [], hip: [], leg_knee: [],
      ankle_foot: [], joints_multi: [], upper_back: [], spine_stiff: [],
      hair: [], nails: [], weight_appetite: [], sleep: [], swelling: [], pain_all: [],
      mood: [], memory: [], tremor: [],
    };

    function flattenLibrary(){
      const out = [];
      for(const area of BODY_AREAS){
        const list = SYMPTOM_LIBRARY[area.key] || [];
        list.forEach(item=>{
          out.push({
            areaKey: area.key,
            areaLabel: area.label,
            name: item.name,
            synonyms: item.synonyms || [],
            redFlag: !!item.redFlag
          });
        });
      }
      return out;
    }

    function symptomSearch(query){
      const q = (query || "").trim().toLowerCase();
      const flat = flattenLibrary();
      if(!q) return flat.slice(0, 200); // keep UI fast
      return flat.filter(s=>{
        if(s.name.toLowerCase().includes(q)) return true;
        return (s.synonyms||[]).some(x=>String(x).toLowerCase().includes(q));
      }).slice(0, 250);
    }

    function computeSymptomTriage(selected, profile){
      // Simple conservative triage rules + age factor
      const age = computeAge(profile.dob);
      const isChild = (age !== null && age < 16);

      const anyRedFlag = selected.some(s=>s.redFlag || s.flags?.includes("redFlag"));
      let triage = "ROUTINE";

      if(anyRedFlag) triage = "URGENT";
      else{
        const names = selected.map(x=>x.name.toLowerCase());
        const hasChestPain = names.some(n=>n.includes("chest pain"));
        const hasSOB = names.some(n=>n.includes("shortness of breath"));
        const hasFaint = names.some(n=>n.includes("faint"));
        const hasSeiz = names.some(n=>n.includes("seizure"));
        if(hasChestPain || hasSOB || hasFaint || hasSeiz) triage = "SOON";
        else triage = "ROUTINE";
      }

      // Child safety bias
      if(isChild && triage==="ROUTINE") triage="SOON";

      return { triage, isChild };
    }

    function buildDifferentials(selected){
      // Not a diagnosis: safe, suggestive differentials based on symptom clusters.
      const names = selected.map(s=>s.name.toLowerCase());
      const out = [];

      const hasFever = names.some(n=>n.includes("fever"));
      const hasCough = names.some(n=>n.includes("cough"));
      const hasSore = names.some(n=>n.includes("sore throat"));
      const hasDiarr = names.some(n=>n.includes("diarrhea"));
      const hasConst = names.some(n=>n.includes("constipation"));
      const hasHeartburn = names.some(n=>n.includes("heartburn"));
      const hasUrineBurn = names.some(n=>n.includes("burning urination"));

      if(hasFever && (hasCough || hasSore)) out.push("Viral respiratory infection (consider COVID/flu-like illness depending on exposure).");
      if(hasDiarr) out.push("Gastroenteritis / food-related irritation / medication-related loose stools.");
      if(hasConst) out.push("Constipation (hydration/fiber/activity factors; medication contributors possible).");
      if(hasHeartburn) out.push("Reflux / gastritis (diet triggers; late meals; caffeine).");
      if(hasUrineBurn) out.push("Urinary tract irritation/infection (consider UTI; especially if frequency/urgency present).");

      if(!out.length) out.push("Non-specific symptom pattern—track trends, triggers, and red flags; consider clinical review if persistent.");
      return out.slice(0, 6);
    }

    function fileToBase64(file){
      return new Promise((resolve, reject)=>{

        reader.onerror = reject;

    // Very lightweight text parsing to map common metrics/labs from pasted report text.
    // This is intentionally conservative.
    function parseReportTextToSignals(text){
      const t = (text||"").replace(/\s+/g, " ").trim();
      const signals = [];

      // Examples: "HbA1c 6.1%", "A1C: 6.2 %"
      const a1c = t.match(/(HbA1c|A1C)\s*[:\-]?\s*(\d{1,2}\.\d)\s*%/i);
      if(a1c) signals.push({type:"lab", name:"HbA1c", value:a1c[2], unit:"%"});

      // Creatinine: "Creatinine 1.3 mg/dL"
      const cr = t.match(/Creatinine\s*[:\-]?\s*(\d{1,2}\.\d)\s*(mg\/dL|umol\/L|µmol\/L)/i);
      if(cr) signals.push({type:"lab", name:"Creatinine", value:cr[1], unit:cr[2]});

      // eGFR: "eGFR 58"
      const egfr = t.match(/eGFR\s*[:\-]?\s*(\d{1,3})/i);
      if(egfr) signals.push({type:"lab", name:"eGFR", value:egfr[1], unit:"mL/min/1.73m²"});

      // Glucose: "Glucose 145 mg/dL"
      const glu = t.match(/Glucose\s*[:\-]?\s*(\d{2,3})\s*(mg\/dL|mmol\/L)/i);
      if(glu) signals.push({type:"metric", name:"Glucose", value:glu[1], unit:glu[2]});

      // BP: "BP 151/86"
      const bp = t.match(/(\bBP\b|Blood Pressure)\s*[:\-]?\s*(\d{2,3})\s*\/\s*(\d{2,3})/i);
      if(bp) signals.push({type:"metric", name:"BP", sys:bp[2], dia:bp[3]});

      // Hemoglobin: "Hb 11.0 g/dL"
      const hb = t.match(/\b(Hb|Hemoglobin)\b\s*[:\-]?\s*(\d{1,2}\.\d)\s*(g\/dL)/i);
      if(hb) signals.push({type:"lab", name:"Hemoglobin", value:hb[2], unit:hb[3]});

      return signals;
    }

    // ---------- Charts ----------
    function drawLineChart(canvas, labels, values){
      const ctx = canvas.getContext("2d");
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = 180 * devicePixelRatio;

      ctx.clearRect(0,0,w,h);

      // grid
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = "#223043";
      for(let i=1;i<=4;i++){
        const y = (h/5)*i;
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      if(!values.length) return;

      const minV = Math.min(...values);
      const maxV = Math.max(...values);
      const pad = (maxV-minV)*0.15 || 1;
      const lo = minV - pad;
      const hi = maxV + pad;

      const xStep = values.length>1 ? (w-20)/(values.length-1) : 1;
      const toY = v => {
        const t = (v - lo) / (hi - lo);
        return (h-18) - t*(h-36);
      };

      ctx.strokeStyle = "#e9eef5";
      ctx.lineWidth = 2.2 * devicePixelRatio;
      ctx.beginPath();
      values.forEach((v,i)=>{
        const x = 10 + i*xStep;
        const y = toY(v);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();

      // dots
      ctx.fillStyle = "#e9eef5";
      values.forEach((v,i)=>{
        const x = 10 + i*xStep;
        const y = toY(v);
        ctx.beginPath(); ctx.arc(x,y,3.2*devicePixelRatio,0,Math.PI*2); ctx.fill();
      });

      // label
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = "#e9eef5";
      ctx.font = `${12*devicePixelRatio}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      const last = values[values.length-1];
      ctx.fillText(`Latest: ${last}`, 10, 14*devicePixelRatio);
      ctx.globalAlpha = 1;
    }

    // ---------- Reports ----------
    function inRange(tsISO, startISO, endISO){
      const t = new Date(tsISO).getTime();
      const a = new Date(startISO+"T00:00:00").getTime();
      const b = new Date(endISO+"T23:59:59").getTime();
      return t>=a && t<=b;
    }

    function buildCSV(rows){
      const esc = v => `"${String(v ?? "").replaceAll('"','""')}"`;
      if(!rows.length) return "";
      const headers = Object.keys(rows[0]);
      const lines = [headers.map(esc).join(",")];
      rows.forEach(r=>{
        lines.push(headers.map(h=>esc(r[h])).join(","));
      });
      return lines.join("\n");
    }

    function downloadText(filename, text, mime="text/plain"){
      const blob = new Blob([text], {type:mime});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

            </div>

            <div class="hr"></div>

            <div class="hr"></div>

              <li>Type 1: Hard separate pellets — constipation</li>

    function viewSymptoms(){

      const list = (SYMPTOM_LIBRARY[area.key] || []).slice().sort((a,b)=>a.name.localeCompare(b.name));
      const searchResults = symptomSearch(state.symptomSearch);

      return `
        <div class="grid">
          <div class="card">
            <div class="h">Symptom Diagnoser</div>
            <div class="small muted">

              ${isChild ? "Child mode bias active (safety): triage escalates more readily." : ""}
            </div>

            <div class="hr"></div>

            <div class="split">
              <div>
                <div class="label">Body area</div>
                <select id="symArea">
                  ${BODY_AREAS.map(a=>`<option value="${a.key}" ${a.key===state.symptomAreaKey?"selected":""}>${escapeHtml(a.label)}</option>`).join("")}
                </select>

                <div class="hr"></div>

                <div class="label">Search symptoms (recommended)</div>
                <input id="symSearch" placeholder="e.g., stomach ache, dizziness, blurry vision..." value="${escapeHtml(state.symptomSearch)}" />

                <div class="small muted" style="margin-top:6px;">
                  Search covers synonyms. Results are capped for performance.
                </div>

                <div class="hr"></div>

                <div class="h">Results</div>
                <div class="chipRow" id="symResults">
                  ${renderSymptomChips(searchResults)}
                </div>

                <div class="hr"></div>

                <div class="h">Browse symptoms in selected body area</div>
                <div class="chipRow">
                  ${renderSymptomChips(list.map(x=>({areaKey:area.key, areaLabel:area.label, name:x.name, synonyms:x.synonyms||[], redFlag:!!x.redFlag})))}
                </div>

              </div>

              <div>
                <div class="h">Selected symptoms (session)</div>
                <div class="small muted">Up to 10 symptoms per session.</div>

                <div class="hr"></div>

                <div id="selectedBox">
                  ${renderSelectedSymptoms()}
                </div>

                <div class="hr"></div>

                <div class="label">Session notes (optional)</div>
                <textarea id="symNotes" placeholder="Add context: onset, triggers, meds changes, travel, etc."></textarea>

                <div class="row" style="margin-top:10px;">
                  <button class="btn btnPrimary" id="runSymBtn">Run HC+ Engine</button>
                  <button class="btn" id="clearSymSelBtn">Clear selection</button>
                </div>

                <div class="hr"></div>
                <div class="h">Last saved session</div>
                ${renderLastSymSession()}

            </div>
          </div>

          <div class="card">
            <div class="h">Coverage / Scale (Option B)</div>
            <ul>
              <li>This build includes the full body-area taxonomy and a starter symptom library + synonym search.</li>
              <li>To reach full Option B scale (1,500+ symptoms), paste additional lists into <span class="mono">SYMPTOM_LIBRARY</span>.</li>
              <li>If you want, I will generate the complete extended library in 3–5 paste-safe chunks.</li>
            </ul>
          </div>
        </div>
      `;
    }

    function renderSymptomChips(items){
      if(!items || !items.length) return `<div class="muted">No items.</div>`;
      return items.map(s=>{
        const key = `${s.areaKey}::${s.name}`;
        const active = state.selectedSymptoms.some(x=>x.key===key);
        return `<div class="chip ${active?"active":""}" data-sym="${escapeHtml(key)}" data-area="${escapeHtml(s.areaKey)}" data-name="${escapeHtml(s.name)}" data-red="${s.redFlag?"1":"0"}">${escapeHtml(s.name)}${s.redFlag?" •":""}</div>`;
      }).join("");
    }

    function renderSelectedSymptoms(){
      if(!state.selectedSymptoms.length) return `<div class="muted">No symptoms selected yet.</div>`;
      return state.selectedSymptoms.map((s, idx)=>`
        <div class="entry">
          <div class="row" style="justify-content:space-between;">
            <div><b>${escapeHtml(s.name)}</b> <span class="muted">(${escapeHtml(s.areaLabel)})</span> ${s.redFlag?`<span class="${triageStyle("URGENT")}">RED FLAG</span>`:""}</div>
            <button class="btn" data-remove-sel="${idx}">Remove</button>
          </div>
          <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-top:10px;">
            <div>
              <div class="label">Severity</div>
              <select data-sev="${idx}">
                ${["mild","moderate","severe"].map(v=>`<option value="${v}" ${s.severity===v?"selected":""}>${v}</option>`).join("")}
              </select>
            </div>
            <div>
              <div class="label">Onset</div>
              <select data-onset="${idx}">

            <div>
              <div class="label">Pattern</div>
              <select data-pattern="${idx}">
                ${["constant","comes/goes","worse at night","worse after meals","worse with activity"].map(v=>`<option value="${v}" ${s.pattern===v?"selected":""}>${v}</option>`).join("")}
              </select>

          </div>
        </div>
      `).join("");
    }

      const p = state.profile || {};
      const age = computeAge(p.dob);

          <div class="card">
            <div class="h">Profile</div>

                <div class="label">Sex</div>
                <select id="pSex">
                  <option value="" ${p.sex===""?"selected":""}>—</option>
                  <option value="Male" ${p.sex==="Male"?"selected":""}>Male</option>

    // ---------- Small UI helpers ----------
    function fieldSelect(label, id, options, defaultValue){
      const opts = options.map(o=>{
        const v = String(o);
        return `<option value="${escapeHtml(v)}" ${v===String(defaultValue)?"selected":""}>${escapeHtml(v)}</option>`;
      }).join("");
      return `<div><div class="label">${escapeHtml(label)}</div><select id="${escapeHtml(id)}">${opts}</select></div>`;
    }
    function fieldNumber(label, id, defaultValue, min, max){
      return `<div><div class="label">${escapeHtml(label)}</div><input id="${escapeHtml(id)}" type="number" value="${defaultValue}" min="${min}" max="${max}"></div>`;
    }
    function check(id, label){
      return `<label class="check"><input type="checkbox" id="${escapeHtml(id)}"><span>${escapeHtml(label)}</span></label>`;
    }

    // ---------- Events ----------
    function wireEvents(){
      // Tabs
      qsa(".tabs button").forEach(b=>{
        b.addEventListener("click", ()=>{
          state.tab = b.getAttribute("data-tab");
          render();
        });
      });

      // Person select
      const ps = qs("#personSelect");
      if(ps){
        ps.addEventListener("change", ()=>{
          state.activeUserId = ps.value;
          setActiveUserId(state.activeUserId);
          refreshUserData();
          state.selectedSymptoms = [];
          render();
        });
      }

      // Add person
      const addBtn = qs("#addPersonBtn");
      if(addBtn){
        addBtn.addEventListener("click", ()=>{
          const name = (qs("#newPersonName")?.value || "").trim();
          if(!name) return;
          if(state.users.length >= MAX_FAMILY) return alert("Family limit reached (10).");
          const id = uid();
          state.users.push({id, name});
          saveUsers(state.users);
          state.activeUserId = id;
          setActiveUserId(id);
          refreshUserData();
          const n = qs("#newPersonName"); if(n) n.value="";
          render();
        });
      }

      // Delete person
      const delBtn = qs("#delPersonBtn");
      if(delBtn){
        delBtn.addEventListener("click", ()=>{
          if(state.activeUserId==="me") return;
          if(!confirm("Delete this person and ALL their stored data?")) return;
          const id = state.activeUserId;
          state.users = state.users.filter(u=>u.id!==id);
          saveUsers(state.users);
          localStorage.removeItem(keyProfile(id));
          localStorage.removeItem(keyMetrics(id));
          localStorage.removeItem(keyGI(id));
          localStorage.removeItem(keySymptoms(id));
          localStorage.removeItem(keyAttach(id));
          state.activeUserId = "me";
          setActiveUserId("me");
          refreshUserData();
          render();
        });
      }

      // Snapshot quick
      const goAdd = qs("#goAddFromSnap");
      if(goAdd) goAdd.addEventListener("click", ()=>{ state.tab="ADD"; render(); });
      const goSym = qs("#goSymptomsFromSnap");
      if(goSym) goSym.addEventListener("click", ()=>{ state.tab="SYMPTOMS"; render(); });
      const goRep = qs("#goReportsFromSnap");
      if(goRep) goRep.addEventListener("click", ()=>{ state.tab="REPORTS"; render(); });

      const printSnap = qs("#printSnapBtn");
      if(printSnap) printSnap.addEventListener("click", ()=> window.print());

      const emailDoctor = qs("#emailDoctorBtn");
      if(emailDoctor){
        emailDoctor.addEventListener("click", ()=>{
          const text = (qs("#doctorSummaryText")?.textContent || "").trim();
          const subject = encodeURIComponent(`${APP_NAME} summary — ${activeUserLabel()}`);
          const body = encodeURIComponent(text);
          window.location.href = `mailto:?subject=${subject}&body=${body}`;
        });
      }

      const exportDoctorCSV = qs("#exportDoctorCSVBtn");
      if(exportDoctorCSV){
        exportDoctorCSV.addEventListener("click", ()=>{
          const rows = exportAllMetricsRows();
          const csv = buildCSV(rows);
          downloadText(`HC+_${activeUserLabel().replace(/\s+/g,"_")}_all_metrics.csv`, csv, "text/csv");
        });
      }

      // ADD tab saves
      const m = state.metrics;

      const saveGluBtn = qs("#saveGluBtn");
      if(saveGluBtn){
        saveGluBtn.addEventListener("click", ()=>{
          const v = clampInt(qs("#gluVal")?.value, 0, 999);
          if(!v) return alert("Enter glucose value.");
          const src = qs("#gluSrc")?.value || "CGM";
          m.glucose.unshift({ts:new Date().toISOString(), value:v, source:src});
          saveMetrics(state.activeUserId, m);
          refreshUserData();
          state.tab="SNAPSHOT";
          render();
        });
      }

      const saveBpBtn = qs("#saveBpBtn");
      if(saveBpBtn){
        saveBpBtn.addEventListener("click", ()=>{
          const sys = clampInt(qs("#bpSys")?.value, 0, 300);
          const dia = clampInt(qs("#bpDia")?.value, 0, 200);
          if(!sys || !dia) return alert("Enter systolic and diastolic.");
          const pulse = clampInt(qs("#bpPulse")?.value || 0, 0, 250) || null;
          const note = (qs("#bpNote")?.value || "").slice(0,200);
          m.bp.unshift({ts:new Date().toISOString(), sys, dia, pulse, note});
          saveMetrics(state.activeUserId, m);
          refreshUserData();
          state.tab="SNAPSHOT";
          render();
        });
      }

      const saveWtBtn = qs("#saveWtBtn");
      if(saveWtBtn){
        saveWtBtn.addEventListener("click", ()=>{
          const kg = clampNum(qs("#wtKg")?.value, 0, 500);
          if(!kg) return alert("Enter weight.");
          m.weight.unshift({ts:new Date().toISOString(), kg:Math.round(kg*10)/10});
          saveMetrics(state.activeUserId, m);
          refreshUserData();
          state.tab="SNAPSHOT";
          render();
        });
      }

      const saveSleepBtn = qs("#saveSleepBtn");
      if(saveSleepBtn){
        saveSleepBtn.addEventListener("click", ()=>{
          const hours = clampNum(qs("#slHours")?.value, 0, 24);
          if(!hours) return alert("Enter sleep hours.");
          const score = clampInt(qs("#slScore")?.value || 0, 0, 100) || null;
          m.sleep.unshift({ts:new Date().toISOString(), hours:Math.round(hours*10)/10, score});
          saveMetrics(state.activeUserId, m);
          refreshUserData();
          state.tab="SNAPSHOT";
          render();
        });
      }

      const saveO2Btn = qs("#saveO2Btn");
      if(saveO2Btn){
        saveO2Btn.addEventListener("click", ()=>{
          const min = clampInt(qs("#o2Min")?.value, 0, 100);
          if(!min) return alert("Enter SpO₂ minimum.");
          const note = (qs("#o2Note")?.value || "").slice(0,200);
          m.spo2.unshift({ts:new Date().toISOString(), min, note});
          saveMetrics(state.activeUserId, m);

          if(!area) return;

          const exists = state.selectedSymptoms.some(x=>x.key===key);
          if(exists){
            state.selectedSymptoms = state.selectedSymptoms.filter(x=>x.key!==key);
          }else{
            if(state.selectedSymptoms.length >= 10) return alert("Max 10 symptoms per session.");
            state.selectedSymptoms.push({
              key,
              areaKey,
              areaLabel: area.label,
              name,
              redFlag: red,
              severity: "mild",
              onset: "today",
              pattern: "comes/goes",
            });
          }

        });
      });

      qsa("[data-remove-sel]").forEach(btn=>{
        btn.addEventListener("click", ()=>{

      qsa("[data-sev]").forEach(sel=>{

      qsa("[data-pattern]").forEach(sel=>{

      const clearSymSelBtn = qs("#clearSymSelBtn");

      const runSymBtn = qs("#runSymBtn");
      if(runSymBtn){
        runSymBtn.addEventListener("click", ()=>{

          const notes = (qs("#symNotes")?.value || "").slice(0,1000);

          const differentials = buildDifferentials(state.selectedSymptoms);

          const nextSteps = [];
          if(tri.triage==="URGENT"){
            nextSteps.push("Seek urgent medical assessment now (emergency/ER).");
            nextSteps.push("If chest pain, shortness of breath, fainting, severe weakness, or new neurologic symptoms: treat as emergency.");
          }else if(tri.triage==="SOON"){
            nextSteps.push("Arrange prompt clinical review (24–72 hours).");
            nextSteps.push("Monitor symptoms; escalate if worse or new red flags appear.");

            nextSteps.push("Escalate if persistent, worsening, or new red flags appear.");

          const text = (qs("#pasteText")?.value || "");

          const signals = parseReportTextToSignals(text);
          if(!signals.length) return alert("No recognizable labs/metrics found. Try pasting more complete text.");

          const now = new Date().toISOString();
          const metrics = state.metrics;

          signals.forEach(s=>{
            if(s.type==="metric" && s.name==="Glucose"){
              metrics.glucose.unshift({ts:now, value:clampInt(s.value,0,999), source:"Lab"});
            }
            if(s.type==="metric" && s.name==="BP"){
              metrics.bp.unshift({ts:now, sys:clampInt(s.sys,0,300), dia:clampInt(s.dia,0,200), pulse:null, note:"Parsed from report text"});
            }
            if(s.type==="lab"){
              metrics.labs.unshift({ts:now, name:s.name, value:String(s.value), unit:s.unit||""});
            }
          });

          saveMetrics(state.activeUserId, metrics);
          refreshUserData();
          state.tab="SNAPSHOT";
          render();
        });

          const end = new Date();

          if(preset==="daily") start.setDate(end.getDate());
          if(preset==="weekly") start.setDate(end.getDate()-6);
          if(preset==="monthly") start.setDate(end.getDate()-29);
          qs("#repStart").value = start.toISOString().slice(0,10);
          qs("#repEnd").value = end.toISOString().slice(0,10);
        });

          if(!s || !e) return alert("Select dates.");
          const rows = exportAllMetricsRows().filter(r=>inRange(r.ts, s, e));
          const out = qs("#reportOut");
          if(!rows.length){
            out.textContent = "No rows in that range.";
            return;
          }

            `Report for: ${activeUserLabel()}`,
            `Range: ${s} to ${e}`,
            `Rows: ${rows.length}`,

          ].join("\n");

          out.dataset.rows = JSON.stringify(rows);

    function collectGIForm(){
      const bristol = clampInt(qs("#gi_bristol")?.value ?? 4, 1, 7);
      const frequency = clampInt(qs("#gi_frequency")?.value ?? 1, 0, 20);
      const urgency = qs("#gi_urgency")?.value ?? "none";
      const pain = qs("#gi_pain")?.value ?? "none";
      const durationDays = clampInt(qs("#gi_durationDays")?.value ?? 1, 0, 365);
      const urineColor = clampInt(qs("#gi_urineColor")?.value ?? 0, 0, 8);
      const redFlags = {
        blood: !!qs("#gi_blood")?.checked,
        blackTarry: !!qs("#gi_blackTarry")?.checked,
        fever: !!qs("#gi_fever")?.checked,
        severePain: !!qs("#gi_severePain")?.checked,
        vomiting: !!qs("#gi_vomiting")?.checked,
        weightLoss: !!qs("#gi_weightLoss")?.checked,
        wateryOver48h: !!qs("#gi_wateryOver48h")?.checked,
      };
      const notes = (qs("#gi_notes")?.value || "").slice(0,1000);
      return { bristol, frequency, urgency, pain, durationDays, urineColor, redFlags, notes };
    }

    function setDefaultGIForm(){
      const setVal=(id,v)=>{ const el=qs("#"+id); if(el) el.value=v; };
      setVal("gi_bristol",4);
      setVal("gi_frequency",1);
      setVal("gi_urgency","none");
      setVal("gi_pain","none");
      setVal("gi_durationDays",1);
      setVal("gi_urineColor",3);
      const notes=qs("#gi_notes"); if(notes) notes.value="";
      ["gi_blood","gi_blackTarry","gi_fever","gi_severePain","gi_vomiting","gi_weightLoss","gi_wateryOver48h"].forEach(id=>{
        const el=qs("#"+id); if(el) el.checked=false;
      });
    }

    function exportAllMetricsRows(){
      const p = state.profile || {};
      const m = state.metrics || {};
      const gi = state.gi || [];
      const rows = [];
      const add = (ts, type, metric, value) => rows.push({ ts, type, metric, value });

      (m.glucose||[]).forEach(x=> add(x.ts, "metric", "Glucose", `${x.value} (${x.source})`));
      (m.bp||[]).forEach(x=> add(x.ts, "metric", "BP", `${x.sys}/${x.dia} pulse ${x.pulse||"—"} ${x.note?("["+x.note+"]"):""}`));
      (m.weight||[]).forEach(x=> add(x.ts, "metric", "Weight", `${x.kg} kg`));
      (m.sleep||[]).forEach(x=> add(x.ts, "metric", "Sleep", `${x.hours} h score ${x.score||"—"}`));
      (m.spo2||[]).forEach(x=> add(x.ts, "metric", "SpO2", `min ${x.min}% ${x.note?("["+x.note+"]"):""}`));
      (m.labs||[]).forEach(x=> add(x.ts, "lab", x.name, `${x.value}${x.unit?(" "+x.unit):""}`));

      gi.forEach(x=>{
        const c = x.computed || computeGiStability(x);
        add(x.ts, "GI", "GI Stability", `${c.score}/100 ${c.triage}`);
      });

      (state.symptomSessions||[]).forEach(s=>{
        add(s.ts, "symptom", "Symptom session", `${s.triage} — ${s.selected.map(z=>z.name).join("; ")}`);
      });

      rows.sort((a,b)=> new Date(b.ts)-new Date(a.ts));
      return rows;
    }

    // ---------- After-render chart drawing ----------
    function afterRenderCharts(){
      if(state.tab!=="TRENDS") return;

      const m = state.metrics || {};
      const gi = state.gi || [];

      const glu = (m.glucose||[]).slice(0,25).reverse().map(x=>x.value);
      const bpSys = (m.bp||[]).slice(0,25).reverse().map(x=>x.sys);
      const wt = (m.weight||[]).slice(0,25).reverse().map(x=>x.kg);
      const sl = (m.sleep||[]).slice(0,25).reverse().map(x=>x.hours);
      const o2 = (m.spo2||[]).slice(0,25).reverse().map(x=>x.min);
      const giScore = gi.slice(0,25).reverse().map(x=>(x.computed||computeGiStability(x)).score);

      const draw = (id, arr)=>{
        const c = qs("#"+id);
        if(c) drawLineChart(c, [], arr);
      };

      draw("gluChart", glu);
      draw("bpSysChart", bpSys);
      draw("wtChart", wt);
      draw("slChart", sl);
      draw("o2Chart", o2);
      draw("giChart", giScore);
    }

    // ---------- Boot ----------
    render();
