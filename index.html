<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>HealthChecker+ — One File Master</title>

  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#0b0f14; color:#e9eef5; }
    .topbar { position:sticky; top:0; z-index:10; background:#0b0f14; border-bottom:1px solid #1b2430; padding:14px 16px; }
    .wrap { max-width:1200px; margin:0 auto; padding:16px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .title { font-weight:900; font-size:18px; }
    .sub { opacity:.75; font-size:12px; margin-top:2px; }
    .tabs button {
      border:1px solid #223043; background:#0f1620; color:#e9eef5; padding:10px 12px;
      border-radius:12px; cursor:pointer; font-size:13px;
    }
    .tabs button.active { border-color:#6a4d00; background:#16120a; }
    select,input,textarea {
      border:1px solid #223043; background:#0b0f14; color:#e9eef5; border-radius:12px;
      padding:10px; font-size:13px; outline:none;
    }
    textarea { min-height:100px; width:100%; }
    .btn { border:1px solid #223043; background:#0b0f14; color:#e9eef5; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:13px; }
    .btnPrimary { border:1px solid #6a4d00; background:#16120a; color:#fff; font-weight:900; }
    .btnDanger { border:1px solid #5c1a1a; background:#2a0f0f; }
    .card {
      border:1px solid #1b2430; background:#0f1620; border-radius:16px; padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
    .h { font-weight:900; margin-bottom:10px; }
    .label { opacity:.8; font-size:12px; margin-bottom:4px; }
    .val { font-weight:900; }
    .hr { height:1px; background:#1b2430; margin:12px 0; }
    .badge { display:inline-block; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:900; letter-spacing:.4px; margin:8px 0; }
    .badge.urgent { background:#5c1a1a; }
    .badge.soon { background:#6b4d00; }
    .badge.routine { background:#143b5a; }
    .badge.stable { background:#1f5a2a; }
    .kvs { display:flex; gap:12px; flex-wrap:wrap; }
    .kv { min-width:150px; }
    .mono { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; opacity:.9; }
    .check { display:flex; gap:10px; align-items:center; padding:10px; border:1px solid #223043; border-radius:12px; background:#0b0f14; }
    .checkgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; }
    .pill { display:inline-flex; gap:8px; align-items:center; padding:8px 10px; border-radius:999px; border:1px solid #223043; background:#0b0f14; }
    .small { font-size:12px; opacity:.85; }
    canvas { width:100%; height:220px; border:1px solid #223043; border-radius:12px; background:#0b0f14; }
    a.link { color:#e9eef5; text-decoration:none; border-bottom:1px dashed #6a4d00; }
    a.link:hover { opacity:.85; }
    .twoCols { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 900px){ .twoCols { grid-template-columns:1fr; } }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    (function(){
      const APP_NAME = "HealthChecker+";
      const APP_VERSION = "One-File Master v1.2.0 (Family10 + Profile + Reports + BP + Symptom Diagnoser)";

      const LS = {
        USERS: "hc_users_v2",
        ACTIVE_USER: "hc_active_user_v2",
        PROFILES: "hc_profiles_v2", // map userId -> profile fields
        METRICS_PREFIX: "hc_metrics_v2_", // + userId
        GI_PREFIX: "hc_gi_entries_v2_",   // + userId
        SYM_PREFIX: "hc_sym_sessions_v2_" // + userId
      };

      const MAX_PEOPLE = 10;

      function uid(){ return `${Date.now()}_${Math.random().toString(16).slice(2)}`; }
      function safeParse(json, fallback){ try { return JSON.parse(json) ?? fallback; } catch { return fallback; } }
      function escapeHtml(s){
        return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
          .replaceAll('"',"&quot;").replaceAll("'","&#039;");
      }
      function qs(sel, root=document){ return root.querySelector(sel); }
      function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
      function setHTML(el, html){ el.innerHTML = html; }
      function clampInt(v, min, max){
        const n = Number.isFinite(+v) ? Math.floor(+v) : min;
        return Math.max(min, Math.min(max, n));
      }
      function clampNum(v, min, max){
        const n = Number.isFinite(+v) ? +v : min;
        return Math.max(min, Math.min(max, n));
      }
      function fmtDateTime(iso){ try { return new Date(iso).toLocaleString(); } catch { return iso; } }
      function fmtDate(iso){ try { return new Date(iso).toLocaleDateString(); } catch { return iso; } }

      function triageStyle(triage){
        if (triage === "URGENT") return "badge urgent";
        if (triage === "SOON") return "badge soon";
        if (triage === "ROUTINE") return "badge routine";
        return "badge stable";
      }

      // -----------------------------
      // Users / Profile (Family Mode)
      // -----------------------------
      const DEFAULT_USERS = [{ id:"me", name:"Me" }];

      const DEFAULT_PROFILE = {
        name: "Me",
        sex: "male", // male | female | prefer_not
        dob: "",      // yyyy-mm-dd
        heightCm: 0,
        weightKg: 0,
        conditions: [], // array of strings
        notes: ""
      };

      const CONDITION_OPTIONS = [
        "Diabetes / Prediabetes",
        "Hypertension",
        "CKD / Kidney disease",
        "Heart disease",
        "Stroke / Seizure history",
        "High cholesterol",
        "Fatty liver / NAFLD",
        "Asthma / COPD",
        "Gout",
        "GERD / Acid reflux",
        "IBS / IBD",
        "Thyroid disorder",
        "Depression / Anxiety"
      ];

      function loadUsers(){
        const stored = safeParse(localStorage.getItem(LS.USERS), null);
        if (Array.isArray(stored) && stored.length) return stored;
        localStorage.setItem(LS.USERS, JSON.stringify(DEFAULT_USERS));
        localStorage.setItem(LS.ACTIVE_USER, "me");
        // bootstrap profile map
        const profiles = {};
        profiles["me"] = { ...DEFAULT_PROFILE, name:"Me" };
        localStorage.setItem(LS.PROFILES, JSON.stringify(profiles));
        return DEFAULT_USERS;
      }
      function saveUsers(users){ localStorage.setItem(LS.USERS, JSON.stringify(users)); }
      function loadActiveUserId(){ return localStorage.getItem(LS.ACTIVE_USER) || "me"; }
      function setActiveUserId(id){ localStorage.setItem(LS.ACTIVE_USER, id); }

      function loadProfilesMap(){
        const m = safeParse(localStorage.getItem(LS.PROFILES), {});
        return (m && typeof m === "object") ? m : {};
      }
      function saveProfilesMap(m){ localStorage.setItem(LS.PROFILES, JSON.stringify(m)); }
      function getProfile(userId){
        const map = loadProfilesMap();
        if (!map[userId]){
          map[userId] = { ...DEFAULT_PROFILE, name: (userId==="me" ? "Me" : "Person") };
          saveProfilesMap(map);
        }
        return map[userId];
      }
      function setProfile(userId, profile){
        const map = loadProfilesMap();
        map[userId] = profile;
        saveProfilesMap(map);
      }
      function calcAge(dob){
        if (!dob) return null;
        const d = new Date(dob);
        if (Number.isNaN(d.getTime())) return null;
        const now = new Date();
        let age = now.getFullYear() - d.getFullYear();
        const m = now.getMonth() - d.getMonth();
        if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
        return age;
      }
      function calcBMI(heightCm, weightKg){
        const h = (+heightCm || 0) / 100;
        const w = (+weightKg || 0);
        if (!h || !w) return null;
        return w / (h*h);
      }

      // -----------------------------
      // Metrics storage (per person)
      // -----------------------------
      function metricsKey(userId){ return LS.METRICS_PREFIX + userId; }
      function loadMetrics(userId){
        const m = safeParse(localStorage.getItem(metricsKey(userId)), null);
        if (m && typeof m === "object") return m;
        const fresh = {
          glucose: [], // {ts, mgdl, note?}
          bp: [],      // {ts, sys, dia, pulse?, note?}
          sleep: [],   // {ts, hours, score?, note?}
          spo2: [],    // {ts, pct, note?}
          egfr: [],    // {ts, value, note?}
          a1c: [],     // {ts, value, note?}
        };
        localStorage.setItem(metricsKey(userId), JSON.stringify(fresh));
        return fresh;
      }
      function saveMetrics(userId, m){ localStorage.setItem(metricsKey(userId), JSON.stringify(m)); }

      // -----------------------------
      // GI storage (per person)
      // -----------------------------
      const DEFAULT_RED_FLAGS = {
        blood:false, blackTarry:false, fever:false, severePain:false, vomiting:false, weightLoss:false, wateryOver48h:false
      };
      function giKey(userId){ return LS.GI_PREFIX + userId; }
      function loadGi(userId){
        const arr = safeParse(localStorage.getItem(giKey(userId)), []);
        return Array.isArray(arr) ? arr : [];
      }
      function saveGi(userId, arr){ localStorage.setItem(giKey(userId), JSON.stringify(arr)); }

      function computeGiStability(entry){
        const bristol = clampInt(entry.bristol,1,7);
        const frequency = clampInt(entry.frequency,0,20);
        const urgency = entry.urgency || "none";
        const pain = entry.pain || "none";
        const durationDays = clampInt(entry.durationDays,0,365);
        const urineColor = clampInt(entry.urineColor||0,0,8);
        const rf = entry.redFlags || DEFAULT_RED_FLAGS;

        const anyRedFlag = Object.values(rf).some(Boolean);

        let triageOverride = null;
        if (anyRedFlag){
          if (rf.blackTarry || rf.blood || rf.severePain || rf.vomiting) triageOverride = "URGENT";
          else triageOverride = "SOON";
        }

        let score = 100;
        const bristolPenalty = {4:0,3:5,5:10,2:15,6:20,1:25,7:30};
        score -= (bristolPenalty[bristol] ?? 15);

        if (frequency === 0) score -= 15;
        else if (frequency === 3) score -= 5;
        else if (frequency >= 4 && frequency <= 5) score -= 10;
        else if (frequency >= 6) score -= 20;

        if (urgency === "sometimes") score -= 5;
        else if (urgency === "often") score -= 15;

        if (pain === "mild") score -= 5;
        else if (pain === "moderate") score -= 10;
        else if (pain === "severe") score -= 20;

        if (durationDays >= 2 && durationDays <= 3) score -= 5;
        else if (durationDays >= 4 && durationDays <= 7) score -= 10;
        else if (durationDays > 7) score -= 15;

        if (urineColor >= 4 && urineColor <= 5) score -= 5;
        else if (urineColor >= 6) score -= 10;

        score = clampInt(score,0,100);

        let band = "Stable";
        if (score < 40) band = "Highly unstable";
        else if (score < 60) band = "Unstable";
        else if (score < 80) band = "Mildly unstable";

        let triage = "ROUTINE";
        if (triageOverride) triage = triageOverride;
        else {
          if (score < 40) triage = "SOON";
          else if (score < 60 && durationDays >= 4) triage = "SOON";
          else if (score >= 80) triage = "STABLE";
          else triage = "ROUTINE";
        }

        const summary = `Bristol ${bristol}, ${frequency}/day, urgency: ${urgency}, pain: ${pain}, red flags: ${anyRedFlag ? "yes" : "no"}.`;
        return { score, band, triage, summary, anyRedFlag };
      }
      function buildGiActionPlan(entry, computed){
        const bristol = clampInt(entry.bristol,1,7);
        if (computed.triage === "URGENT"){
          return [
            "Urgent pattern detected (red flags). Seek urgent medical assessment.",
            "Hydrate in small, frequent sips while arranging care if safe.",
            "Avoid NSAIDs (ibuprofen/naproxen) unless clinician-approved (kidney safety)."
          ];
        }
        if (computed.triage === "SOON"){
          return [
            "Concerning or persistent pattern. Arrange prompt clinical review (24–72h).",
            "Prioritize hydration; consider oral rehydration solution if stools are loose.",
            "Avoid heavy/fatty meals and alcohol until stable."
          ];
        }
        if (bristol === 1 || bristol === 2){
          return [
            "Constipation tendency: increase water and add fiber gradually (vegetables; psyllium if tolerated).",
            "Gentle daily activity (10–20 minutes walking).",
            "Escalate if pain, bleeding, or no stool >3 days."
          ];
        }
        if (bristol === 6 || bristol === 7){
          return [
            "Diarrhea tendency: prioritize hydration; consider electrolytes.",
            "Reduce greasy/high-fat foods, very spicy meals, excess caffeine temporarily.",
            "Escalate if watery diarrhea >48h (or >24h with dehydration/CKD risk)."
          ];
        }
        return [
          "Maintain: Types 3–4 are typically the target range.",
          "If urgency/pain persists, review trigger foods and hydration.",
          "Reassess if new red flags appear."
        ];
      }

      // -----------------------------
      // Symptom Diagnoser (common language, body areas)
      // -----------------------------
      const BODY_AREAS = [
        { id:"head", name:"Head / Face / Eyes" },
        { id:"chest", name:"Chest / Heart / Lungs" },
        { id:"abdomen", name:"Stomach / Abdomen" },
        { id:"urinary", name:"Urinary / Kidney / Genitals" },
        { id:"neuro", name:"Nerves / Weakness / Balance" },
        { id:"skin", name:"Skin / Rash / Allergies" },
        { id:"muscle", name:"Muscles / Joints / Back" },
        { id:"general", name:"General (Fever, Fatigue, Weight)" }
      ];

      // This library is intentionally broad and plain-language; it is also searchable.
      // You can expand it anytime without changing engine logic.
      const SYMPTOMS = [
        // Head/Face/Eyes
        { area:"head", key:"headache", label:"Headache / head pounding" },
        { area:"head", key:"sudden_worst_headache", label:"Sudden worst headache of your life" },
        { area:"head", key:"dizzy", label:"Dizziness / lightheaded" },
        { area:"head", key:"fainting", label:"Fainted / passed out" },
        { area:"head", key:"blurred_vision", label:"Blurred vision / can't see well" },
        { area:"head", key:"eye_pain", label:"Eye pain / pressure" },
        { area:"head", key:"face_droop", label:"Face drooping / uneven smile" },
        { area:"head", key:"slurred_speech", label:"Slurred speech / can't speak clearly" },

        // Chest
        { area:"chest", key:"chest_pain", label:"Chest pain / tightness" },
        { area:"chest", key:"short_breath", label:"Shortness of breath" },
        { area:"chest", key:"palpitations", label:"Heart racing / pounding" },
        { area:"chest", key:"cough", label:"Cough" },
        { area:"chest", key:"wheezing", label:"Wheezing / asthma flare" },

        // Abdomen
        { area:"abdomen", key:"abdominal_pain", label:"Belly pain / cramps" },
        { area:"abdomen", key:"vomiting", label:"Vomiting" },
        { area:"abdomen", key:"diarrhea", label:"Diarrhea / watery stool" },
        { area:"abdomen", key:"constipation", label:"Constipation / hard stool" },
        { area:"abdomen", key:"blood_in_stool", label:"Blood in stool" },
        { area:"abdomen", key:"black_stool", label:"Black/tarry stool" },

        // Urinary/Kidney
        { area:"urinary", key:"burning_urine", label:"Burning when urinating" },
        { area:"urinary", key:"frequent_urine", label:"Urinating too often" },
        { area:"urinary", key:"can_not_pee", label:"Can't urinate / very low urine" },
        { area:"urinary", key:"foamy_urine", label:"Foamy urine" },
        { area:"urinary", key:"blood_urine", label:"Blood in urine" },
        { area:"urinary", key:"flank_pain", label:"Side/back pain near kidney area" },

        // Neuro
        { area:"neuro", key:"one_side_weak", label:"One side weak or numb" },
        { area:"neuro", key:"confusion", label:"Confusion / not thinking right" },
        { area:"neuro", key:"seizure", label:"Seizure / shaking episode" },
        { area:"neuro", key:"loss_balance", label:"Loss of balance / can't walk straight" },

        // Skin
        { area:"skin", key:"rash", label:"Rash / hives" },
        { area:"skin", key:"swelling_face", label:"Face/lip swelling" },
        { area:"skin", key:"itching", label:"Itching all over" },

        // Muscles/Joints/Back
        { area:"muscle", key:"back_pain", label:"Lower back pain" },
        { area:"muscle", key:"joint_pain", label:"Joint pain / swelling" },
        { area:"muscle", key:"leg_swelling", label:"Leg/ankle swelling" },

        // General
        { area:"general", key:"fever", label:"Fever / hot body" },
        { area:"general", key:"fatigue", label:"Extreme tiredness / weakness" },
        { area:"general", key:"weight_loss", label:"Unintentional weight loss" },
        { area:"general", key:"high_sugar_symptoms", label:"Very thirsty / peeing a lot / sweet breath" }
      ];

      const SYM_RED_FLAGS = new Set([
        "sudden_worst_headache","fainting","face_droop","slurred_speech",
        "chest_pain","short_breath",
        "one_side_weak","confusion","seizure",
        "blood_in_stool","black_stool","blood_urine","can_not_pee","swelling_face"
      ]);

      function symptomTriage(selectedKeys, meta, profile){
        const keys = new Set(selectedKeys || []);
        const severe = (+meta.severity || 0) >= 8;
        const durationH = +meta.durationHours || 0;

        let triage = "ROUTINE";
        let reasons = [];

        // Immediate red flags
        for (const k of keys){
          if (SYM_RED_FLAGS.has(k)){
            triage = "URGENT";
            reasons.push("Red flag symptom selected.");
            break;
          }
        }

        // High-risk profile modifiers
        const cond = new Set((profile.conditions||[]).map(String));
        const age = calcAge(profile.dob) || null;
        const highRisk = cond.has("CKD / Kidney disease") || cond.has("Heart disease") || cond.has("Stroke / Seizure history") || (age && age >= 60);

        if (triage !== "URGENT"){
          if (severe && (durationH >= 6)) { triage = "SOON"; reasons.push("Severe symptoms lasting hours."); }
          if (highRisk && (severe || keys.has("short_breath") || keys.has("chest_pain"))) { triage = "SOON"; reasons.push("Higher-risk profile (age/conditions)."); }
          if (keys.has("fever") && durationH >= 48) { triage = "SOON"; reasons.push("Fever >48 hours."); }
        }

        // Candidate clusters (plain language)
        const possible = [];
        function add(label, whenKeys){
          const hit = whenKeys.some(k=>keys.has(k));
          if (hit) possible.push(label);
        }
        add("Dehydration / low fluids (especially with diarrhea or vomiting)", ["diarrhea","vomiting","can_not_pee","dizzy","fatigue"]);
        add("Blood pressure / cardiovascular issue (check BP, especially if chest symptoms)", ["chest_pain","palpitations","short_breath","dizzy"]);
        add("Stroke/TIA warning (urgent)", ["face_droop","slurred_speech","one_side_weak","confusion","loss_balance"]);
        add("Infection (viral/cold/flu or urinary infection)", ["fever","cough","burning_urine","frequent_urine"]);
        add("GI irritation/food reaction (spicy/greasy meals, gastritis)", ["abdominal_pain","vomiting","diarrhea"]);
        add("Kidney/urinary issue (kidney stone/UTI/CKD flare)", ["flank_pain","blood_urine","foamy_urine","can_not_pee"]);
        add("Allergic reaction", ["rash","itching","swelling_face","wheezing"]);

        const actions = [];
        if (triage === "URGENT"){
          actions.push("Seek urgent medical assessment now (ER/urgent care).");
          actions.push("If stroke warning signs or severe chest pain: call emergency services.");
          actions.push("Avoid NSAIDs (ibuprofen/naproxen) unless clinician-approved (kidney safety).");
        } else if (triage === "SOON"){
          actions.push("Arrange prompt clinical review within 24–72 hours.");
          actions.push("Hydrate; if vomiting/diarrhea, consider oral rehydration solution.");
          actions.push("Track BP/glucose and note triggers (meal, stress, new meds).");
        } else {
          actions.push("Monitor and log symptoms; reassess if worsening or new red flags appear.");
          actions.push("Hydrate and rest; avoid known trigger foods for 24–48h.");
        }

        return { triage, reasons, possible: (possible.length?possible:["No specific cluster matched — use notes + monitor trends."]), actions };
      }

      function symKey(userId){ return LS.SYM_PREFIX + userId; }
      function loadSymSessions(userId){
        const arr = safeParse(localStorage.getItem(symKey(userId)), []);
        return Array.isArray(arr) ? arr : [];
      }
      function saveSymSessions(userId, arr){ localStorage.setItem(symKey(userId), JSON.stringify(arr)); }

      // -----------------------------
      // Charts (simple canvas line chart)
      // -----------------------------
      function drawLineChart(canvas, points, yLabel){
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const w = canvas.width = canvas.clientWidth * devicePixelRatio;
        const h = canvas.height = canvas.clientHeight * devicePixelRatio;
        ctx.clearRect(0,0,w,h);

        // Background grid
        ctx.globalAlpha = 0.6;
        ctx.strokeStyle = "#223043";
        for (let i=1;i<=4;i++){
          const y = (h*i)/5;
          ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
        }
        ctx.globalAlpha = 1;

        if (!points || points.length < 2){
          ctx.fillStyle = "#e9eef5";
          ctx.globalAlpha = 0.75;
          ctx.font = `${14*devicePixelRatio}px system-ui`;
          ctx.fillText("Not enough data to plot.", 14*devicePixelRatio, 28*devicePixelRatio);
          ctx.globalAlpha = 1;
          return;
        }

        const ys = points.map(p=>p.y);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);
        const pad = (maxY-minY)*0.15 || 1;
        const yMin = minY - pad;
        const yMax = maxY + pad;

        const xMin = points[0].x;
        const xMax = points[points.length-1].x;

        function sx(x){ return ( (x - xMin) / (xMax - xMin || 1) ) * (w - 40*devicePixelRatio) + 20*devicePixelRatio; }
        function sy(y){ return h - ( (y - yMin) / (yMax - yMin || 1) ) * (h - 40*devicePixelRatio) - 20*devicePixelRatio; }

        // Line
        ctx.strokeStyle = "#e9eef5";
        ctx.lineWidth = 2*devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(sx(points[0].x), sy(points[0].y));
        for (let i=1;i<points.length;i++){
          ctx.lineTo(sx(points[i].x), sy(points[i].y));
        }
        ctx.stroke();

        // Labels
        ctx.fillStyle = "#e9eef5";
        ctx.globalAlpha = 0.8;
        ctx.font = `${12*devicePixelRatio}px system-ui`;
        ctx.fillText(`${yLabel} (min ${minY}, max ${maxY})`, 20*devicePixelRatio, 18*devicePixelRatio);
        ctx.globalAlpha = 1;
      }

      // -----------------------------
      // Reports / Export
      // -----------------------------
      function toCSV(rows){
        const esc = (v)=> `"${String(v ?? "").replaceAll('"','""')}"`;
        return rows.map(r=>r.map(esc).join(",")).join("\n");
      }

      function downloadFile(filename, content, type="text/plain"){
        const blob = new Blob([content], {type});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }

      function withinRange(ts, startISO, endISO){
        const t = new Date(ts).getTime();
        const s = startISO ? new Date(startISO).getTime() : -Infinity;
        const e = endISO ? new Date(endISO).getTime() : Infinity;
        return t >= s && t <= e;
      }

      // -----------------------------
      // State
      // -----------------------------
      let state = {
        tab: "SNAPSHOT",
        users: loadUsers(),
        activeUserId: loadActiveUserId(),
        profile: null,

      function parseTextToSuggestions(txt){
        const t = (txt||"").toLowerCase();
        const suggestions = [];

        // Glucose
        const g = t.match(/glucose[^0-9]*([0-9]{2,3})/i) || t.match(/\b([0-9]{2,3})\s*mg\/?dl\b/i);
        if (g) suggestions.push({ type:"glucose", value:+g[1] });

        // BP like 151/86
        const bp = t.match(/\b([0-9]{2,3})\s*\/\s*([0-9]{2,3})\b/);
        if (bp) suggestions.push({ type:"bp", sys:+bp[1], dia:+bp[2] });

        // Pulse
        const p = t.match(/pulse[^0-9]*([0-9]{2,3})/i);
        if (p) suggestions.push({ type:"pulse", value:+p[1] });

        // SpO2
        const sp = t.match(/spo2[^0-9]*([0-9]{2,3})/i) || t.match(/\b([0-9]{2,3})\s*%\s*(spo2|sp02)\b/i);
        if (sp) suggestions.push({ type:"spo2", value:+sp[1] });

        // eGFR
        const eg = t.match(/\begfr[^0-9]*([0-9]{1,3}(\.[0-9]+)?)\b/i);
        if (eg) suggestions.push({ type:"egfr", value:+eg[1] });

        // HbA1c
        const a1 = t.match(/\bhba1c[^0-9]*([0-9]{1,2}(\.[0-9]+)?)\b/i) || t.match(/\ba1c[^0-9]*([0-9]{1,2}(\.[0-9]+)?)\b/i);
        if (a1) suggestions.push({ type:"a1c", value:+a1[1] });

        // Sleep hours: "4h48m" or "4.8"
        const sh = t.match(/sleep[^0-9]*([0-9]{1,2})\s*h\s*([0-9]{1,2})\s*m/i);
        if (sh){
          const hrs = (+sh[1]) + (+sh[2] / 60);
          suggestions.push({ type:"sleep", hours:+hrs.toFixed(2) });
        } else {
          const sh2 = t.match(/sleep[^0-9]*([0-9]{1,2}(\.[0-9]+)?)\s*h/i);
          if (sh2) suggestions.push({ type:"sleep", hours:+sh2[1] });
        }

        // Sleep score
        const ss = t.match(/sleep[^\\n]*score[^0-9]*([0-9]{1,3})/i);
        if (ss) suggestions.push({ type:"sleep_score", value:+ss[1] });

        return suggestions;
      }

      function renderSymptomList(){
        const area = qs("#symArea")?.value || "all";
        const q = (qs("#symSearch")?.value || "").trim().toLowerCase();

        let list = SYMPTOMS.slice();
        if (area !== "all") list = list.filter(s=>s.area === area);
        if (q) list = list.filter(s=>s.label.toLowerCase().includes(q) || s.key.toLowerCase().includes(q));

        const out = qs("#symList");
        if (!out) return;

        setHTML(out, list.map(s=>`
          <label class="check">
            <input type="checkbox" data-sym="${escapeHtml(s.key)}" ${state._symSelected?.includes(s.key)?"checked":""}>
            <span>${escapeHtml(s.label)}</span>
          </label>
        `).join(""));

        // bind checkboxes
        qsa('#symList input[type="checkbox"]').forEach(cb=>{
          cb.addEventListener("change", ()=>{
            const key = cb.getAttribute("data-sym");
            state._symSelected = state._symSelected || [];
            if (cb.checked){
              if (!state._symSelected.includes(key)){
                if (state._symSelected.length >= 10){
                  cb.checked = false;
                  alert("Max 10 symptoms per session.");
                  return;
                }
                state._symSelected.push(key);
              }
            } else {
              state._symSelected = state._symSelected.filter(k=>k!==key);
            }
            renderSelectedSymptoms();
          });
        });

        renderSelectedSymptoms();
      }

      function renderSelectedSymptoms(){
        const box = qs("#symSelected");
        if (!box) return;
        const sel = state._symSelected || [];
        if (!sel.length){
          setHTML(box, "None selected.");
          return;
        }
        const labels = sel.map(k=>{
          const s = SYMPTOMS.find(x=>x.key===k);
          return s ? s.label : k;
        });
        setHTML(box, `<div class="mono">${escapeHtml(labels.join(" | "))}</div>`);
      }

      function renderSymHistory(){
        const box = qs("#symHistory");
        if (!box) return;
        if (!state.symSessions || !state.symSessions.length){
          setHTML(box, "No sessions saved.");
          return;
        }
        setHTML(box, `
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${state.symSessions.map(s=>{

      function buildReport(startISO, endISO, profile){
        const m = state.metrics;
        const gi = state.gi;

        function filter(arr){ return (arr||[]).filter(e=>withinRange(e.ts, startISO, endISO)); }

        const g = filter(m.glucose);
        const bp = filter(m.bp);
        const sl = filter(m.sleep);
        const sp = filter(m.spo2);
        const eg = filter(m.egfr);
        const a1 = filter(m.a1c);
        const giF = filter(gi);

        const last = (arr)=> arr.length ? arr[0] : null;

        const latestG = last(g);
        const latestBP = last(bp);
        const latestGI = last(giF);

        let flags = [];
        const cond = new Set((profile.conditions||[]).map(String));
        if (cond.has("CKD / Kidney disease") && giF.some(x=>x.bristol>=6)) flags.push("Loose stools present during range — dehydration risk for CKD.");
        if (latestBP && (latestBP.sys>=140 || latestBP.dia>=90)) flags.push("BP elevated in range — monitor and manage triggers.");
        if (latestG && latestG.mgdl>=180) flags.push("Glucose high in range — review meal triggers and meds adherence.");

        return {
          counts: { glucose:g.length, bp:bp.length, sleep:sl.length, spo2:sp.length, egfr:eg.length, a1c:a1.length, gi:giF.length },
          latest: { glucose:latestG, bp:latestBP, sleep:last(sl), spo2:last(sp), egfr:last(eg), a1c:last(a1), gi:latestGI },
          flags
        };
      }

      // -----------------------------
      // Events / Wiring
      // -----------------------------
      function wireEvents(){
        // Main tabs
        qsa(".tabs button").forEach(b=>{
          b.addEventListener("click", ()=>{
            state.tab = b.getAttribute("data-tab");
            render();
          });
        });

        // Jump buttons
        qsa("[data-jump]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            state.tab = btn.getAttribute("data-jump");
            render();
          });
        });

        // Person select
        const personSelect = qs("#personSelect");
        if (personSelect){
          personSelect.addEventListener("change", ()=>{
            state.activeUserId = personSelect.value;
            setActiveUserId(state.activeUserId);
            loadAllForActive();
            render();
          });
        }

        // Add person
        const addBtn = qs("#addPersonBtn");
        if (addBtn){
          addBtn.addEventListener("click", ()=>{
            const name = (qs("#newPersonName")?.value||"").trim();
            if (!name) return;

            if (state.users.length >= MAX_PEOPLE){
              alert(`Family Mode limit reached (${MAX_PEOPLE} people).`);
              return;
            }

            const id = uid();
            state.users.push({id, name});
            saveUsers(state.users);
            setProfile(id, { ...DEFAULT_PROFILE, name, sex:"prefer_not" });
            state.activeUserId = id;
            setActiveUserId(id);
            loadAllForActive();

            const n = qs("#newPersonName"); if (n) n.value = "";
            render();
          });
        }

        // Delete person
        const delBtn = qs("#delPersonBtn");
        if (delBtn){
          delBtn.addEventListener("click", ()=>{
            if (state.activeUserId==="me") return;
            if (!confirm("Delete this person and ALL their stored data on this device?")) return;

            const id = state.activeUserId;
            state.users = state.users.filter(u=>u.id!==id);
            saveUsers(state.users);

            localStorage.removeItem(metricsKey(id));
            localStorage.removeItem(giKey(id));
            localStorage.removeItem(symKey(id));

            const pm = loadProfilesMap();
            delete pm[id];
            saveProfilesMap(pm);

            state.activeUserId = "me";
            setActiveUserId("me");
            loadAllForActive();
            render();
          });
        }

        // Snapshot -> GI module
        const openGIBtn = qs("#openGIBtn");
        if (openGIBtn){
          openGIBtn.addEventListener("click", ()=>{
            state.tab = "GI";
            render();
          });
        }

        // Add data saves
        const nowISO = ()=> new Date().toISOString();
        const m = state.metrics;

        const saveEntry = (type, entry)=>{
          const list = m[type];
          m[type] = [ { ts: nowISO(), ...entry }, ...list ];
          saveMetrics(state.activeUserId, m);
          loadAllForActive(); // refresh state
          state.tab = "SNAPSHOT";
          render();
        };

        const saveGluBtn = qs("#saveGluBtn");
        if (saveGluBtn){
          saveGluBtn.addEventListener("click", ()=>{
            const mgdl = clampInt(qs("#gluVal")?.value, 30, 600);
            const note = (qs("#gluNote")?.value||"").slice(0,200);
            saveEntry("glucose", { mgdl, note });
          });
        }

        const saveBPBtn = qs("#saveBPBtn");
        if (saveBPBtn){
          saveBPBtn.addEventListener("click", ()=>{
            const sys = clampInt(qs("#bpSys")?.value, 50, 300);
            const dia = clampInt(qs("#bpDia")?.value, 30, 200);
            const pulse = clampInt(qs("#bpPulse")?.value || 0, 0, 250) || null;
            const note = (qs("#bpNote")?.value||"").slice(0,200);
            saveEntry("bp", { sys, dia, pulse, note });
          });
        }

        const saveSleepBtn = qs("#saveSleepBtn");
        if (saveSleepBtn){
          saveSleepBtn.addEventListener("click", ()=>{
            const hours = clampNum(qs("#slHours")?.value, 0, 24);
            const score = clampInt(qs("#slScore")?.value || 0, 0, 100) || null;
            saveEntry("sleep", { hours, score });
          });
        }

        const saveSpBtn = qs("#saveSpBtn");
        if (saveSpBtn){
          saveSpBtn.addEventListener("click", ()=>{
            const pct = clampInt(qs("#spVal")?.value, 50, 100);
            const note = (qs("#spNote")?.value||"").slice(0,200);
            saveEntry("spo2", { pct, note });
          });
        }

        const saveEgBtn = qs("#saveEgBtn");
        if (saveEgBtn){
          saveEgBtn.addEventListener("click", ()=>{
            const value = clampNum(qs("#egVal")?.value, 0, 200);
            const note = (qs("#egNote")?.value||"").slice(0,200);
            saveEntry("egfr", { value, note });
          });
        }

        const saveA1Btn = qs("#saveA1Btn");
        if (saveA1Btn){
          saveA1Btn.addEventListener("click", ()=>{
            const value = clampNum(qs("#a1Val")?.value, 0, 20);
            const note = (qs("#a1Note")?.value||"").slice(0,200);
            saveEntry("a1c", { value, note });
          });
        }

        // Parse paste-text
        const parseBtn = qs("#parseBtn");
        if (parseBtn){
          parseBtn.addEventListener("click", ()=>{
            const txt = (qs("#pasteBox")?.value || "");
            const suggestions = parseTextToSuggestions(txt);
            const out = qs("#parseOut");
            if (!out) return;

            if (!suggestions.length){
              setHTML(out, "No recognizable values found. Try including lines like: BP 151/86 pulse 58, Glucose 150, SpO2 95%, eGFR 55, HbA1c 6.1");
              return;
            }

            // Build confirm buttons for each suggestion
            const blocks = suggestions.map((s, i)=>{
              if (s.type==="glucose"){
                return `<div class="card" style="background:#0b0f14; border-color:#223043;">
                  <div class="h">Glucose</div><div class="val">${s.value} mg/dL</div>
                  <button class="btn btnPrimary" data-apply="glucose:${s.value}">Confirm & Save</button>
                </div>`;
              }
              if (s.type==="bp"){
                const pulse = suggestions.find(x=>x.type==="pulse")?.value || null;
                return `<div class="card" style="background:#0b0f14; border-color:#223043;">
                  <div class="h">Blood Pressure</div><div class="val">${s.sys}/${s.dia} mmHg</div>
                  <div class="sub">Pulse: ${pulse ?? "—"}</div>
                  <button class="btn btnPrimary" data-apply="bp:${s.sys}:${s.dia}:${pulse ?? ""}">Confirm & Save</button>
                </div>`;
              }
              if (s.type==="spo2"){
                return `<div class="card" style="background:#0b0f14; border-color:#223043;">
                  <div class="h">SpO₂</div><div class="val">${s.value}%</div>
                  <button class="btn btnPrimary" data-apply="spo2:${s.value}">Confirm & Save</button>
                </div>`;
              }
              if (s.type==="egfr"){
                return `<div class="card" style="background:#0b0f14; border-color:#223043;">
                  <div class="h">eGFR</div><div class="val">${s.value}</div>
                  <button class="btn btnPrimary" data-apply="egfr:${s.value}">Confirm & Save</button>
                </div>`;
              }
              if (s.type==="a1c"){
                return `<div class="card" style="background:#0b0f14; border-color:#223043;">
                  <div class="h">HbA1c</div><div class="val">${s.value}%</div>
                  <button class="btn btnPrimary" data-apply="a1c:${s.value}">Confirm & Save</button>
                </div>`;
              }
              if (s.type==="sleep"){
                const score = suggestions.find(x=>x.type==="sleep_score")?.value || null;
                return `<div class="card" style="background:#0b0f14; border-color:#223043;">
                  <div class="h">Sleep</div><div class="val">${s.hours} hours</div>
                  <div class="sub">Score: ${score ?? "—"}</div>
                  <button class="btn btnPrimary" data-apply="sleep:${s.hours}:${score ?? ""}">Confirm & Save</button>
                </div>`;
              }
              return "";
            }).filter(Boolean).join("");

            setHTML(out, `<div class="grid">${blocks}</div>`);

            qsa("[data-apply]").forEach(btn=>{
              btn.addEventListener("click", ()=>{
                const payload = btn.getAttribute("data-apply");
                const parts = payload.split(":");
                const type = parts[0];

                if (type==="glucose"){
                  const v = +parts[1];
                  saveEntry("glucose", { mgdl:v, note:"Parsed from paste" });
                } else if (type==="bp"){
                  const sys = +parts[1], dia = +parts[2];
                  const pulse = parts[3] ? +parts[3] : null;
                  saveEntry("bp", { sys, dia, pulse, note:"Parsed from paste" });
                } else if (type==="spo2"){
                  const v = +parts[1];
                  saveEntry("spo2", { pct:v, note:"Parsed from paste" });
                } else if (type==="egfr"){
                  const v = +parts[1];
                  saveEntry("egfr", { value:v, note:"Parsed from paste" });
                } else if (type==="a1c"){
                  const v = +parts[1];
                  saveEntry("a1c", { value:v, note:"Parsed from paste" });
                } else if (type==="sleep"){
                  const hours = +parts[1];
                  const score = parts[2] ? +parts[2] : null;
                  saveEntry("sleep", { hours, score });
                }
              });
            });
          });
        }

        const clearPasteBtn = qs("#clearPasteBtn");
        if (clearPasteBtn){
          clearPasteBtn.addEventListener("click", ()=>{
            const p = qs("#pasteBox"); if (p) p.value="";
            const out = qs("#parseOut"); if (out) setHTML(out, "Nothing parsed yet.");
          });
        }

        // Trends: clear metrics
        const clearMetricsBtn = qs("#clearMetricsBtn");
        if (clearMetricsBtn){
          clearMetricsBtn.addEventListener("click", ()=>{
            if (!confirm("Clear ALL health metrics for this person?")) return;
            const fresh = { glucose:[], bp:[], sleep:[], spo2:[], egfr:[], a1c:[] };
            saveMetrics(state.activeUserId, fresh);
            loadAllForActive();
            render();
          });
        }

        // GI save/reset/remove/clear
        const saveGiBtn = qs("#saveGiBtn");
        if (saveGiBtn){
          saveGiBtn.addEventListener("click", ()=>{
            const entry = {
              bristol: clampInt(qs("#gi_bristol")?.value, 1,7),
              frequency: clampInt(qs("#gi_frequency")?.value, 0,20),
              urgency: qs("#gi_urgency")?.value || "none",
              pain: qs("#gi_pain")?.value || "none",
              durationDays: clampInt(qs("#gi_durationDays")?.value, 0,365),
              urineColor: clampInt(qs("#gi_urineColor")?.value || 0, 0,8),
              redFlags: {
                blood: !!qs("#gi_blood")?.checked,
                blackTarry: !!qs("#gi_blackTarry")?.checked,
                fever: !!qs("#gi_fever")?.checked,
                severePain: !!qs("#gi_severePain")?.checked,
                vomiting: !!qs("#gi_vomiting")?.checked,
                weightLoss: !!qs("#gi_weightLoss")?.checked,
                wateryOver48h: !!qs("#gi_wateryOver48h")?.checked
              },
              notes: (qs("#gi_notes")?.value || "").slice(0,1000)
            };
            const computed = computeGiStability(entry);
            computed.actionPlan = buildGiActionPlan(entry, computed);
            const stored = { id: uid(), ts: new Date().toISOString(), ...entry, computed };

            state.gi = [stored, ...(state.gi||[])];
            saveGi(state.activeUserId, state.gi);
            loadAllForActive();
            render();
          });
        }

        const resetGiBtn = qs("#resetGiBtn");
        if (resetGiBtn){
          resetGiBtn.addEventListener("click", ()=>{
            const setVal=(id,v)=>{ const el=qs("#"+id); if(el) el.value=v; };
            setVal("gi_bristol",4); setVal("gi_frequency",1); setVal("gi_urgency","none"); setVal("gi_pain","none");
            setVal("gi_durationDays",1); setVal("gi_urineColor",3);
            const notes=qs("#gi_notes"); if(notes) notes.value="";
            ["gi_blood","gi_blackTarry","gi_fever","gi_severePain","gi_vomiting","gi_weightLoss","gi_wateryOver48h"].forEach(id=>{
              const el=qs("#"+id); if(el) el.checked=false;
            });
          });
        }

        qsa("[data-gi-remove]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const id = btn.getAttribute("data-gi-remove");
            state.gi = (state.gi||[]).filter(e=>e.id!==id);
            saveGi(state.activeUserId, state.gi);
            loadAllForActive();
            render();
          });
        });

        const clearGiBtn = qs("#clearGiBtn");
        if (clearGiBtn){
          clearGiBtn.addEventListener("click", ()=>{
            if (!confirm("Clear ALL GI entries for this person?")) return;
            state.gi = [];
            saveGi(state.activeUserId, state.gi);
            loadAllForActive();
            render();
          });
        }

        // Symptoms module wiring
        const symArea = qs("#symArea");
        const symSearch = qs("#symSearch");
        if (symArea) symArea.addEventListener("change", renderSymptomList);
        if (symSearch) symSearch.addEventListener("input", renderSymptomList);

        const clearSymSelBtn = qs("#clearSymSelBtn");
        if (clearSymSelBtn){
          clearSymSelBtn.addEventListener("click", ()=>{
            state._symSelected = [];
            renderSymptomList();
          });
        }

        const runSymBtn = qs("#runSymBtn");
        if (runSymBtn){
          runSymBtn.addEventListener("click", ()=>{
            const selected = state._symSelected || [];
            const meta = {
              severity: clampInt(qs("#symSeverity")?.value || 0, 0, 10),
              durationHours: clampNum(qs("#symDurH")?.value || 0, 0, 100000),
              onset: qs("#symOnset")?.value || "gradual"
            };
            const notes = (qs("#symNotes")?.value || "").slice(0,1000);

            const result = symptomTriage(selected, meta, state.profile);
            const labels = selected.map(k=>SYMPTOMS.find(s=>s.key===k)?.label || k);

            const out = qs("#symOut");
            if (out){
              setHTML(out, `
                <div class="${triageStyle(result.triage)}">${escapeHtml(result.triage)}</div>
                <div class="hr"></div>
                <div class="label">Selected symptoms</div>
                <div class="sub">${escapeHtml(labels.join(", ")) || "—"}</div>

                <div class="hr"></div>
                <div class="label">Why this triage</div>
                <ul>${(result.reasons.length?result.reasons:["No special triggers detected."]).map(r=>`<li>${escapeHtml(r)}</li>`).join("")}</ul>

                <div class="hr"></div>
                <div class="label">Possible causes (plain language)</div>
                <ul>${result.possible.map(p=>`<li>${escapeHtml(p)}</li>`).join("")}</ul>

                <div class="hr"></div>
                <div class="label">Recommended actions</div>
                <ul>${result.actions.map(a=>`<li>${escapeHtml(a)}</li>`).join("")}</ul>

                ${notes ? `<div class="hr"></div><div class="label">Notes</div><div class="sub">${escapeHtml(notes)}</div>` : ""}
              `);
            }
          });
        }

        const saveSymSessionBtn = qs("#saveSymSessionBtn");
        if (saveSymSessionBtn){
          saveSymSessionBtn.addEventListener("click", ()=>{
            const selected = state._symSelected || [];
            if (!selected.length){ alert("Select at least one symptom."); return; }

            const meta = {
              severity: clampInt(qs("#symSeverity")?.value || 0, 0, 10),
              durationHours: clampNum(qs("#symDurH")?.value || 0, 0, 100000),
              onset: qs("#symOnset")?.value || "gradual"
            };
            const notes = (qs("#symNotes")?.value || "").slice(0,1000);
            const result = symptomTriage(selected, meta, state.profile);

            const symptomLabels = selected.map(k=>SYMPTOMS.find(s=>s.key===k)?.label || k);

            const session = {
              id: uid(),
              ts: new Date().toISOString(),
              symptoms: selected,
              symptomLabels,
              meta,
              notes,
              result
            };
            state.symSessions = [session, ...(state.symSessions||[])];
            saveSymSessions(state.activeUserId, state.symSessions);
            renderSymHistory();
            alert("Session saved.");
          });
        }

        const clearSymBtn = qs("#clearSymBtn");
        if (clearSymBtn){
          clearSymBtn.addEventListener("click", ()=>{
            if (!confirm("Clear all saved symptom sessions?")) return;
            state.symSessions = [];
            saveSymSessions(state.activeUserId, state.symSessions);
            renderSymHistory();
          });
        }

        // Reports actions
        const runReportBtn = qs("#runReportBtn");
        if (runReportBtn){
          runReportBtn.addEventListener("click", ()=>{
            const preset = qs("#repPreset")?.value || "weekly";
            let startISO=null, endISO=null;
            const now = new Date();

            if (preset==="daily"){
              const s = new Date(now); s.setHours(0,0,0,0);
              const e = new Date(now); e.setHours(23,59,59,999);
              startISO = s.toISOString(); endISO = e.toISOString();
            } else if (preset==="weekly"){
              const s = new Date(now.getTime() - 6*24*3600*1000);
              startISO = s.toISOString(); endISO = now.toISOString();
            } else if (preset==="monthly"){
              const s = new Date(now.getTime() - 29*24*3600*1000);
              startISO = s.toISOString(); endISO = now.toISOString();
            } else {
              const sd = qs("#repStart")?.value || "";
              const ed = qs("#repEnd")?.value || "";
              startISO = sd ? new Date(sd+"T00:00:00").toISOString() : null;
              endISO = ed ? new Date(ed+"T23:59:59").toISOString() : null;
            }

            const rep = buildReport(startISO, endISO, state.profile);
            const out = qs("#reportOut");
            if (!out) return;

            const L = rep.latest;
            setHTML(out, `
              <div class="h">Report Summary (${escapeHtml(preset.toUpperCase())})</div>
              <div class="sub">Range: ${startISO ? fmtDate(startISO) : "—"} to ${endISO ? fmtDate(endISO) : "—"}</div>

              <div class="hr"></div>
              <div class="h">Counts</div>
              <div class="kvs">
                ${Object.entries(rep.counts).map(([k,v])=>`
                  <div class="kv"><div class="label">${escapeHtml(k)}</div><div class="val">${v}</div></div>
                `).join("")}
              </div>

              <div class="hr"></div>
              <div class="h">Latest in range</div>
              <ul>
                <li>Glucose: ${L.glucose ? `${L.glucose.mgdl} mg/dL (${fmtDateTime(L.glucose.ts)})` : "—"}</li>
                <li>BP: ${L.bp ? `${L.bp.sys}/${L.bp.dia} mmHg (Pulse ${L.bp.pulse||"—"}) (${fmtDateTime(L.bp.ts)})` : "—"}</li>
                <li>Sleep: ${L.sleep ? `${L.sleep.hours} h (Score ${L.sleep.score||"—"}) (${fmtDateTime(L.sleep.ts)})` : "—"}</li>
                <li>SpO₂: ${L.spo2 ? `${L.spo2.pct}% (${fmtDateTime(L.spo2.ts)})` : "—"}</li>
                <li>eGFR: ${L.egfr ? `${L.egfr.value} (${fmtDateTime(L.egfr.ts)})` : "—"}</li>
                <li>HbA1c: ${L.a1c ? `${L.a1c.value}% (${fmtDateTime(L.a1c.ts)})` : "—"}</li>
                <li>GI: ${L.gi ? `${L.gi.computed.summary} (${fmtDateTime(L.gi.ts)})` : "—"}</li>
              </ul>

              <div class="hr"></div>
              <div class="h">Flags</div>
              ${rep.flags.length ? `<ul>${rep.flags.map(f=>`<li>${escapeHtml(f)}</li>`).join("")}</ul>` : `<div class="sub">No major flags detected from available data in this range.</div>`}
            `);
          });
        }

        const exportCsvBtn = qs("#exportCsvBtn");
        if (exportCsvBtn){
          exportCsvBtn.addEventListener("click", ()=>{
            const rows = [];
            rows.push(["type","timestamp","value1","value2","value3","note"]);

            const m = state.metrics;
            (m.glucose||[]).forEach(e=>rows.push(["glucose",e.ts,e.mgdl,"","",""+(e.note||"")]));
            (m.bp||[]).forEach(e=>rows.push(["bp",e.ts,e.sys,e.dia,e.pulse||"", ""+(e.note||"")]));
            (m.sleep||[]).forEach(e=>rows.push(["sleep",e.ts,e.hours,e.score||"","",""+(e.note||"")]));
            (m.spo2||[]).forEach(e=>rows.push(["spo2",e.ts,e.pct,"","",""+(e.note||"")]));
            (m.egfr||[]).forEach(e=>rows.push(["egfr",e.ts,e.value,"","",""+(e.note||"")]));
            (m.a1c||[]).forEach(e=>rows.push(["a1c",e.ts,e.value,"","",""+(e.note||"")]));

            (state.gi||[]).forEach(e=>{
              rows.push(["gi",e.ts,`Bristol ${e.bristol}`,`${e.frequency}/day`,e.computed?.triage||"", ""+(e.notes||"")]);
            });

            downloadFile(`HealthCheckerPlus_${state.activeUserId}_export.csv`, toCSV(rows), "text/csv");
          });
        }

        const printPdfBtn = qs("#printPdfBtn");
        if (printPdfBtn){
          printPdfBtn.addEventListener("click", ()=> window.print());
        }

        // Profile save
        const saveProfileBtn = qs("#saveProfileBtn");
        if (saveProfileBtn){
          saveProfileBtn.addEventListener("click", ()=>{
            const p = getProfile(state.activeUserId);
            p.name = (qs("#pfName")?.value || "").trim() || p.name;
            p.sex = qs("#pfSex")?.value || p.sex;
            p.dob = qs("#pfDob")?.value || "";
            p.heightCm = clampInt(qs("#pfHeight")?.value || 0, 0, 300);
            p.weightKg = clampNum(qs("#pfWeight")?.value || 0, 0, 600);

            const selectedConds = [];
            qsa("[data-cond]").forEach(cb=>{
              if (cb.checked) selectedConds.push(cb.getAttribute("data-cond"));
            });
            p.conditions = selectedConds;
            p.notes = (qs("#pfNotes")?.value || "").slice(0,2000);

            setProfile(state.activeUserId, p);

            // Also sync display name in users list
            const idx = state.users.findIndex(u=>u.id===state.activeUserId);
            if (idx >= 0){
              state.users[idx].name = p.name || state.users[idx].name;
              saveUsers(state.users);
            }
            loadAllForActive();
            render();
            alert("Profile saved.");
          });
        }

        const wipePersonBtn = qs("#wipePersonBtn");
        if (wipePersonBtn){
          wipePersonBtn.addEventListener("click", ()=>{
            if (!confirm("Wipe ALL data for this person?")) return;
            saveMetrics(state.activeUserId, {glucose:[],bp:[],sleep:[],spo2:[],egfr:[],a1c:[]});
            saveGi(state.activeUserId, []);
            saveSymSessions(state.activeUserId, []);
            loadAllForActive();
            render();
          });
        }

        // GI shortcut button from GI tab if no entries
        const goGiAddBtn = qs("#goGiAddBtn");
        if (goGiAddBtn){
          goGiAddBtn.addEventListener("click", ()=>{
            // focus is already GI tab; nothing extra needed
            const el = qs("#gi_bristol");
            if (el) el.scrollIntoView({behavior:"smooth"});
          });
        }
      }

      function postRender(){
        if (state.tab==="TRENDS") postRenderCharts();
        if (state.tab==="SYMPTOMS"){
          state._symSelected = state._symSelected || [];
          renderSymptomList();
          renderSymHistory();
        }
      }

      // Boot
      render();

    })();
  </script>
</body>
</html>
