<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HealthChecker+ Unified</title>
<style>
body{font-family:system-ui;background:#0b1220;color:#eaf0ff;margin:0}
header{padding:10px;background:#101a32}
.tab-btn{margin:4px;padding:8px;border-radius:10px;border:none;background:#233458;color:#fff;cursor:pointer}
.tab-btn.active{background:#4da3ff}
.screen{display:none;padding:12px}
.screen.active{display:block}
.card{background:#0f1a30;padding:12px;border-radius:12px;margin-bottom:10px}
</style>
</head>
<body>
<header>
<button class="tab-btn active" data-target="screen-dashboard">Dashboard</button>
<button class="tab-btn" data-target="screen-add">Add</button>
<button class="tab-btn" data-target="screen-check">Symptoms</button>
<button class="tab-btn" data-target="screen-reports">Reports</button>
<button class="tab-btn" data-target="screen-profile">Profile</button>
</header>

<div id="screen-dashboard" class="screen active">
<div class="card" id="dashboard"></div>
</div>

<div id="screen-add" class="screen">
<div class="card">
<input id="glucose" placeholder="Glucose" />
<input id="bp" placeholder="BP 120/80" />
<button onclick="saveReading()">Save</button>
</div>
</div>

<div id="screen-check" class="screen">
<div class="card" id="symptom-accordion"></div>
<button id="run-multisymptom">Run Diagnosis</button>
<div id="symptom-output"></div>
</div>

<div id="screen-reports" class="screen">
<div class="card" id="report-list"></div>
</div>

<div id="screen-profile" class="screen">
<div class="card">
<input id="prof-name" placeholder="Name" />
<button id="btn-save-profile">Save</button>
</div>
</div>

<script>
const STORE="HC_UNIFIED";
function getData(){return JSON.parse(localStorage.getItem(STORE)||"{}")}
function setData(d){localStorage.setItem(STORE,JSON.stringify(d))}

function saveReading(){
 let d=getData();
 d.logs=d.logs||[];
 d.logs.push({g:document.getElementById("glucose").value,bp:document.getElementById("bp").value,t:Date.now()});
 setData(d);
 refreshDashboard();
}

function refreshDashboard(){
 let d=getData();
 let html=(d.logs||[]).map(x=>`<div>${x.g} | ${x.bp}</div>`).join("");
 document.getElementById("dashboard").innerHTML=html||"No data";
}

function buildSymptomAccordion(){
 let c=document.getElementById("symptom-accordion");
 c.innerHTML="";
 for(let i=0;i<5;i++){
  c.innerHTML+=`<input class='symptom' placeholder='symptom'/>`;
 }
}

function runMultiSymptomCheck(){
 let s=[...document.querySelectorAll(".symptom")].map(x=>x.value).filter(Boolean);
 document.getElementById("symptom-output").innerHTML=s.length?"Symptoms logged":"None";
}

function renderReports(){
 let d=getData();
 document.getElementById("report-list").innerHTML=(d.logs||[]).length+" entries";
}

function loadProfileIntoForm(){
 let d=getData();
 document.getElementById("prof-name").value=d.name||"";
}

document.getElementById("btn-save-profile").onclick=function(){
 let d=getData();
 d.name=document.getElementById("prof-name").value;
 setData(d);
 alert("saved");
}

// tabs
let tabs=document.querySelectorAll(".tab-btn");
tabs.forEach(b=>b.onclick=()=>{
 tabs.forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(b.dataset.target).classList.add("active");
});

// init
buildSymptomAccordion();
refreshDashboard();
</script>
</body>
</html>
