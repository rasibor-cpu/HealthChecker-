<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>HealthChecker+ — Iteration 25 v1.2.0 (One-File)</title>

  <style>
    :root{ color-scheme: dark; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#0b0f14; color:#e9eef5; }
    .topbar{ position:sticky; top:0; z-index:50; background:#0b0f14; border-bottom:1px solid #1b2430; padding:14px 16px; }
    .wrap{ max-width:1180px; margin:0 auto; padding:16px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .title{ font-weight:900; font-size:18px; letter-spacing:.2px; }
    .sub{ opacity:.75; font-size:12px; margin-top:2px; }
    .btn{ border:1px solid #223043; background:#0b0f14; color:#e9eef5; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:13px; }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }
    .btnPrimary{ border:1px solid #6a4d00; background:#16120a; color:#fff; font-weight:900; }
    .tabs button{ border:1px solid #223043; background:#0f1620; color:#e9eef5; padding:10px 12px; border-radius:14px; cursor:pointer; font-size:13px; }
    .tabs button.active{ border-color:#6a4d00; background:#16120a; }
    select, input, textarea{ border:1px solid #223043; background:#0b0f14; color:#e9eef5; border-radius:12px; padding:10px; font-size:13px; outline:none; }
    input[type="date"]{ padding:9px 10px; }
    textarea{ min-height:90px; width:100%; }
    .card{ border:1px solid #1b2430; background:#0f1620; border-radius:16px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
    .h{ font-weight:900; margin-bottom:10px; }
    .label{ opacity:.8; font-size:12px; margin-bottom:4px; }
    .val{ font-weight:900; }
    .hr{ height:1px; background:#1b2430; margin:12px 0; }
    .kvs{ display:flex; gap:12px; flex-wrap:wrap; }
    .kv{ min-width:150px; }
    .badge{ display:inline-block; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:900; letter-spacing:.4px; margin:8px 0; }
    .badge.urgent{ background:#5c1a1a; }
    .badge.soon{ background:#6b4d00; }
    .badge.routine{ background:#143b5a; }
    .badge.stable{ background:#1f5a2a; }
    .muted{ opacity:.78; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; opacity:.9; }
    .small{ font-size:12px; opacity:.8; }
    .check{ display:flex; gap:10px; align-items:center; padding:10px; border:1px solid #223043; border-radius:12px; background:#0b0f14; }
    .checkgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; }
    .entry{ border:1px solid #223043; background:#0b0f14; border-radius:14px; padding:12px; }
    .pill{ display:inline-flex; gap:8px; align-items:center; padding:8px 10px; border:1px solid #223043; border-radius:999px; background:#0b0f14; }
    .pill button{ padding:2px 8px; border-radius:999px; border:1px solid #223043; background:#0f1620; color:#e9eef5; cursor:pointer; }
    canvas{ width:100%; height:220px; border:1px solid #223043; border-radius:14px; background:#0b0f14; }
    @media print{
      .topbar, .noPrint{ display:none !important; }
      body{ background:#fff; color:#000; }
      .card{ box-shadow:none; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
  /**********************************************************************
   * HealthChecker+ — Iteration 25 v1.2.0 (One-File)
   * Local-only (LocalStorage). Supports up to 10 people (family mode).
   *
   * NOTE ON “ATTACHMENT ANALYSIS”:
   * A pure offline HTML file cannot truly interpret X-rays/MRIs/lab scans.
   * This build lets you attach images/PDFs (as stored metadata + optional
   * text notes) and includes them in reports/exports. Real automated
   * interpretation requires a backend or on-device AI model.
   **********************************************************************/

  (function(){
    const APP_NAME = "HealthChecker+";
    const APP_VERSION = "Iteration 25 — v1.2.0 (One-File)";

    // ---------- LocalStorage keys ----------
    const LS = {
      USERS: "hc_users_v2",
      ACTIVE_USER: "hc_active_user_v2",

      PROFILE_PREFIX: "hc_profile_v2_",         // + userId
      METRICS_PREFIX: "hc_metrics_v2_",         // + userId (array of metric entries)
      GI_PREFIX: "hc_gi_entries_v2_",           // + userId (array)
      SYMPTOM_PREFIX: "hc_symptom_sessions_v2_", // + userId (array)
      ATTACH_PREFIX: "hc_attachments_v2_",      // + userId (array)
    };

    const MAX_PEOPLE = 10;

    // ---------- Defaults ----------
    const DEFAULT_USERS = [{ id:"me", name:"Me" }];

    const DEFAULT_PROFILE = {
      name: "Me",
      dob: "",             // YYYY-MM-DD
      sex: "",             // "male" | "female" | "other" | ""
      heightCm: "",        // number string
      weightKg: "",        // number string
      bmi: "",             // auto computed
      conditions: [],      // array of strings
      conditionsOther: "", // free text
      meds: "",            // free text
      notes: "",           // free text
    };

    const DEFAULT_RED_FLAGS = {
      blood:false, blackTarry:false, fever:false, severePain:false,
      vomiting:false, weightLoss:false, wateryOver48h:false,
    };

    const BRISTOL_REF = [
      "Type 1: Hard separate pellets — constipation",
      "Type 2: Lumpy sausage — constipation tendency",
      "Type 3: Sausage with cracks — generally OK",
      "Type 4: Smooth, soft, snake-like — ideal",
      "Type 5: Soft blobs — mild looseness",
      "Type 6: Mushy, ragged — diarrhea tendency",
      "Type 7: Watery — significant diarrhea",
    ];

    // ---------- Symptom library (starter; scalable) ----------
    // Body parts: simple, everyday categories; keys are what the engine expects.
    // You can expand by adding more items under symptomsByArea[key].
    const HCPLUS_SYMPTOM_LIBRARY = {
      bodyAreas: [
        { key:"general", label:"General / Whole body" },
        { key:"head", label:"Head / Headache" },
        { key:"eyes", label:"Eyes / Vision" },
        { key:"ears", label:"Ears / Hearing" },
        { key:"noseThroat", label:"Nose / Throat" },
        { key:"chestBreathing", label:"Chest / Breathing" },
        { key:"heartCirculation", label:"Heart / Circulation" },
        { key:"stomachBelly", label:"Stomach / Belly" },
        { key:"bowelStool", label:"Bowel / Stool" },
        { key:"urineKidney", label:"Urine / Kidney" },
        { key:"skin", label:"Skin / Rashes" },
        { key:"muscleJoint", label:"Muscles / Joints" },
        { key:"neuro", label:"Nerves / Weakness / Balance" },
        { key:"mood", label:"Mood / Anxiety / Stress" },
      ],
      symptomsByArea: {
        general: [
          { name:"Fever", synonyms:["high temperature"] },
          { name:"Chills", synonyms:["shivering"] },
          { name:"Fatigue", synonyms:["tiredness","low energy"] },
          { name:"Unintentional weight loss", synonyms:["losing weight"] },
          { name:"Night sweats", synonyms:[] },
        ],
        head: [
          { name:"Headache", synonyms:["head pain","migraine"] },
          { name:"Severe sudden headache", synonyms:["worst headache","thunderclap"] },
          { name:"Head pressure", synonyms:["tight head","band-like pressure"] },
          { name:"Dizziness (spinning)", synonyms:["vertigo"] },
          { name:"Light sensitivity", synonyms:["photophobia"] },
        ],
        eyes: [
          { name:"Blurry vision", synonyms:["blurred vision"] },
          { name:"Eye pain", synonyms:[] },
          { name:"Double vision", synonyms:["seeing double"] },
          { name:"Red eye", synonyms:[] },
        ],
        ears: [
          { name:"Ear pain", synonyms:[] },
          { name:"Ringing in ears", synonyms:["tinnitus"] },
          { name:"Hearing loss", synonyms:[] },
        ],
        noseThroat: [
          { name:"Sore throat", synonyms:[] },
          { name:"Runny nose", synonyms:["nasal discharge"] },
          { name:"Congestion", synonyms:["blocked nose"] },
          { name:"Hoarse voice", synonyms:["voice change"] },
        ],
        chestBreathing: [
          { name:"Shortness of breath", synonyms:["breathing difficulty"] },
          { name:"Cough", synonyms:[] },
          { name:"Wheezing", synonyms:[] },
          { name:"Chest tightness", synonyms:[] },
        ],
        heartCirculation: [
          { name:"Chest pain", synonyms:["pressure in chest"] },
          { name:"Palpitations", synonyms:["racing heart"] },
          { name:"Fainting / passing out", synonyms:["syncope"] },
          { name:"Leg swelling", synonyms:["ankle swelling"] },
        ],
        stomachBelly: [
          { name:"Nausea", synonyms:[] },
          { name:"Vomiting", synonyms:[] },
          { name:"Belly pain", synonyms:["abdominal pain","stomach pain"] },
          { name:"Heartburn", synonyms:["acid reflux"] },
          { name:"Poor appetite", synonyms:["loss of appetite"] },
        ],
        bowelStool: [
          { name:"Diarrhea", synonyms:["loose stool"] },
          { name:"Constipation", synonyms:[] },
          { name:"Blood in stool", synonyms:["bloody stool"] },
          { name:"Black/tarry stool", synonyms:["melena"] },
        ],
        urineKidney: [
          { name:"Pain with urination", synonyms:["burning urine"] },
          { name:"Frequent urination", synonyms:["pee often"] },
          { name:"Foamy urine", synonyms:["bubbles in urine"] },
          { name:"Blood in urine", synonyms:["pink urine"] },
          { name:"Flank pain", synonyms:["kidney pain"] },
        ],
        skin: [
          { name:"Rash", synonyms:[] },
          { name:"Itching", synonyms:["pruritus"] },
          { name:"Hives", synonyms:["welts"] },
          { name:"Swelling of face/lips", synonyms:["angioedema"] },
        ],
        muscleJoint: [
          { name:"Joint pain", synonyms:["arthritis pain"] },
          { name:"Muscle pain", synonyms:["body aches"] },
          { name:"Back pain", synonyms:[] },
          { name:"Swollen joint", synonyms:[] },
        ],
        neuro: [
          { name:"Numbness / tingling", synonyms:["pins and needles"] },
          { name:"Weakness (one side)", synonyms:["one-sided weakness"] },
          { name:"Trouble speaking", synonyms:["slurred speech"] },
          { name:"Seizure-like symptoms", synonyms:["seizure"] },
          { name:"Poor balance", synonyms:["unsteady walking"] },
        ],
        mood: [
          { name:"Anxiety", synonyms:["panic"] },
          { name:"Low mood", synonyms:["depressed mood"] },
          { name:"Stress", synonyms:[] },
          { name:"Poor sleep", synonyms:["insomnia"] },
        ],
      }
    };

    // ---------- Utilities ----------
    const qs = (sel, root=document) => root.querySelector(sel);
    const qsa = (sel, root=document) => Array.from(root.querySelectorAll(sel));
    const setHTML = (el, html) => (el.innerHTML = html);
    const safeParse = (json, fallback) => { try { return JSON.parse(json) ?? fallback; } catch { return fallback; } };
    const uid = () => `${Date.now()}_${Math.random().toString(16).slice(2)}`;
    const clampInt = (v, min, max) => {
      const n = Number.isFinite(+v) ? Math.floor(+v) : min;
      return Math.max(min, Math.min(max, n));
    };
    const toNum = (v) => (Number.isFinite(+v) ? +v : NaN);
    const esc = (s) => String(s)
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const fmtDateTime = (iso) => { try { return new Date(iso).toLocaleString(); } catch { return iso; } };
    const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(); } catch { return iso; } };

    function triageStyle(triage){
      if (triage === "URGENT") return "badge urgent";
      if (triage === "SOON") return "badge soon";
      if (triage === "ROUTINE") return "badge routine";
      return "badge stable";
    }

    function computeAge(dobYYYYMMDD){
      if(!dobYYYYMMDD) return null;
      const d = new Date(dobYYYYMMDD + "T00:00:00");
      if(String(d) === "Invalid Date") return null;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return age;
    }

    function computeBMI(heightCm, weightKg){
      const h = toNum(heightCm), w = toNum(weightKg);
      if(!Number.isFinite(h) || !Number.isFinite(w) || h <= 0 || w <= 0) return "";
      const m = h / 100;
      const bmi = w / (m*m);
      return Math.round(bmi * 10) / 10;
    }

    // ---------- Data load/save ----------
    function loadUsers(){
      const stored = safeParse(localStorage.getItem(LS.USERS), null);
      if (Array.isArray(stored) && stored.length) return stored;
      localStorage.setItem(LS.USERS, JSON.stringify(DEFAULT_USERS));
      localStorage.setItem(LS.ACTIVE_USER, "me");
      return DEFAULT_USERS;
    }
    function saveUsers(users){ localStorage.setItem(LS.USERS, JSON.stringify(users)); }
    function loadActiveUserId(){ return localStorage.getItem(LS.ACTIVE_USER) || "me"; }
    function setActiveUserId(id){ localStorage.setItem(LS.ACTIVE_USER, id); }

    const profileKey = (userId) => LS.PROFILE_PREFIX + userId;
    const metricsKey = (userId) => LS.METRICS_PREFIX + userId;
    const giKey = (userId) => LS.GI_PREFIX + userId;
    const symKey = (userId) => LS.SYMPTOM_PREFIX + userId;
    const attKey = (userId) => LS.ATTACH_PREFIX + userId;

    function loadProfile(userId){
      const p = safeParse(localStorage.getItem(profileKey(userId)), null);
      if(p && typeof p === "object"){
        // Ensure blanks; do NOT preload conditions/meds unless user entered them.
        return { ...DEFAULT_PROFILE, ...p };
      }
      localStorage.setItem(profileKey(userId), JSON.stringify({ ...DEFAULT_PROFILE }));
      return { ...DEFAULT_PROFILE };
    }
    function saveProfile(userId, profile){
      localStorage.setItem(profileKey(userId), JSON.stringify(profile));
    }

    function loadArr(key){
      const arr = safeParse(localStorage.getItem(key), []);
      return Array.isArray(arr) ? arr : [];
    }
    function saveArr(key, arr){
      localStorage.setItem(key, JSON.stringify(arr));
    }

    // ---------- Metrics model ----------
    // We store entries as: {id, ts, type, payload}
    // type: "glucose" | "bp" | "weight" | "sleep" | "kidney" | "note"
    // payload schema depends on type.
    function latestOfType(entries, type){
      return entries.find(e => e.type === type) || null;
    }

    // ---------- GI stability ----------
    function computeGiStability(entry){
      const bristol = clampInt(entry.bristol, 1, 7);
      const frequency = clampInt(entry.frequency, 0, 20);
      const urgency = entry.urgency || "none";
      const pain = entry.pain || "none";
      const durationDays = clampInt(entry.durationDays, 0, 365);
      const urineColor = clampInt(entry.urineColor || 0, 0, 8);
      const rf = entry.redFlags || DEFAULT_RED_FLAGS;

      const anyRedFlag = Object.values(rf).some(Boolean);

      let triageOverride = null;
      if (anyRedFlag) {
        if (rf.blackTarry || rf.blood || rf.severePain || rf.vomiting) triageOverride = "URGENT";
        else if (rf.fever || rf.wateryOver48h || rf.weightLoss) triageOverride = "SOON";
        else triageOverride = "SOON";
      }

      let score = 100;
      const bristolPenalty = { 4:0, 3:5, 5:10, 2:15, 6:20, 1:25, 7:30 };
      score -= (bristolPenalty[bristol] ?? 15);

      if (frequency === 0) score -= 15;
      else if (frequency === 3) score -= 5;
      else if (frequency >= 4 && frequency <= 5) score -= 10;
      else if (frequency >= 6) score -= 20;

      if (urgency === "sometimes") score -= 5;
      else if (urgency === "often") score -= 15;

      if (pain === "mild") score -= 5;
      else if (pain === "moderate") score -= 10;
      else if (pain === "severe") score -= 20;

      if (durationDays >= 2 && durationDays <= 3) score -= 5;
      else if (durationDays >= 4 && durationDays <= 7) score -= 10;
      else if (durationDays > 7) score -= 15;

      if (urineColor >= 4 && urineColor <= 5) score -= 5;
      else if (urineColor >= 6 && urineColor <= 8) score -= 10;

      score = clampInt(score, 0, 100);

      let band = "Stable";
      if (score < 40) band = "Highly unstable";
      else if (score < 60) band = "Unstable";
      else if (score < 80) band = "Mildly unstable";

      let triage = "ROUTINE";
      if (triageOverride) triage = triageOverride;
      else {
        if (score < 40) triage = "SOON";
        else if (score < 60 && durationDays >= 4) triage = "SOON";
        else if (score >= 80) triage = "STABLE";
        else triage = "ROUTINE";
      }

      const summary = `Bristol ${bristol}, ${frequency}/day, urgency: ${urgency}, pain: ${pain}, red flags: ${anyRedFlag ? "yes" : "no"}.`;
      return { score, band, triage, summary, anyRedFlag };
    }

    function buildGiActionPlan(entry, computed){
      const bristol = clampInt(entry.bristol, 1, 7);

      if (computed.triage === "URGENT") {
        return [
          "Urgent pattern detected (red flags). Seek urgent medical assessment.",
          "Hydrate in small frequent sips while arranging care if safe.",
          "Avoid NSAIDs (ibuprofen/naproxen) unless clinician-approved (kidney safety).",
        ];
      }
      if (computed.triage === "SOON") {
        return [
          "Concerning or persistent pattern. Arrange prompt clinical review (24–72h).",
          "Prioritize hydration; consider oral rehydration solution if stools are loose.",
          "Avoid heavy/fatty meals and alcohol until stable.",
        ];
      }
      if (bristol === 1 || bristol === 2) {
        return [
          "Constipation tendency: increase water and add fiber gradually (vegetables; psyllium if tolerated).",
          "Gentle daily activity (10–20 minutes walking).",
          "Escalate if pain, bleeding, or no stool >3 days.",
        ];
      }
      if (bristol === 6 || bristol === 7) {
        return [
          "Diarrhea tendency: prioritize hydration; consider electrolytes.",
          "Reduce greasy/high-fat foods, very spicy meals, excess caffeine temporarily.",
          "Escalate if watery diarrhea >48h (or >24h with dehydration/CKD risk).",
        ];
      }
      return [
        "Maintain: Types 3–4 are typically the target range.",
        "If urgency/pain persists, review trigger foods and hydration.",
        "Reassess if new red flags appear.",
      ];
    }

    // ---------- Symptom “triage + summary” (practical, not medical certainty) ----------
    function computeSymptomTriage({ selectedSymptoms, areaKey, age, sex, conditions }){
      const names = selectedSymptoms.map(s => (s||"").toLowerCase());

      // simple red flags set (expand as needed)
      const redFlags = [
        "chest pain",
        "shortness of breath",
        "trouble speaking",
        "weakness (one side)",
        "seizure-like symptoms",
        "severe sudden headache",
        "fainting / passing out",
        "blood in stool",
        "black/tarry stool",
        "vomiting"
      ];

      const hitRed = redFlags.some(r => names.includes(r));
      let triage = "ROUTINE";
      if(hitRed) triage = "URGENT";

      // child vs adult nuance
      if(age !== null && age < 12){
        if(names.includes("fever") && names.includes("vomiting")) triage = "SOON";
      }

      const summary = `Area: ${areaKey}. Symptoms: ${selectedSymptoms.join(", ") || "none"}.`;
      const notes = [];

      if(triage === "URGENT"){
        notes.push("Potential red flags present. Seek urgent assessment, especially if symptoms are sudden, severe, or worsening.");
      } else {
        notes.push("Track symptom trend, hydration, and triggers. Escalate if new red flags appear or symptoms persist.");
      }

      // CKD awareness if user lists kidney issues in conditions
      const condText = (conditions||[]).join(" ").toLowerCase();
      if(condText.includes("kidney") || condText.includes("ckd")){
        notes.push("Kidney-aware: avoid dehydration; avoid NSAIDs unless clinician-approved.");
      }

      // Provide a high-level differential suggestion (non-diagnostic)
      const suggestions = [];
      if(areaKey === "stomachBelly" || areaKey === "bowelStool"){
        suggestions.push("Possible GI upset triggers: fatty/spicy meals, infection, medication changes, stress.");
      }
      if(areaKey === "chestBreathing"){
        suggestions.push("Breathing symptoms can reflect infection, asthma/COPD, heart strain, or anxiety—seek prompt review if persistent.");
      }
      if(areaKey === "neuro" || areaKey === "head"){
        suggestions.push("Neurologic symptoms (weakness/speech/balance/seizure-like) require low threshold for urgent evaluation.");
      }

      return { triage, summary, notes, suggestions };
    }

    // ---------- Export helpers ----------
    function downloadText(filename, text, mime="text/plain"){
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    function toCSV(rows){
      // rows: array of objects with same keys
      if(!rows.length) return "";
      const cols = Object.keys(rows[0]);
      const escCSV = (v) => {
        const s = (v===null||v===undefined) ? "" : String(v);
        if(s.includes('"') || s.includes(",") || s.includes("\n")) return `"${s.replaceAll('"','""')}"`;
        return s;
      };
      const head = cols.map(escCSV).join(",");
      const lines = rows.map(r => cols.map(c => escCSV(r[c])).join(","));
      return [head, ...lines].join("\n");
    }

    // ---------- Simple chart (canvas) ----------
    function drawLineChart(canvas, points, yLabel){
      // points: [{xLabel, y}]
      if(!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;

      // Clear
      ctx.clearRect(0,0,w,h);

      // If no points
      if(!points || points.length < 2){
        ctx.globalAlpha = 0.8;
        ctx.fillText("Not enough data yet.", 18, 28);
        ctx.globalAlpha = 1;
        return;
      }

      // Margins
      const padL = 44, padR = 16, padT = 16, padB = 34;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;

      const ys = points.map(p => p.y).filter(v => Number.isFinite(v));
      if(ys.length < 2){
        ctx.fillText("Not enough numeric points.", 18, 28);
        return;
      }

      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const spanY = (maxY - minY) || 1;

      // Grid
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = "#ffffff";
      for(let i=0;i<=4;i++){
        const y = padT + (plotH*(i/4));
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+plotW, y); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Axes labels
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = "#e9eef5";
      ctx.font = `${12*devicePixelRatio}px system-ui`;
      ctx.fillText(yLabel || "", 12*devicePixelRatio, 14*devicePixelRatio);
      ctx.globalAlpha = 1;

      // Line
      ctx.strokeStyle = "#e9eef5";
      ctx.lineWidth = 2*devicePixelRatio;
      ctx.beginPath();
      points.forEach((p, i) => {
        const x = padL + (plotW*(i/(points.length-1)));
        const y = padT + plotH - (plotH*((p.y - minY)/spanY));
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();

      // Points
      ctx.fillStyle = "#e9eef5";
      points.forEach((p, i) => {
        const x = padL + (plotW*(i/(points.length-1)));
        const y = padT + plotH - (plotH*((p.y - minY)/spanY));
        ctx.beginPath(); ctx.arc(x,y, 3.2*devicePixelRatio, 0, Math.PI*2); ctx.fill();
      });

      // X labels (first/last)
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = "#e9eef5";
      const first = points[0].xLabel || "";
      const last = points[points.length-1].xLabel || "";
      ctx.fillText(first, padL, h - 10*devicePixelRatio);
      const lastW = ctx.measureText(last).width;
      ctx.fillText(last, padL + plotW - lastW, h - 10*devicePixelRatio);
      ctx.globalAlpha = 1;
    }

    function viewProfile(){

      const age = computeAge(p.dob);

      const conditionOptions = [
        "Hypertension",
        "Diabetes / Prediabetes",
        "Kidney disease (CKD)",
        "Heart disease",
        "Stroke/TIA history",
        "Asthma",
        "Ulcer / GERD",
        "Anemia",
      ];

      return `
        <div class="grid">
          <div class="card">
            <div class="h">Profile</div>
            <div class="small muted">Profile fields are blank until you fill them. Age and BMI compute automatically.</div>

            <div class="hr"></div>
            <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));">

              <div>

                <input id="p_dob" type="date" value="${esc(p.dob || "")}" />
              </div>
              <div>
                <div class="label">Age (auto)</div>
                <div class="pill"><b id="p_age">${age===null ? "—" : esc(String(age))}</b></div>

              <div>
                <div class="label">Sex</div>
                <select id="p_sex">
                  <option value="" ${p.sex===""?"selected":""}>—</option>
                  <option value="male" ${p.sex==="male"?"selected":""}>Male</option>
                  <option value="female" ${p.sex==="female"?"selected":""}>Female</option>

              <div>

                <div class="label">Weight (kg)</div>

              <div>
                <div class="label">BMI (auto)</div>

    function render(){
      // Keep active person name visible immediately
      const u = activeUser();
      const displayName = (state.profile && state.profile.name) ? state.profile.name : (u.name || "—");

      setHTML(root, `
        <div class="topbar noPrint">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="title">${esc(APP_NAME)} — <span class="muted">${esc(displayName)}</span></div>
              <div class="sub">${esc(APP_VERSION)} • Local-only storage</div>
            </div>
            <div class="row">
              <button class="btn" id="printTop">Print / Save as PDF</button>
              <button class="btn" id="exportTop">Export CSV (all metrics)</button>
            </div>
          </div>

          <div class="row" style="margin-top:12px; align-items:flex-end;">
            <div>
              <div class="label">Active person (up to ${MAX_PEOPLE})</div>
              <div class="row">
                <select id="personSelect">
                  ${state.users.map(x => `<option value="${esc(x.id)}" ${x.id===state.activeUserId?"selected":""}>${esc(x.name)}</option>`).join("")}

              </div>
              <div class="small muted">All entries/results are tied to the selected person.</div>
            </div>

            <div class="tabs row" style="margin-left:auto;">
              ${tabBtn("SNAPSHOT", state.tab, "Snapshot")}
              ${tabBtn("ADD", state.tab, "Add Data")}
              ${tabBtn("TRENDS", state.tab, "Trends")}
              ${tabBtn("GI", state.tab, "GI")}
              ${tabBtn("SYMPTOMS", state.tab, "Symptom Diagnoser")}
              ${tabBtn("ATTACH", state.tab, "Attachments")}
              ${tabBtn("REPORTS", state.tab, "Reports")}
              ${tabBtn("PROFILE", state.tab, "Profile")}
            </div>
          </div>
        </div>

        <div class="wrap">
          ${state.tab==="SNAPSHOT" ? snapshotCards() : ""}
          ${state.tab==="ADD" ? viewAddData() : ""}
          ${state.tab==="TRENDS" ? viewTrends() : ""}
          ${state.tab==="GI" ? viewGI() : ""}
          ${state.tab==="SYMPTOMS" ? viewSymptomDiagnoser() : ""}
          ${state.tab==="ATTACH" ? viewAttachments() : ""}
          ${state.tab==="REPORTS" ? viewReports() : ""}
          ${state.tab==="PROFILE" ? viewProfile() : ""}

          <div class="card" style="margin-top:12px;">
            <div class="small muted">
              Local-first storage: data is stored on this device (LocalStorage). Clearing browser data clears history.
            </div>
          </div>
        </div>
      `);

      wireEvents();

      // Draw charts after render
      if(state.tab==="TRENDS"){
        const glucosePts = state.metrics.filter(e=>e.type==="glucose").slice().reverse()
          .map(e=>({xLabel:fmtDate(e.ts), y:toNum(e.payload.mgdl)}));
        const sysPts = state.metrics.filter(e=>e.type==="bp").slice().reverse()
          .map(e=>({xLabel:fmtDate(e.ts), y:toNum(e.payload.sys)}));
        const diaPts = state.metrics.filter(e=>e.type==="bp").slice().reverse()
          .map(e=>({xLabel:fmtDate(e.ts), y:toNum(e.payload.dia)}));
        const weightPts = state.metrics.filter(e=>e.type==="weight").slice().reverse()
          .map(e=>({xLabel:fmtDate(e.ts), y:toNum(e.payload.kg)}));
        const egfrPts = state.metrics.filter(e=>e.type==="kidney").slice().reverse()
          .map(e=>({xLabel:fmtDate(e.ts), y:toNum(e.payload.egfr)}));

        drawLineChart(qs("#cGlucose"), glucosePts, "Glucose");
        drawLineChart(qs("#cBpSys"), sysPts, "Systolic");
        drawLineChart(qs("#cBpDia"), diaPts, "Diastolic");
        drawLineChart(qs("#cWeight"), weightPts, "Weight");
        drawLineChart(qs("#cEgfr"), egfrPts, "eGFR");
      }

      // Symptom list populate after render
      if(state.tab==="SYMPTOMS"){
        refreshSymptomList();
      }

      // Add Data dynamic form
      if(state.tab==="ADD"){
        const sel = qs("#metricType");
        const form = qs("#metricForm");
        if(sel && form){
          setHTML(form, metricFormHTML(sel.value));
          sel.addEventListener("change", ()=> setHTML(form, metricFormHTML(sel.value)));
        }
      }
    }

    // ---------- Symptom UI ----------
    let symSelected = []; // names
    function refreshSymptomList(){
      const areaKey = qs("#sym_area")?.value || "general";
      const search = (qs("#sym_search")?.value || "").trim().toLowerCase();

      const listEl = qs("#sym_list");
      if(!listEl) return;

      const items = (HCPLUS_SYMPTOM_LIBRARY.symptomsByArea[areaKey] || [])
        .map(x => x.name)
        .filter(name => !search || name.toLowerCase().includes(search));

      setHTML(listEl, items.length ? items.map(name => {
        const checked = symSelected.includes(name) ? "checked" : "";
        const id = "sym_" + name.replaceAll(/[^a-z0-9]/gi,"_");
        return `<label class="check"><input type="checkbox" id="${esc(id)}" data-sym="${esc(name)}" ${checked}><span>${esc(name)}</span></label>`;
      }).join("") : `<div class="muted">No symptoms listed for this area (yet). Expand the library in code.</div>`);

      renderSymSelected();
    }

    function renderSymSelected(){
      const out = qs("#sym_selected");
      if(!out) return;
      if(!symSelected.length){
        setHTML(out, `<div class="muted">None selected.</div>`);
        return;
      }
      setHTML(out, symSelected.map(s => `
        <span class="pill">${esc(s)} <button data-rm-sym="${esc(s)}">x</button></span>
      `).join(""));
      qsa("[data-rm-sym]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const s = b.getAttribute("data-rm-sym");
          symSelected = symSelected.filter(x=>x!==s);
          refreshSymptomList();
        });
      });
    }

    // ---------- Reports ----------
    function withinDate(tsIso, start, end){
      const t = new Date(tsIso).getTime();
      const s = start ? new Date(start+"T00:00:00").getTime() : -Infinity;
      const e = end ? new Date(end+"T23:59:59").getTime() : Infinity;
      return t >= s && t <= e;
    }

    function buildReportRows(startDate, endDate){
      const rows = [];
      // metrics
      state.metrics.forEach(e=>{
        if(!withinDate(e.ts, startDate, endDate)) return;
        rows.push({
          ts: e.ts,
          kind: "metric",
          type: e.type,
          value: JSON.stringify(e.payload)
        });
      });
      // GI
      state.gi.forEach(g=>{
        if(!withinDate(g.ts, startDate, endDate)) return;
        rows.push({
          ts: g.ts,
          kind: "GI",
          type: "GI",
          value: (g.computed?.summary) || computeGiStability(g).summary
        });
      });
      // symptoms
      state.symptomSessions.forEach(s=>{
        if(!withinDate(s.ts, startDate, endDate)) return;
        rows.push({
          ts: s.ts,
          kind: "symptom_session",
          type: s.areaKey,
          value: (s.symptoms||[]).join("; ")
        });
      });
      // attachments
      state.attachments.forEach(a=>{
        if(!withinDate(a.ts, startDate, endDate)) return;
        rows.push({
          ts: a.ts,
          kind: "attachment",
          type: a.mime || "",
          value: a.title || a.filename || ""
        });
      });
      // sort
      rows.sort((a,b)=> new Date(b.ts).getTime() - new Date(a.ts).getTime());
      return rows;
    }

    // ---------- Events / wiring ----------
    function wireEvents(){
      // Tabs
      qsa(".tabs button").forEach(b=>{
        b.addEventListener("click", ()=>{
          state.tab = b.getAttribute("data-tab");
          render();
        });
      });

      // Top actions
      const printTop = qs("#printTop");
      if(printTop) printTop.addEventListener("click", ()=> window.print());
      const exportTop = qs("#exportTop");
      if(exportTop) exportTop.addEventListener("click", exportMetricsCSV);

      // Snapshot quick jumps
      const goAdd = qs("#goAddDataFromSnap");
      if(goAdd) goAdd.addEventListener("click", ()=>{ state.tab="ADD"; render(); });
      const goGI = qs("#goGIFromSnap");
      if(goGI) goGI.addEventListener("click", ()=>{ state.tab="GI"; render(); });
      const goSym = qs("#goSymFromSnap");
      if(goSym) goSym.addEventListener("click", ()=>{ state.tab="SYMPTOMS"; render(); });

      // Person select
      const personSelect = qs("#personSelect");
      if(personSelect){
        personSelect.addEventListener("change", ()=>{
          state.activeUserId = personSelect.value;
          setActiveUserId(state.activeUserId);
          reloadUserData();
          symSelected = [];
          render();
        });
      }

      // Add person (max 10)
      const addBtn = qs("#addPersonBtn");
      if(addBtn){
        addBtn.addEventListener("click", ()=>{
          const name = (qs("#newPersonName")?.value || "").trim();
          if(!name) return;
          if(state.users.length >= MAX_PEOPLE){
            alert(`Family limit reached (${MAX_PEOPLE}). Delete someone to add a new person.`);
            return;
          }
          const id = uid();
          state.users.push({ id, name });
          saveUsers(state.users);

          state.activeUserId = id;
          setActiveUserId(id);
          // create blank profile
          localStorage.setItem(profileKey(id), JSON.stringify({ ...DEFAULT_PROFILE, name }));
          reloadUserData();

          const n = qs("#newPersonName"); if(n) n.value="";
          symSelected = [];
          render();
        });
      }

      // Delete person
      const delBtn = qs("#delPersonBtn");
      if(delBtn){
        delBtn.addEventListener("click", ()=>{
          if(state.activeUserId==="me") return;
          if(!confirm("Delete this person and all their stored data?")) return;

          const id = state.activeUserId;
          state.users = state.users.filter(u=>u.id!==id);
          saveUsers(state.users);

          localStorage.removeItem(profileKey(id));
          localStorage.removeItem(metricsKey(id));
          localStorage.removeItem(giKey(id));
          localStorage.removeItem(symKey(id));
          localStorage.removeItem(attKey(id));

          state.activeUserId = "me";
          setActiveUserId("me");
          reloadUserData();
          symSelected = [];
          render();
        });
      }

      // Add Data page
      if(state.tab==="ADD"){
        const typeSel = qs("#metricType");
        const form = qs("#metricForm");
        if(typeSel && form){
          setHTML(form, metricFormHTML(typeSel.value));
          typeSel.addEventListener("change", ()=> setHTML(form, metricFormHTML(typeSel.value)));
        }

        const saveBtn = qs("#saveMetricBtn");
        if(saveBtn){
          saveBtn.addEventListener("click", ()=>{
            const type = qs("#metricType")?.value || "glucose";
            const tsRaw = (qs("#metricTs")?.value || "").trim();
            const ts = tsRaw ? new Date(tsRaw).toISOString() : new Date().toISOString();

            let payload = {};
            if(type==="glucose"){
              payload = {
                mgdl: clampInt(qs("#g_mgdl")?.value ?? 0, 0, 600),
                trend: (qs("#g_trend")?.value || ""),
                context: (qs("#g_ctx")?.value || "").slice(0,200)
              };
            } else if(type==="bp"){
              payload = {
                sys: clampInt(qs("#bp_sys")?.value ?? 0, 0, 300),
                dia: clampInt(qs("#bp_dia")?.value ?? 0, 0, 200),
                pulse: (qs("#bp_pulse")?.value || "").trim(),
                context: (qs("#bp_ctx")?.value || "").slice(0,200)
              };
            } else if(type==="weight"){
              payload = {
                kg: (qs("#w_kg")?.value || "").trim(),
                context: (qs("#w_ctx")?.value || "").slice(0,200)
              };
            } else if(type==="sleep"){
              payload = {
                score: (qs("#s_score")?.value || "").trim(),
                duration: (qs("#s_duration")?.value || "").slice(0,60),
                notes: (qs("#s_notes")?.value || "").slice(0,200)
              };
            } else if(type==="kidney"){
              payload = {
                egfr: (qs("#k_egfr")?.value || "").trim(),
                creatinine: (qs("#k_creat")?.value || "").trim(),
                protein: (qs("#k_protein")?.value || "").trim(),
                notes: (qs("#k_notes")?.value || "").slice(0,200),
              };
            } else {
              payload = { text: (qs("#n_text")?.value || "").slice(0,2000) };
            }

            const entry = { id: uid(), ts, type, payload };
            state.metrics = [entry, ...state.metrics];
            saveArr(metricsKey(state.activeUserId), state.metrics);

            reloadUserData(); // ensures snapshot reflects instantly
            state.tab = "SNAPSHOT";
            render();
          });
        }

        const resetBtn = qs("#resetMetricBtn");
        if(resetBtn){
          resetBtn.addEventListener("click", ()=>{
            const type = qs("#metricType")?.value || "glucose";
            setHTML(qs("#metricForm"), metricFormHTML(type));
            const ts = qs("#metricTs"); if(ts) ts.value="";
          });
        }
      }

      // Trends page
      if(state.tab==="TRENDS"){
        const printBtn = qs("#printBtn");
        if(printBtn) printBtn.addEventListener("click", ()=> window.print());

        const exportCsvMetrics = qs("#exportCsvMetrics");
        if(exportCsvMetrics) exportCsvMetrics.addEventListener("click", exportMetricsCSV);

        const exportCsvGI = qs("#exportCsvGI");
        if(exportCsvGI) exportCsvGI.addEventListener("click", exportGICSV);

        const exportCsvSymptoms = qs("#exportCsvSymptoms");
        if(exportCsvSymptoms) exportCsvSymptoms.addEventListener("click", exportSymptomsCSV);
      }

      // GI page
      if(state.tab==="GI"){
        const goAddGI = qs("#goAddGI");
        if(goAddGI) goAddGI.addEventListener("click", ()=>{ /* already on GI; scroll */ window.scrollTo({top:0, behavior:"smooth"}); });

        const saveGI = qs("#saveGI");
        if(saveGI){
          saveGI.addEventListener("click", ()=>{
            const entry = {
              id: uid(),
              ts: new Date().toISOString(),
              bristol: clampInt(qs("#gi_bristol")?.value ?? 4, 1, 7),
              frequency: clampInt(qs("#gi_freq")?.value ?? 1, 0, 20),
              urgency: qs("#gi_urg")?.value || "none",
              pain: qs("#gi_pain")?.value || "none",
              durationDays: clampInt(qs("#gi_days")?.value ?? 1, 0, 365),
              urineColor: clampInt(qs("#gi_urine")?.value ?? 3, 0, 8),
              redFlags: {
                blood: !!qs("#gi_rf_blood")?.checked,
                blackTarry: !!qs("#gi_rf_black")?.checked,
                fever: !!qs("#gi_rf_fever")?.checked,
                severePain: !!qs("#gi_rf_pain")?.checked,
                vomiting: !!qs("#gi_rf_vomit")?.checked,
                weightLoss: !!qs("#gi_rf_wloss")?.checked,
                wateryOver48h: !!qs("#gi_rf_watery")?.checked,
              },
              notes: (qs("#gi_notes")?.value || "").slice(0,1000)
            };

            const computed = computeGiStability(entry);
            entry.computed = computed;
            entry.actionPlan = buildGiActionPlan(entry, computed);

            state.gi = [entry, ...state.gi];
            saveArr(giKey(state.activeUserId), state.gi);

            reloadUserData();
            state.tab = "SNAPSHOT";
            render();
          });
        }

        const clearGI = qs("#clearGI");
        if(clearGI){
          clearGI.addEventListener("click", ()=>{
            if(!confirm("Clear ALL GI entries for this person?")) return;
            state.gi = [];
            saveArr(giKey(state.activeUserId), state.gi);
            reloadUserData();
            render();
          });
        }
      }

      // Symptom Diagnoser
      if(state.tab==="SYMPTOMS"){
        const areaSel = qs("#sym_area");
        const search = qs("#sym_search");
        if(areaSel) areaSel.addEventListener("change", ()=>{ symSelected=[]; refreshSymptomList(); });
        if(search) search.addEventListener("input", refreshSymptomList);

        // clicking symptoms checkboxes
        qsa("#sym_list input[type='checkbox']").forEach(cb=>{
          cb.addEventListener("change", ()=>{
            const name = cb.getAttribute("data-sym");
            if(!name) return;
            if(cb.checked){
              if(!symSelected.includes(name)) symSelected.push(name);
            } else {
              symSelected = symSelected.filter(x=>x!==name);
            }
            renderSymSelected();
          });
        });

        const clearSel = qs("#clearSymSel");
        if(clearSel){
          clearSel.addEventListener("click", ()=>{
            symSelected = [];
            refreshSymptomList();
            const notes = qs("#sym_notes"); if(notes) notes.value="";
            setHTML(qs("#sym_result"), `<div class="muted">Selection cleared.</div>`);
            setHTML(qs("#sym_docSummary"), "—");
          });
        }

        const run = qs("#runSym");
        if(run){
          run.addEventListener("click", ()=>{
            const areaKey = qs("#sym_area")?.value || "general";
            const areaLabel = (HCPLUS_SYMPTOM_LIBRARY.bodyAreas.find(a=>a.key===areaKey)?.label) || areaKey;
            const notes = (qs("#sym_notes")?.value || "").slice(0,1500);

            const p = state.profile;
            const age = computeAge(p.dob);
            const conditions = (p.conditions||[]).concat(p.conditionsOther ? [p.conditionsOther] : []);

            const computed = computeSymptomTriage({
              selectedSymptoms: symSelected.slice(),
              areaKey,
              age,
              sex: p.sex,
              conditions
            });

            const session = {
              id: uid(),
              ts: new Date().toISOString(),
              areaKey,
              areaLabel,
              symptoms: symSelected.slice(),
              notes,
              triage: computed.triage,
              summary: computed.summary,
              guidance: computed.notes,
              suggestions: computed.suggestions
            };

            state.symptomSessions = [session, ...state.symptomSessions];
            saveArr(symKey(state.activeUserId), state.symptomSessions);

            // Render result + doctor summary
            setHTML(qs("#sym_result"), `
              <div class="${triageStyle(session.triage)}">${esc(session.triage)}</div>
              <div class="kvs">
                <div class="kv"><div class="label">Time</div><div class="val">${esc(fmtDateTime(session.ts))}</div></div>
                <div class="kv"><div class="label">Area</div><div class="val">${esc(session.areaLabel)}</div></div>
              </div>
              <div class="hr"></div>
              <div class="label">Summary</div>
              <div>${esc(session.summary)}</div>
              ${session.notes ? `<div class="hr"></div><div class="label">Notes</div><div class="mono">${esc(session.notes)}</div>` : ""}
              <div class="hr"></div>
              <div class="label">Guidance</div>
              <ul>${(session.guidance||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
              ${session.suggestions?.length ? `<div class="hr"></div><div class="label">Possible considerations</div><ul>${session.suggestions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
            `);

            const patientName = (state.profile.name || activeUser().name || "Patient");
            const docSummary =
              `Patient: ${patientName}\n`+
              `Time: ${fmtDateTime(session.ts)}\n`+
              `Area: ${session.areaLabel}\n`+
              `Triage: ${session.triage}\n`+
              `Symptoms: ${(session.symptoms||[]).join(", ") || "—"}\n`+
              (session.notes ? `Notes: ${session.notes}\n` : "")+
              `Profile: Age ${computeAge(state.profile.dob) ?? "—"}, Sex ${state.profile.sex || "—"}\n`+
              `Conditions: ${((state.profile.conditions||[]).join(", ") || "—")}${state.profile.conditionsOther ? " | Other: "+state.profile.conditionsOther : ""}\n`+
              `Meds: ${state.profile.meds || "—"}\n`;
            setHTML(qs("#sym_docSummary"), esc(docSummary));

            // update snapshot immediately (latest session is saved)
            reloadUserData();
          });
        }

        const emailDoctor = qs("#emailDoctor");
        if(emailDoctor){
          emailDoctor.addEventListener("click", ()=>{
            const last = state.symptomSessions[0];
            if(!last){ alert("No symptom session to email yet."); return; }
            const patientName = (state.profile.name || activeUser().name || "Patient");
            const subject = encodeURIComponent(`HealthChecker+ Summary — ${patientName}`);
            const body = encodeURIComponent(qs("#sym_docSummary")?.textContent || "");
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
          });
        }

        const exportSym = qs("#exportSymCsv");
        if(exportSym) exportSym.addEventListener("click", exportSymptomsCSV);

        const printSym = qs("#printSym");
        if(printSym) printSym.addEventListener("click", ()=> window.print());
      }

      // Attachments
      if(state.tab==="ATTACH"){
        const saveAtt = qs("#saveAtt");
        if(saveAtt){
          saveAtt.addEventListener("click", async ()=>{
            const file = qs("#att_file")?.files?.[0] || null;
            const title = (qs("#att_title")?.value || "").slice(0,120);
            const notes = (qs("#att_notes")?.value || "").slice(0,4000);

            if(!file && !notes){
              alert("Attach a file or paste notes/text.");
              return;
            }

            // We do NOT store raw file bytes to LocalStorage (too large).
            // We store filename/mime + notes + timestamp. If you need true
            // file storage, use IndexedDB (future iteration).
            const rec = {
              id: uid(),
              ts: new Date().toISOString(),
              title,
              filename: file ? file.name : "",
              mime: file ? file.type : "",
              notes
            };

            state.attachments = [rec, ...state.attachments];
            saveArr(attKey(state.activeUserId), state.attachments);

            // reset
            const f = qs("#att_file"); if(f) f.value="";
            const t = qs("#att_title"); if(t) t.value="";
            const n = qs("#att_notes"); if(n) n.value="";

            reloadUserData();
            render(); // refresh list
          });
        }

        const exportAtt = qs("#exportAttCsv");
        if(exportAtt){
          exportAtt.addEventListener("click", ()=>{
            const rows = state.attachments.map(a=>({
              ts: a.ts, title: a.title, filename: a.filename, mime: a.mime, notes: a.notes
            }));
            downloadText(`HCPLUS_${activeUser().name}_attachments.csv`, toCSV(rows), "text/csv");
          });
        }

        qsa("[data-del-att]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const id = btn.getAttribute("data-del-att");
            state.attachments = state.attachments.filter(a=>a.id!==id);
            saveArr(attKey(state.activeUserId), state.attachments);
            reloadUserData();
            render();
          });
        });
      }

      // Reports
      if(state.tab==="REPORTS"){
        qsa("[data-range]").forEach(b=>{
          b.addEventListener("click", ()=>{
            const r = b.getAttribute("data-range");
            const now = new Date();
            let start = new Date(now);
            if(r==="day") start.setDate(now.getDate()-1);
            if(r==="week") start.setDate(now.getDate()-7);
            if(r==="month") start.setMonth(now.getMonth()-1);

            const s = start.toISOString().slice(0,10);
            const e = now.toISOString().slice(0,10);
            runReport(s,e);
          });
        });

        const runCustom = qs("#runCustomReport");
        if(runCustom){
          runCustom.addEventListener("click", ()=>{
            const s = qs("#rep_start")?.value || "";
            const e = qs("#rep_end")?.value || "";
            if(!s || !e){ alert("Select both start and end dates."); return; }
            runReport(s,e);
          });
        }

        const printReport = qs("#printReport");
        if(printReport) printReport.addEventListener("click", ()=> window.print());

        const exportReport = qs("#exportReportCsv");
        if(exportReport){
          exportReport.addEventListener("click", ()=>{
            const out = qs("#reportOut");
            const rows = out? (out._rows || []) : [];
            if(!rows.length){ alert("Run a report first."); return; }
            downloadText(`HCPLUS_${activeUser().name}_report.csv`, toCSV(rows), "text/csv");
          });
        }
      }

      // Profile
      if(state.tab==="PROFILE"){
        const updateComputed = ()=>{
          const h = qs("#p_h")?.value || "";
          const w = qs("#p_w")?.value || "";
          const bmi = computeBMI(h,w);
          const dob = qs("#p_dob")?.value || "";
          const age = computeAge(dob);

          const bmiEl = qs("#p_bmi"); if(bmiEl) bmiEl.textContent = (bmi===""||bmi===null) ? "—" : String(bmi);
          const ageEl = qs("#p_age"); if(ageEl) ageEl.textContent = (age===null) ? "—" : String(age);
        };

        ["p_h","p_w","p_dob"].forEach(id=>{
          const el = qs("#"+id);
          if(el) el.addEventListener("input", updateComputed);
          if(el) el.addEventListener("change", updateComputed);
        });

        const saveProfileBtn = qs("#saveProfileBtn");
        if(saveProfileBtn){
          saveProfileBtn.addEventListener("click", ()=>{
            const p = { ...state.profile };

            const name = (qs("#p_name")?.value || "").trim();
            p.name = name || activeUser().name || "—";
            p.dob = qs("#p_dob")?.value || "";
            p.sex = qs("#p_sex")?.value || "";
            p.heightCm = (qs("#p_h")?.value || "").trim();
            p.weightKg = (qs("#p_w")?.value || "").trim();
            p.bmi = computeBMI(p.heightCm, p.weightKg) || "";

            // conditions
            const cond = [];
            qsa("[data-cond]").forEach(cb=>{
              if(cb.checked) cond.push(cb.getAttribute("data-cond"));
            });
            p.conditions = cond;
            p.conditionsOther = (qs("#p_cond_other")?.value || "").slice(0,300);

            p.meds = (qs("#p_meds")?.value || "").slice(0,2500);
            p.notes = (qs("#p_notes")?.value || "").slice(0,2500);

            state.profile = p;
            saveProfile(state.activeUserId, p);

            // Keep user list name consistent
            const u = activeUser();
            u.name = p.name || u.name;
            saveUsers(state.users);

            reloadUserData();
            render();
          });
        }

        const resetProfileBtn = qs("#resetProfileBtn");
        if(resetProfileBtn){
          resetProfileBtn.addEventListener("click", ()=>{
            if(!confirm("Reset profile fields for this person?")) return;
            const u = activeUser();
            const blank = { ...DEFAULT_PROFILE, name: u.name || "—" };
            state.profile = blank;
            saveProfile(state.activeUserId, blank);
            reloadUserData();
            render();
          });
        }
      }
    }

    function runReport(startDate, endDate){
      const rows = buildReportRows(startDate, endDate);
      const out = qs("#reportOut");
      if(!out) return;

      out._rows = rows; // stash for export

      const patientName = (state.profile.name || activeUser().name || "Patient");
      setHTML(out, `
        <div class="badge stable">REPORT</div>
        <div class="mono">
          Patient: ${esc(patientName)}<br/>
          Period: ${esc(startDate)} to ${esc(endDate)}<br/>
          Rows: ${esc(String(rows.length))}
        </div>
        <div class="hr"></div>
        ${rows.length ? `
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${rows.slice(0,80).map(r=>`
              <div class="entry">
                <div class="row" style="justify-content:space-between;">
                  <div><b>${esc(r.kind)}</b> • ${esc(r.type)}</div>
                  <div class="small muted">${esc(fmtDateTime(r.ts))}</div>
                </div>
                <div class="mono">${esc(r.value)}</div>
              </div>
            `).join("")}
            ${rows.length > 80 ? `<div class="small muted">Showing first 80 rows. Export CSV to get all.</div>` : ""}
          </div>
        ` : `<div class="muted">No records found in this period.</div>`}
      `);
    }

    // ---------- CSV exports ----------
    function exportMetricsCSV(){
      const rows = state.metrics.map(e=>({
        ts: e.ts,
        type: e.type,
        payload: JSON.stringify(e.payload)
      }));
      downloadText(`HCPLUS_${activeUser().name}_metrics.csv`, toCSV(rows), "text/csv");
    }

    function exportGICSV(){
      const rows = state.gi.map(g=>({
        ts: g.ts,
        bristol: g.bristol,
        frequency: g.frequency,
        urgency: g.urgency,
        pain: g.pain,
        durationDays: g.durationDays,
        urineColor: g.urineColor,
        redFlags: JSON.stringify(g.redFlags||{}),
        summary: (g.computed?.summary) || computeGiStability(g).summary,
        notes: g.notes || ""
      }));
      downloadText(`HCPLUS_${activeUser().name}_gi.csv`, toCSV(rows), "text/csv");
    }

    function exportSymptomsCSV(){
      const rows = state.symptomSessions.map(s=>({
        ts: s.ts,
        area: s.areaLabel,
        triage: s.triage,
        symptoms: (s.symptoms||[]).join("; "),
        notes: s.notes || ""
      }));
      downloadText(`HCPLUS_${activeUser().name}_symptoms.csv`, toCSV(rows), "text/csv");
    }

    // ---------- Boot ----------
    render();

    // Re-render charts on resize (Trends tab)
    window.addEventListener("resize", ()=>{
      if(state.tab==="TRENDS") render();
    });

  })();
  </script>
</body>
</html>
