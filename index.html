<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>HealthChecker+ — One-File Dashboard</title>

  <style>
    :root{ color-scheme: dark; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#0b0f14; color:#e9eef5; }
    .wrap{ max-width:1200px; margin:0 auto; padding:16px; }
    .topbar{ position:sticky; top:0; z-index:10; background:#0b0f14; border-bottom:1px solid #1b2430; padding:14px 16px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .title{ font-weight:900; font-size:20px; letter-spacing:.2px; }
    .sub{ opacity:.75; font-size:12px; margin-top:2px; }
    .right{ margin-left:auto; display:flex; gap:10px; align-items:center; }
    .pill{ display:inline-flex; gap:8px; align-items:center; border:1px solid #223043; background:#0f1620; padding:8px 10px; border-radius:999px; }
    .pill b{ font-weight:900; }
    .tabs button{
      border:1px solid #223043; background:#0f1620; color:#e9eef5;
      padding:10px 12px; border-radius:12px; cursor:pointer; font-size:13px; font-weight:800;
    }
    .tabs button.active{ border-color:#6a4d00; background:#16120a; }
    select, input, textarea{
      border:1px solid #223043; background:#0b0f14; color:#e9eef5;
      border-radius:12px; padding:10px; font-size:13px; outline:none;
    }
    textarea{ min-height:90px; width:100%; }
    .btn{ border:1px solid #223043; background:#0b0f14; color:#e9eef5; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:13px; font-weight:800; }
    .btnPrimary{ border:1px solid #6a4d00; background:#16120a; color:#fff; font-weight:900; }
    .btnDanger{ border:1px solid #7a1b1b; background:#1a0f12; }
    .card{ border:1px solid #1b2430; background:#0f1620; border-radius:16px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
    .h{ font-weight:900; margin-bottom:10px; }
    .label{ opacity:.8; font-size:12px; margin-bottom:4px; }
    .val{ font-weight:900; font-size:18px; }
    .mini{ opacity:.8; font-size:12px; }
    .hr{ height:1px; background:#1b2430; margin:12px 0; }
    .badge{ display:inline-block; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:900; letter-spacing:.4px; margin:8px 0; }
    .badge.urgent{ background:#5c1a1a; }
    .badge.soon{ background:#6b4d00; }
    .badge.routine{ background:#143b5a; }
    .badge.stable{ background:#1f5a2a; }
    .kvs{ display:flex; gap:12px; flex-wrap:wrap; }
    .kv{ min-width:150px; }
    .check{ display:flex; gap:10px; align-items:center; padding:10px; border:1px solid #223043; border-radius:12px; background:#0b0f14; }
    .checkgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; }
    .entry{ border:1px solid #223043; background:#0b0f14; border-radius:14px; padding:12px; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; opacity:.9; }
    .footer{ opacity:.7; font-size:12px; padding:16px 0; }
    canvas{ width:100%; height:220px; border:1px solid #223043; border-radius:14px; background:#0b0f14; }
    .muted{ opacity:.75; }
    .split{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:760px){ .split{ grid-template-columns:1fr; } }
    .notice{ border:1px dashed #6a4d00; background:#16120a; padding:10px 12px; border-radius:14px; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    (function(){
      const APP_NAME = "HealthChecker+";
      const APP_VERSION = "One-File v1.2.0 (Profile+BMI+Age+Trends Graphs)";

      // ========= Storage Keys =========
      const LS = {
        USERS: "hc_users_v2",
        ACTIVE_USER: "hc_active_user_v2",
        PROFILE_PREFIX: "hc_profile_v2_",     // + userId
        GLU_PREFIX: "hc_glucose_v2_",         // + userId
        BP_PREFIX: "hc_bp_v2_",               // + userId
        WT_PREFIX: "hc_weight_v2_",           // + userId
        GI_PREFIX: "hc_gi_v2_",               // + userId
        SYM_PREFIX: "hc_symptoms_v2_",        // + userId
        REPORTS_PREFIX: "hc_reports_v2_",     // + userId (optional caching)
      };

      // ========= Helpers =========
      function uid(){ return `${Date.now()}_${Math.random().toString(16).slice(2)}`; }
      function qs(sel, root=document){ return root.querySelector(sel); }
      function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
      function setHTML(el, html){ el.innerHTML = html; }
      function safeParse(json, fallback){ try { return JSON.parse(json) ?? fallback; } catch { return fallback; } }
      function clampInt(v, min, max){
        const n = Number.isFinite(+v) ? Math.floor(+v) : min;
        return Math.max(min, Math.min(max, n));
      }
      function clampNum(v, min, max){
        const n = Number.isFinite(+v) ? +v : min;
        return Math.max(min, Math.min(max, n));
      }
      function escapeHtml(s){
        return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
          .replaceAll('"',"&quot;").replaceAll("'","&#039;");
      }
      function fmtDateTime(iso){ try { return new Date(iso).toLocaleString(); } catch { return iso; } }
      function fmtDate(iso){ try { return new Date(iso).toLocaleDateString(); } catch { return iso; } }
      function todayISO(){
        const d=new Date();
        const pad=n=>String(n).padStart(2,"0");
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      }
      function triageStyle(t){
        if(t==="URGENT") return "badge urgent";
        if(t==="SOON") return "badge soon";
        if(t==="ROUTINE") return "badge routine";
        return "badge stable";
      }

      // ========= Domain Logic: Profile (Age/BMI) =========
      function computeAgeYears(dobISO){
        if(!dobISO) return null;
        const dob = new Date(dobISO);
        if(String(dob)==="Invalid Date") return null;
        const now = new Date();
        let age = now.getFullYear() - dob.getFullYear();
        const m = now.getMonth() - dob.getMonth();
        if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
        if(age < 0) age = 0;
        return age;
      }
      function computeBMI(heightCm, weightKg){
        const h = (+heightCm || 0) / 100;
        const w = (+weightKg || 0);
        if(!h || !w) return null;
        const bmi = w / (h*h);
        if(!Number.isFinite(bmi)) return null;
        return Math.round(bmi * 10) / 10;
      }
      function bmiBand(bmi){
        if(bmi==null) return "—";
        if(bmi < 18.5) return "Underweight";
        if(bmi < 25) return "Normal";
        if(bmi < 30) return "Overweight";
        return "Obesity";
      }

      // ========= GI logic (simplified stability) =========
      const DEFAULT_RED_FLAGS = {
        blood:false, blackTarry:false, fever:false, severePain:false, vomiting:false, weightLoss:false, wateryOver48h:false
      };
      function computeGiStability(entry){
        const bristol = clampInt(entry.bristol, 1, 7);
        const frequency = clampInt(entry.frequency, 0, 20);
        const urgency = entry.urgency || "none";
        const pain = entry.pain || "none";
        const durationDays = clampInt(entry.durationDays, 0, 365);
        const rf = entry.redFlags || DEFAULT_RED_FLAGS;

        const anyRedFlag = Object.values(rf).some(Boolean);

        let triageOverride = null;
        if(anyRedFlag){
          if(rf.blackTarry || rf.blood || rf.severePain || rf.vomiting) triageOverride = "URGENT";
          else if(rf.fever || rf.wateryOver48h || rf.weightLoss) triageOverride = "SOON";
          else triageOverride = "SOON";
        }

        let score = 100;
        const bristolPenalty = { 4:0, 3:5, 5:10, 2:15, 6:20, 1:25, 7:30 };
        score -= (bristolPenalty[bristol] ?? 15);

        if(frequency===0) score -= 15;
        else if(frequency===3) score -= 5;
        else if(frequency>=4 && frequency<=5) score -= 10;
        else if(frequency>=6) score -= 20;

        if(urgency==="sometimes") score -= 5;
        else if(urgency==="often") score -= 15;

        if(pain==="mild") score -= 5;
        else if(pain==="moderate") score -= 10;
        else if(pain==="severe") score -= 20;

        if(durationDays>=2 && durationDays<=3) score -= 5;
        else if(durationDays>=4 && durationDays<=7) score -= 10;
        else if(durationDays>7) score -= 15;

        score = clampInt(score, 0, 100);

        let band = "Stable";
        if(score < 40) band = "Highly unstable";
        else if(score < 60) band = "Unstable";
        else if(score < 80) band = "Mildly unstable";

        let triage = "ROUTINE";
        if(triageOverride) triage = triageOverride;
        else {
          if(score < 40) triage = "SOON";
          else if(score < 60 && durationDays >= 4) triage = "SOON";
          else if(score >= 80) triage = "STABLE";
          else triage = "ROUTINE";
        }

        const summary = `Bristol ${bristol}, ${frequency}/day, urgency: ${urgency}, pain: ${pain}, red flags: ${anyRedFlag ? "yes" : "no"}.`;
        return { score, band, triage, summary, anyRedFlag };
      }
      function buildGiActions(entry, computed, profile){
        const bristol = clampInt(entry.bristol, 1, 7);
        const hasCKD = hasCondition(profile, ["ckd","kidney","renal"]);
        const kidneyNote = hasCKD ? " (extra hydration vigilance due to kidney/BP risk)" : "";

        if(computed.triage==="URGENT"){
          return [
            "Urgent GI red flags detected. Seek urgent medical assessment now.",
            "Hydrate in small frequent sips while arranging care if safe.",
            "Avoid NSAIDs (ibuprofen/naproxen) unless clinician-approved (kidney safety)."
          ];
        }
        if(computed.triage==="SOON"){
          return [
            "Concerning or persistent GI pattern. Arrange prompt clinical review (24–72h).",
            "Prioritize hydration; consider oral rehydration solution if stools are loose." + kidneyNote,
            "Avoid heavy/fatty meals and alcohol until stable."
          ];
        }
        if(bristol===1 || bristol===2){
          return [
            "Constipation tendency: increase water and add fiber gradually (vegetables; psyllium if tolerated).",
            "Gentle daily activity (10–20 minutes walking).",
            "Escalate if pain, bleeding, or no stool >3 days."
          ];
        }
        if(bristol===6 || bristol===7){
          return [
            "Diarrhea tendency: prioritize hydration; consider electrolytes." + kidneyNote,
            "Reduce greasy/high-fat foods, very spicy meals, excess caffeine temporarily.",
            "Escalate if watery diarrhea >48h (or >24h with dehydration/CKD risk)."
          ];
        }
        return [
          "Maintain: Types 3–4 are usually the target range.",
          "If urgency/pain persists, review trigger foods and hydration.",
          "Reassess if new red flags appear."
        ];
      }

      // ========= Symptom logic (simple but practical + child/adult) =========
      // NOTE: This is a baseline engine. We can expand the library/coverage further next iteration.
      const BODY_AREAS = [
        "Head/Brain", "Eyes/Ears/Nose/Throat", "Chest/Breathing", "Heart/Circulation",
        "Stomach/Digestion", "Urine/Kidneys", "Muscles/Joints", "Skin", "Nerves/Weakness", "General"
      ];

      const SYMPTOMS = [
        // General
        {id:"fever", label:"Fever / high temperature", area:"General", redFlagChild:true, redFlagAdult:false},
        {id:"weightloss", label:"Unintentional weight loss", area:"General", redFlagChild:false, redFlagAdult:false},
        {id:"fatigue", label:"Severe tiredness / fatigue", area:"General"},
        {id:"confusion", label:"Confusion / not thinking clearly", area:"Head/Brain", redFlagChild:true, redFlagAdult:true},
        // Head/Brain
        {id:"severe_headache", label:"Worst headache of your life", area:"Head/Brain", redFlagChild:true, redFlagAdult:true},
        {id:"one_side_weak", label:"One-sided weakness or face droop", area:"Nerves/Weakness", redFlagChild:true, redFlagAdult:true},
        {id:"seizure", label:"Seizure / convulsions", area:"Head/Brain", redFlagChild:true, redFlagAdult:true},
        // Chest/Breathing
        {id:"chest_pain", label:"Chest pain / tightness", area:"Chest/Breathing", redFlagChild:true, redFlagAdult:true},
        {id:"short_breath", label:"Shortness of breath", area:"Chest/Breathing", redFlagChild:true, redFlagAdult:true},
        // Heart/Circulation
        {id:"palpitations", label:"Racing heart / palpitations", area:"Heart/Circulation"},
        {id:"leg_swelling", label:"Leg swelling", area:"Heart/Circulation"},
        // Digestion
        {id:"vomiting", label:"Persistent vomiting", area:"Stomach/Digestion", redFlagChild:true, redFlagAdult:true},
        {id:"bloody_stool", label:"Blood in stool", area:"Stomach/Digestion", redFlagChild:true, redFlagAdult:true},
        {id:"black_stool", label:"Black/tarry stool", area:"Stomach/Digestion", redFlagChild:true, redFlagAdult:true},
        {id:"severe_abdo_pain", label:"Severe abdominal pain", area:"Stomach/Digestion", redFlagChild:true, redFlagAdult:true},
        {id:"diarrhea", label:"Diarrhea / loose stools", area:"Stomach/Digestion"},
        {id:"constipation", label:"Constipation", area:"Stomach/Digestion"},
        // Urine/Kidneys
        {id:"low_urine", label:"Very low urine / not peeing", area:"Urine/Kidneys", redFlagChild:true, redFlagAdult:true},
        {id:"burning_urine", label:"Burning when urinating", area:"Urine/Kidneys"},
        {id:"blood_urine", label:"Blood in urine", area:"Urine/Kidneys", redFlagChild:true, redFlagAdult:true},
        // Skin
        {id:"rash", label:"New widespread rash", area:"Skin"},
      ];

      function hasCondition(profile, keywords){
        const list = (profile.conditions||[]).map(x=>String(x).toLowerCase());
        const other = String(profile.conditionsOther||"").toLowerCase();
        return keywords.some(k=> list.includes(k) || other.includes(k));
      }

      function runSymptomEngine(profile, selectedSymptomIds){
        const age = profile.ageYears ?? null;
        const isChild = (age!=null && age < 18);
        const hasCKD = hasCondition(profile, ["ckd","kidney","renal"]);
        const hasHeart = hasCondition(profile, ["heart","mi","cardiac","hypertension","stroke"]);
        const hasDiabetes = hasCondition(profile, ["diabetes","t2d","type 2","type2"]);

        const selected = SYMPTOMS.filter(s=>selectedSymptomIds.includes(s.id));
        const anyRedFlag = selected.some(s=> isChild ? !!s.redFlagChild : !!s.redFlagAdult);

        // Risk-modifier: if chronic conditions exist, lower threshold for "SOON"
        let triage = "ROUTINE";
        if(anyRedFlag) triage = "URGENT";
        else {
          if(selected.length >= 5) triage = "SOON";
          else if((hasCKD||hasHeart||hasDiabetes) && selected.length >= 3) triage = "SOON";
          else triage = "ROUTINE";
        }

        const headline = isChild ? "Child profile: recommendations are more cautious." : "Adult profile: standard triage thresholds.";
        const notes = [];
        if(hasCKD) notes.push("Kidney condition noted: prioritize hydration, avoid NSAIDs unless clinician-approved, monitor BP and urine output.");
        if(hasHeart) notes.push("Cardio risk noted: chest pain, shortness of breath, one-sided weakness = urgent assessment.");
        if(hasDiabetes) notes.push("Diabetes/insulin resistance noted: monitor glucose trends; dehydration/illness can raise glucose.");

        const actions = [];
        if(triage==="URGENT"){
          actions.push("Urgent pattern detected. Seek urgent medical assessment now or emergency services if severe.");
          actions.push("If chest pain, breathing difficulty, one-sided weakness, seizure, confusion: do not delay.");
        } else if(triage==="SOON"){
          actions.push("Concerning symptom cluster. Arrange clinical review soon (24–72h).");
          actions.push("Track symptoms, temperature, BP/glucose if available, and hydration/urine output.");
        } else {
          actions.push("Monitor and use supportive care. If symptoms worsen or new red flags appear, escalate.");
          actions.push("Log triggers (food, stress, sleep, medication changes) to help pattern detection.");
        }

        return {
          triage, headline,
          summary: `${selected.length} symptom(s) selected. Age group: ${isChild ? "Child" : "Adult"}.`,
          notes, actions,
          selected
        };
      }

      // ========= Storage accessors =========
      function keyProfile(id){ return LS.PROFILE_PREFIX + id; }
      function keyGlu(id){ return LS.GLU_PREFIX + id; }
      function keyBP(id){ return LS.BP_PREFIX + id; }
      function keyWT(id){ return LS.WT_PREFIX + id; }
      function keyGI(id){ return LS.GI_PREFIX + id; }
      function keySYM(id){ return LS.SYM_PREFIX + id; }

      function loadUsers(){
        const stored = safeParse(localStorage.getItem(LS.USERS), null);
        if(Array.isArray(stored) && stored.length) return stored;
        const defaults=[{id:"me", name:"Me"}];
        localStorage.setItem(LS.USERS, JSON.stringify(defaults));
        localStorage.setItem(LS.ACTIVE_USER, "me");
        return defaults;
      }
      function saveUsers(users){ localStorage.setItem(LS.USERS, JSON.stringify(users)); }
      function loadActiveUserId(){ return localStorage.getItem(LS.ACTIVE_USER) || "me"; }
      function setActiveUserId(id){ localStorage.setItem(LS.ACTIVE_USER, id); }

      function loadProfile(userId){
        const base = {
          name: "Me",
          sex: "unspecified",
          dob: "",
          ageYears: null,
          heightCm: "",
          weightKg: "",
          bmi: null,
          conditions: [],
          conditionsOther: "",
          notes: ""
        };
        const stored = safeParse(localStorage.getItem(keyProfile(userId)), null);
        const p = { ...base, ...(stored||{}) };
        // compute derived fields
        p.ageYears = computeAgeYears(p.dob);
        p.bmi = computeBMI(p.heightCm, p.weightKg);
        return p;
      }
      function saveProfile(userId, profile){
        const p = { ...profile };
        p.ageYears = computeAgeYears(p.dob);
        p.bmi = computeBMI(p.heightCm, p.weightKg);
        localStorage.setItem(keyProfile(userId), JSON.stringify(p));
        return p;
      }

      function loadArr(key){ const arr=safeParse(localStorage.getItem(key), []); return Array.isArray(arr)?arr:[]; }
      function saveArr(key, arr){ localStorage.setItem(key, JSON.stringify(arr)); }

      // ========= Interpretation helpers (Snapshot text) =========
      function interpretGlucose(mgdl, profile){
        const g = +mgdl;
        if(!Number.isFinite(g)) return {band:"—", note:"No glucose data."};
        // basic bands
        let band="In range";
        let note="Continue steady nutrition + activity.";
        if(g < 70){ band="Low"; note="Treat low glucose and recheck. If symptomatic or recurrent, seek advice."; }
        else if(g >= 180){ band="High"; note="Consider a gentle walk if safe, hydration, review carbs; recheck later."; }
        else if(g >= 140){ band="Elevated"; note="Watch meal composition; prioritize fiber/protein; recheck trend."; }

        // risk modifiers
        if(hasCondition(profile, ["ckd","kidney","renal"])) note += " Kidney condition: avoid dehydration.";
        return {band, note};
      }

      function interpretBP(sys, dia, profile){
        const s = +sys, d = +dia;
        if(!Number.isFinite(s) || !Number.isFinite(d)) return {band:"—", note:"No BP data."};
        let band="OK";
        let note="Maintain routine, low sodium, consistent activity.";
        if(s >= 180 || d >= 120){ band="Severe"; note="Very high BP range—seek urgent assessment, especially with symptoms."; }
        else if(s >= 140 || d >= 90){ band="High"; note="High BP range—review salt/stress/sleep; monitor readings; discuss with clinician."; }
        else if(s >= 130 || d >= 80){ band="Elevated"; note="Borderline range—optimize diet, sleep, activity; monitor trends."; }

        if(hasCondition(profile, ["ckd","kidney","renal"])) note += " CKD: BP control is especially important.";
        return {band, note};
      }

      // ========= Charts =========
      function drawLineChart(canvas, points, opts){
        // points: [{xLabel, y}]
        const c = canvas;
        const ctx = c.getContext("2d");

        // fix pixel ratio
        const dpr = window.devicePixelRatio || 1;
        const rect = c.getBoundingClientRect();
        c.width = Math.floor(rect.width * dpr);
        c.height = Math.floor(rect.height * dpr);
        ctx.scale(dpr, dpr);

        const W = rect.width;
        const H = rect.height;
        ctx.clearRect(0,0,W,H);

        // base grid
        ctx.globalAlpha = 1;
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#223043";
        for(let i=1;i<=4;i++){
          const y = (H/5)*i;
          ctx.beginPath(); ctx.moveTo(10,y); ctx.lineTo(W-10,y); ctx.stroke();
        }

        if(!points.length){
          ctx.fillStyle="#e9eef5"; ctx.globalAlpha=.75;
          ctx.font="12px system-ui";
          ctx.fillText("No data yet.", 14, 22);
          ctx.globalAlpha=1;
          return;
        }

        const ys = points.map(p=>p.y).filter(v=>Number.isFinite(v));
        const yMin = Number.isFinite(opts?.yMin) ? opts.yMin : Math.min(...ys);
        const yMax = Number.isFinite(opts?.yMax) ? opts.yMax : Math.max(...ys);
        const pad = (yMax-yMin) === 0 ? 1 : (yMax-yMin) * 0.15;
        const minV = yMin - pad;
        const maxV = yMax + pad;

        const left=12, right=12, top=12, bottom=26;
        const plotW = W-left-right;
        const plotH = H-top-bottom;

        function xAt(i){
          if(points.length===1) return left + plotW/2;
          return left + (plotW*(i/(points.length-1)));
        }
        function yAt(v){
          const t = (v - minV) / (maxV - minV);
          return top + (plotH * (1 - t));
        }

        // draw line
        ctx.strokeStyle = "#e9eef5";
        ctx.lineWidth = 2;
        ctx.beginPath();
        points.forEach((p,i)=>{
          const x=xAt(i), y=yAt(p.y);
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();

        // draw dots
        ctx.fillStyle = "#e9eef5";
        points.forEach((p,i)=>{
          const x=xAt(i), y=yAt(p.y);
          ctx.beginPath(); ctx.arc(x,y,3.2,0,Math.PI*2); ctx.fill();
        });

        // labels (last & title)
        ctx.font="12px system-ui";
        ctx.globalAlpha=.85;
        ctx.fillText(opts?.title || "Trend", 14, 18);
        const last = points[points.length-1];
        ctx.fillText(`Latest: ${last.y}`, 14, H-8);
        ctx.globalAlpha=1;
      }

      // ========= App State =========
      let state = {
        tab: "SNAPSHOT",
        users: loadUsers(),
        activeUserId: loadActiveUserId(),
        profile: null,
        glucose: [],
        bp: [],
        weight: [],
        gi: [],
        symptoms: [],
      };

      function refreshUserState(){
        const id = state.activeUserId;
        state.profile = loadProfile(id);
        state.glucose = loadArr(keyGlu(id));
        state.bp = loadArr(keyBP(id));
        state.weight = loadArr(keyWT(id));
        state.gi = loadArr(keyGI(id));
        state.symptoms = loadArr(keySYM(id));
      }
      refreshUserState();

      // Ensure profile name mirrors user name if empty
      function syncUserNameToProfile(){
        const user = state.users.find(u=>u.id===state.activeUserId);
        if(!user) return;
        const p = state.profile || loadProfile(state.activeUserId);
        if(!p.name || p.name==="Me"){
          p.name = user.name || "Me";
          state.profile = saveProfile(state.activeUserId, p);
        }
      }
      syncUserNameToProfile();

      const root = document.getElementById("app");

      function tabBtn(tab, active, label){
        return `<button data-tab="${tab}" class="${tab===active?"active":""}">${escapeHtml(label || tab)}</button>`;
      }

      // ========= Views =========
      function render(){
        const activeUser = state.users.find(u=>u.id===state.activeUserId) || state.users[0];
        const profile = state.profile || loadProfile(state.activeUserId);
        const displayName = (profile.name || activeUser?.name || "Me").trim() || "Me";

        setHTML(root, `
          <div class="topbar">
            <div class="row">
              <div>
                <div class="title">${APP_NAME} <span class="muted">— ${escapeHtml(displayName)}</span></div>
                <div class="sub">${APP_VERSION}</div>
              </div>
              <div class="right">
                <div class="pill"><span class="muted">Storage</span> <b>Local-only</b></div>
              </div>
            </div>

            <div class="row" style="margin-top:12px;">
              <div>
                <div class="label">Active person</div>
                <div class="row">
                  <select id="personSelect">
                    ${state.users.map(u=>`<option value="${u.id}" ${u.id===state.activeUserId?"selected":""}>${escapeHtml(u.name)}</option>`).join("")}
                  </select>
                  <input id="newPersonName" placeholder="Add person name" />
                  <button class="btn" id="addPersonBtn">Add</button>
                  <button class="btn btnDanger" id="delPersonBtn" ${state.activeUserId==="me"?"disabled":""}>Delete person</button>
                </div>
                <div class="mini muted">Up to 10 people total. Each person has separate profile, snapshot, trends, and reports.</div>
              </div>

              <div class="tabs row" style="margin-left:auto;">
                ${tabBtn("SNAPSHOT", state.tab, "Snapshot")}
                ${tabBtn("ADD", state.tab, "Add Data")}
                ${tabBtn("TRENDS", state.tab, "Trends")}
                ${tabBtn("GI", state.tab, "GI / Stool")}
                ${tabBtn("SYMPTOMS", state.tab, "Symptom Diagnoser")}
                ${tabBtn("REPORTS", state.tab, "Reports")}
                ${tabBtn("PROFILE", state.tab, "Profile")}
              </div>
            </div>
          </div>

          <div class="wrap">
            ${state.tab==="SNAPSHOT" ? viewSnapshot(activeUser, profile) : ""}
            ${state.tab==="ADD" ? viewAdd(profile) : ""}
            ${state.tab==="TRENDS" ? viewTrends(profile) : ""}
            ${state.tab==="GI" ? viewGI(profile) : ""}
            ${state.tab==="SYMPTOMS" ? viewSymptoms(profile) : ""}
            ${state.tab==="REPORTS" ? viewReports(profile) : ""}
            ${state.tab==="PROFILE" ? viewProfile(activeUser, profile) : ""}
          </div>

          <div class="wrap footer">
            Data is stored locally on this device (LocalStorage). Clearing browser data clears history.
          </div>
        `);

        wireEvents();
        afterRenderCharts(); // draw charts when needed
      }

      function latest(arr){ return arr && arr.length ? arr[0] : null; }

      function viewSnapshot(activeUser, profile){
        const g = latest(state.glucose);
        const bp = latest(state.bp);
        const w = latest(state.weight);
        const gi = latest(state.gi);

        const bmi = computeBMI(profile.heightCm, profile.weightKg);
        const age = profile.ageYears;

        const gInterp = g ? interpretGlucose(g.mgdl, profile) : {band:"—", note:"No glucose yet."};
        const bpInterp = bp ? interpretBP(bp.sys, bp.dia, profile) : {band:"—", note:"No BP yet."};

        // GI summary tile should be present here, but only as a tile summary (not the full GI page).
        let giTile = `
          <div class="card">
            <div class="h">GI Summary (Latest)</div>
            <div class="mini muted">This tile summarizes the latest GI entry. Full details are in the GI tab.</div>
            <div class="hr"></div>
            <div class="muted">No GI entries yet.</div>
            <div style="margin-top:10px;"><button class="btn btnPrimary" id="goGIFromSnap">Open GI tab</button></div>
          </div>
        `;
        if(gi){
          const c = gi.computed || computeGiStability(gi);
          giTile = `
            <div class="card">
              <div class="h">GI Summary (Latest)</div>
              <div class="kvs">
                <div class="kv"><div class="label">Timestamp</div><div class="val" style="font-size:14px;">${fmtDateTime(gi.ts)}</div></div>
                <div class="kv"><div class="label">Triage</div><div class="${triageStyle(c.triage)}">${c.triage}</div></div>
              </div>
              <div class="hr"></div>
              <div class="label">Summary</div>
              <div>${escapeHtml(c.summary)}</div>
              <div style="margin-top:10px;"><button class="btn" id="goGIFromSnap">Open GI tab</button></div>
            </div>
          `;
        }

        return `
          <div class="grid">
            <div class="card">
              <div class="h">Profile Snapshot</div>
              <div class="kvs">
                <div class="kv"><div class="label">Name</div><div class="val">${escapeHtml(profile.name || activeUser.name || "Me")}</div></div>
                <div class="kv"><div class="label">Sex</div><div class="val">${escapeHtml(profile.sex || "unspecified")}</div></div>
                <div class="kv"><div class="label">Age</div><div class="val">${age==null ? "—" : age + " yrs"}</div></div>
              </div>
              <div class="hr"></div>
              <div class="kvs">
                <div class="kv"><div class="label">Height</div><div class="val">${profile.heightCm ? escapeHtml(profile.heightCm)+" cm" : "—"}</div></div>
                <div class="kv"><div class="label">Weight</div><div class="val">${profile.weightKg ? escapeHtml(profile.weightKg)+" kg" : "—"}</div></div>
                <div class="kv"><div class="label">BMI</div><div class="val">${bmi==null ? "—" : bmi}</div><div class="mini muted">${bmiBand(bmi)}</div></div>
              </div>
              <div class="hr"></div>
              <button class="btn" id="goProfileFromSnap">Edit Profile</button>
            </div>

            <div class="card">
              <div class="h">Glucose (Latest)</div>
              ${g ? `
                <div class="kvs">
                  <div class="kv"><div class="label">Reading</div><div class="val">${g.mgdl} mg/dL</div></div>
                  <div class="kv"><div class="label">When</div><div class="val" style="font-size:14px;">${fmtDateTime(g.ts)}</div></div>
                  <div class="kv"><div class="label">Band</div><div class="val">${escapeHtml(gInterp.band)}</div></div>
                </div>
                <div class="hr"></div>
                <div class="label">Interpretation</div>
                <div>${escapeHtml(gInterp.note)}</div>
              ` : `
                <div class="muted">No glucose data yet.</div>
              `}
              <div class="hr"></div>
              <button class="btn btnPrimary" id="goAddGlucose">Add Glucose</button>
            </div>

            <div class="card">
              <div class="h">Blood Pressure (Latest)</div>
              ${bp ? `
                <div class="kvs">
                  <div class="kv"><div class="label">BP</div><div class="val">${bp.sys}/${bp.dia}</div></div>
                  <div class="kv"><div class="label">Pulse</div><div class="val">${bp.pulse ? escapeHtml(bp.pulse) : "—"}</div></div>
                  <div class="kv"><div class="label">Band</div><div class="val">${escapeHtml(bpInterp.band)}</div></div>
                </div>
                <div class="hr"></div>
                <div class="label">Interpretation</div>
                <div>${escapeHtml(bpInterp.note)}</div>
                ${bp.note ? `<div class="mini muted" style="margin-top:8px;">Note: ${escapeHtml(bp.note)}</div>` : ""}
              ` : `
                <div class="muted">No BP data yet.</div>
              `}
              <div class="hr"></div>
              <button class="btn btnPrimary" id="goAddBP">Add BP</button>
            </div>

            <div class="card">
              <div class="h">Weight (Latest)</div>
              ${w ? `
                <div class="kvs">
                  <div class="kv"><div class="label">Weight</div><div class="val">${w.kg} kg</div></div>
                  <div class="kv"><div class="label">When</div><div class="val" style="font-size:14px;">${fmtDateTime(w.ts)}</div></div>
                </div>
                ${w.note ? `<div class="mini muted" style="margin-top:8px;">Note: ${escapeHtml(w.note)}</div>` : ""}
              ` : `
                <div class="muted">No weight data yet.</div>
              `}
              <div class="hr"></div>
              <button class="btn" id="goAddWeight">Add Weight</button>
            </div>

            ${giTile}
          </div>
        `;
      }

      function viewAdd(profile){
        return `
          <div class="grid">
            <div class="card">
              <div class="h">Add Data</div>
              <div class="notice">
                Snapshot updates automatically as soon as you save. Trends graphs update from the saved entries.
              </div>
              <div class="hr"></div>

              <div class="h" style="margin-top:0;">Glucose</div>
              <div class="split">
                <div>
                  <div class="label">Glucose (mg/dL)</div>
                  <input id="gluVal" type="number" placeholder="e.g., 138" />
                </div>
                <div>
                  <div class="label">Note (optional)</div>
                  <input id="gluNote" placeholder="e.g., fasting, post-meal, after walk" />
                </div>
              </div>
              <div class="row" style="margin-top:10px;">
                <button class="btn btnPrimary" id="saveGlu">Save Glucose</button>
              </div>

              <div class="hr"></div>

              <div class="h" style="margin-top:0;">Blood Pressure</div>
              <div class="split">
                <div>
                  <div class="label">Systolic</div>
                  <input id="bpSys" type="number" placeholder="e.g., 132" />
                </div>
                <div>
                  <div class="label">Diastolic</div>
                  <input id="bpDia" type="number" placeholder="e.g., 84" />
                </div>
              </div>
              <div class="split" style="margin-top:10px;">
                <div>
                  <div class="label">Pulse (optional)</div>
                  <input id="bpPulse" type="number" placeholder="e.g., 62" />
                </div>
                <div>
                  <div class="label">Note (optional)</div>
                  <input id="bpNote" placeholder="e.g., full bladder, stress, after coffee" />
                </div>
              </div>
              <div class="row" style="margin-top:10px;">
                <button class="btn btnPrimary" id="saveBP">Save BP</button>
              </div>

              <div class="hr"></div>

              <div class="h" style="margin-top:0;">Weight</div>
              <div class="split">
                <div>
                  <div class="label">Weight (kg)</div>
                  <input id="wtKg" type="number" placeholder="e.g., 82.5" step="0.1" />
                </div>
                <div>
                  <div class="label">Note (optional)</div>
                  <input id="wtNote" placeholder="e.g., morning, after workout" />
                </div>
              </div>
              <div class="row" style="margin-top:10px;">
                <button class="btn" id="saveWT">Save Weight</button>
              </div>

              <div class="hr"></div>

              <div class="h" style="margin-top:0;">Attachments (placeholder)</div>
              <div class="muted">
                Attachment parsing (screenshots / PDFs / lab images) requires an extraction pipeline.
                For now: use manual entry. We can add attachment storage + paste-text parsing next iteration.
              </div>
            </div>

            <div class="card">
              <div class="h">Live Preview (from latest saved)</div>
              <div class="muted">After saving, go to Snapshot to view the latest cards + interpretations.</div>
              <div class="hr"></div>
              <button class="btn" id="goSnapshotFromAdd">Go to Snapshot</button>
              <button class="btn" id="goTrendsFromAdd">Go to Trends</button>
            </div>
          </div>
        `;
      }

      function viewTrends(profile){
        return `
          <div class="grid">
            <div class="card">
              <div class="h">Glucose Trend</div>
              <canvas id="chartGlu"></canvas>
              <div class="mini muted">Latest → Snapshot card. Trend uses your stored glucose entries.</div>
            </div>

            <div class="card">
              <div class="h">Blood Pressure Trend (Systolic)</div>
              <canvas id="chartSys"></canvas>
              <div class="mini muted">Systolic is tracked separately from diastolic.</div>
            </div>

            <div class="card">
              <div class="h">Blood Pressure Trend (Diastolic)</div>
              <canvas id="chartDia"></canvas>
              <div class="mini muted">Diastolic is tracked separately from systolic.</div>
            </div>

            <div class="card">
              <div class="h">Weight Trend</div>
              <canvas id="chartWt"></canvas>
              <div class="mini muted">Weight entries feed BMI (from profile height).</div>
            </div>

            <div class="card">
              <div class="h">BMI Trend</div>
              <canvas id="chartBMI"></canvas>
              <div class="mini muted">BMI is computed automatically from Height + Weight.</div>
            </div>

            <div class="card">
              <div class="h">Data Management</div>
              <div class="muted">These actions apply only to the active person.</div>
              <div class="hr"></div>
              <button class="btn btnDanger" id="clearGlu">Clear Glucose</button>
              <button class="btn btnDanger" id="clearBP">Clear BP</button>
              <button class="btn btnDanger" id="clearWT">Clear Weight</button>
              <button class="btn btnDanger" id="clearGI">Clear GI</button>
              <button class="btn btnDanger" id="clearSYM">Clear Symptoms</button>
            </div>
          </div>
        `;
      }

      function viewGI(profile){
        const latestGI = latest(state.gi);
        return `
          <div class="grid">
            <div class="card">
              <div class="h">GI / Stool (Add Entry)</div>

              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));">
                ${fieldSelect("Bristol stool type (1–7)", "gi_bristol", [1,2,3,4,5,6,7], 4)}
                ${fieldNumber("Frequency (stools/day)", "gi_frequency", 1, 0, 20)}
                ${fieldSelect("Urgency", "gi_urgency", ["none","sometimes","often"], "none")}
                ${fieldSelect("Pain with stool", "gi_pain", ["none","mild","moderate","severe"], "none")}
                ${fieldNumber("Days pattern persisted", "gi_durationDays", 1, 0, 365)}
              </div>

              <div class="hr"></div>
              <div class="label">Red flags</div>
              <div class="checkgrid">
                ${check("gi_blood", "Visible blood in stool")}
                ${check("gi_blackTarry", "Black/tarry stool")}
                ${check("gi_fever", "Fever")}
                ${check("gi_severePain", "Severe abdominal pain")}
                ${check("gi_vomiting", "Persistent vomiting")}
                ${check("gi_weightLoss", "Unintentional weight loss")}
                ${check("gi_wateryOver48h", "Watery diarrhea >48 hours")}
              </div>

              <div class="hr"></div>
              <div class="label">Notes (optional)</div>
              <textarea id="gi_notes" placeholder="e.g., spicy meal, new medication, travel, stress, etc."></textarea>

              <div class="row" style="margin-top:10px;">
                <button class="btn btnPrimary" id="saveGI">Save GI Entry</button>
              </div>
            </div>

            <div class="card">
              <div class="h">GI Stability (Latest)</div>
              ${!latestGI ? `<div class="muted">No GI entries yet.</div>` : (()=> {
                const c = latestGI.computed || computeGiStability(latestGI);
                const actions = buildGiActions(latestGI, c, profile);
                return `
                  <div class="${triageStyle(c.triage)}">${c.triage}</div>
                  <div class="kvs">
                    <div class="kv"><div class="label">Score</div><div class="val">${c.score}/100</div></div>
                    <div class="kv"><div class="label">Band</div><div class="val">${escapeHtml(c.band)}</div></div>
                    <div class="kv"><div class="label">When</div><div class="val" style="font-size:14px;">${fmtDateTime(latestGI.ts)}</div></div>
                  </div>
                  <div class="hr"></div>
                  <div class="label">Summary</div>
                  <div>${escapeHtml(c.summary)}</div>
                  <div class="hr"></div>
                  <div class="label">Recommended actions</div>
                  <ul>${actions.map(a=>`<li>${escapeHtml(a)}</li>`).join("")}</ul>
                `;
              })()}
              <div class="hr"></div>
              <div class="h">Bristol Reference</div>
              <ul>
                <li>Type 1: Hard pellets — constipation</li>
                <li>Type 2: Lumpy sausage — constipation tendency</li>
                <li>Type 3: Cracks on surface — generally OK</li>
                <li>Type 4: Smooth/soft — ideal</li>
                <li>Type 5: Soft blobs — mild looseness</li>
                <li>Type 6: Mushy — diarrhea tendency</li>
                <li>Type 7: Watery — significant diarrhea</li>
              </ul>
            </div>
          </div>
        `;
      }

      function viewSymptoms(profile){
        const age = profile.ageYears;
        const isChild = (age!=null && age < 18);

        return `
          <div class="grid">
            <div class="card">
              <div class="h">Symptom Diagnoser</div>
              <div class="mini muted">Uses your Profile (age, sex, existing conditions) to adjust recommendations.</div>
              <div class="hr"></div>

              <div class="kvs">
                <div class="kv"><div class="label">Age group</div><div class="val">${age==null ? "—" : (isChild ? "Child" : "Adult")}</div></div>
                <div class="kv"><div class="label">Existing conditions</div><div class="val" style="font-size:14px;">${escapeHtml(formatConditions(profile))}</div></div>
              </div>

              <div class="hr"></div>

              <div class="label">Body area</div>
              <select id="symArea">
                <option value="">All areas</option>
                ${BODY_AREAS.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join("")}
              </select>

              <div class="hr"></div>
              <div class="label">Search symptom</div>
              <input id="symSearch" placeholder="Type: chest pain, fever, diarrhea, weakness..." />

              <div class="hr"></div>
              <div class="label">Select symptoms (max 10)</div>
              <div id="symList" class="checkgrid"></div>

              <div class="row" style="margin-top:10px;">
                <button class="btn btnPrimary" id="runSym">Run analysis</button>
                <button class="btn" id="clearSymSel">Clear selection</button>
              </div>
            </div>

            <div class="card">
              <div class="h">Result</div>
              <div id="symResult" class="muted">Select symptoms, then run analysis.</div>
              <div class="hr"></div>
              <div class="mini muted">
                This is not a medical diagnosis. It is a triage-oriented guidance engine.
                If symptoms are severe or rapidly worsening, seek urgent medical care.
              </div>
            </div>
          </div>
        `;
      }

      function viewReports(profile){
        return `
          <div class="grid">
            <div class="card">
              <div class="h">Reports</div>
              <div class="mini muted">Daily / Weekly / Monthly or a custom date range. Output is tied to the active person.</div>
              <div class="hr"></div>

              <div class="row">
                <button class="btn" data-report="daily">Daily</button>
                <button class="btn" data-report="weekly">Weekly</button>
                <button class="btn" data-report="monthly">Monthly</button>
              </div>

              <div class="hr"></div>
              <div class="label">Custom range</div>
              <div class="row">
                <input id="repStart" type="date" value="${todayISO()}" />
                <input id="repEnd" type="date" value="${todayISO()}" />
                <button class="btn" id="runCustom">Run</button>
              </div>

              <div class="hr"></div>
              <div class="row">
                <button class="btn btnPrimary" id="printReport">Print / Save as PDF</button>
                <button class="btn" id="exportCSV">Export CSV</button>
              </div>
            </div>

            <div class="card">
              <div class="h">Report Output</div>
              <div id="reportOut" class="muted">Choose a report type to generate.</div>
            </div>
          </div>
        `;
      }

      function viewProfile(activeUser, profile){
        const bmi = computeBMI(profile.heightCm, profile.weightKg);
        const age = computeAgeYears(profile.dob);

        const conditionOptions = [
          {k:"hypertension", v:"Hypertension / High BP"},
          {k:"diabetes", v:"Diabetes / Insulin resistance"},
          {k:"ckd", v:"Kidney disease / CKD"},
          {k:"heart", v:"Heart disease / prior heart event"},
          {k:"stroke", v:"Stroke / TIA history"},
          {k:"asthma", v:"Asthma / chronic breathing issue"},
        ];

        return `
          <div class="grid">
            <div class="card">
              <div class="h">Profile</div>
              <div class="mini muted">All outputs and recommendations are tied to the selected user.</div>
              <div class="hr"></div>

              <div class="label">Select user (Profile)</div>
              <select id="profileUserSelect">
                ${state.users.map(u=>`<option value="${u.id}" ${u.id===state.activeUserId?"selected":""}>${escapeHtml(u.name)}</option>`).join("")}
              </select>

              <div class="hr"></div>

              <div class="split">
                <div>
                  <div class="label">Name</div>
                  <input id="p_name" value="${escapeHtml(profile.name || activeUser.name || "")}" placeholder="e.g., Robert" />
                </div>
                <div>
                  <div class="label">Sex</div>
                  <select id="p_sex">
                    ${["unspecified","male","female"].map(s=>`<option value="${s}" ${profile.sex===s?"selected":""}>${s}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="split" style="margin-top:10px;">
                <div>
                  <div class="label">Date of birth</div>
                  <input id="p_dob" type="date" value="${escapeHtml(profile.dob || "")}" />
                  <div class="mini muted">Age auto-calculates and affects symptom recommendations (adult vs child).</div>
                </div>
                <div>
                  <div class="label">Age (auto)</div>
                  <input id="p_age" value="${age==null ? "" : age}" disabled />
                </div>
              </div>

              <div class="split" style="margin-top:10px;">
                <div>
                  <div class="label">Height (cm)</div>
                  <input id="p_height" type="number" value="${escapeHtml(profile.heightCm || "")}" placeholder="e.g., 175" />
                </div>
                <div>
                  <div class="label">Weight (kg)</div>
                  <input id="p_weight" type="number" step="0.1" value="${escapeHtml(profile.weightKg || "")}" placeholder="e.g., 82.5" />
                </div>
              </div>

              <div class="split" style="margin-top:10px;">
                <div>
                  <div class="label">BMI (auto)</div>
                  <input id="p_bmi" value="${bmi==null ? "" : bmi}" disabled />
                  <div class="mini muted">${bmiBand(bmi)}</div>
                </div>
                <div>
                  <div class="label">Notes</div>
                  <input id="p_notes" value="${escapeHtml(profile.notes || "")}" placeholder="e.g., meds schedule, allergies, etc." />
                </div>
              </div>

              <div class="hr"></div>
              <div class="h">Existing Conditions</div>
              <div class="checkgrid">
                ${conditionOptions.map(o=>{
                  const checked = (profile.conditions||[]).includes(o.k);
                  return `<label class="check"><input type="checkbox" class="condBox" value="${escapeHtml(o.k)}" ${checked?"checked":""}><span>${escapeHtml(o.v)}</span></label>`;
                }).join("")}
                <label class="check"><input type="checkbox" id="condOtherToggle" ${profile.conditionsOther ? "checked":""}><span>Other (specify)</span></label>
              </div>

              <div style="margin-top:10px;">
                <div class="label">Other condition(s)</div>
                <input id="condOtherText" value="${escapeHtml(profile.conditionsOther || "")}" placeholder="e.g., epilepsy, anemia, fatty liver..." ${profile.conditionsOther ? "" : "disabled"} />
              </div>

              <div class="hr"></div>
              <div class="row">
                <button class="btn btnPrimary" id="saveProfileBtn">Save Profile</button>
              </div>
            </div>

            <div class="card">
              <div class="h">How Profile Affects Output</div>
              <ul>
                <li><b>Age</b> is computed automatically from DOB and changes the Symptom Diagnoser logic (child vs adult).</li>
                <li><b>BMI</b> is computed automatically from height + weight.</li>
                <li><b>Existing conditions</b> adjust risk notes (e.g., CKD + diarrhea = dehydration warning).</li>
                <li>The active user’s name is shown at the top of the app immediately after saving.</li>
              </ul>
            </div>
          </div>
        `;
      }

      function fieldSelect(label, id, options, def){
        const opts = options.map(o=>{
          const v=String(o);
          return `<option value="${escapeHtml(v)}" ${String(def)===v?"selected":""}>${escapeHtml(v)}</option>`;
        }).join("");
        return `<div><div class="label">${escapeHtml(label)}</div><select id="${escapeHtml(id)}">${opts}</select></div>`;
      }
      function fieldNumber(label, id, def, min, max){
        return `<div><div class="label">${escapeHtml(label)}</div><input id="${escapeHtml(id)}" type="number" value="${def}" min="${min}" max="${max}"></div>`;
      }
      function check(id, label){
        return `<label class="check"><input type="checkbox" id="${escapeHtml(id)}"><span>${escapeHtml(label)}</span></label>`;
      }

      function formatConditions(profile){
        const map = {
          hypertension:"Hypertension",
          diabetes:"Diabetes/IR",
          ckd:"CKD",
          heart:"Heart disease",
          stroke:"Stroke/TIA",
          asthma:"Asthma"
        };
        const base = (profile.conditions||[]).map(k=>map[k]||k);
        if(profile.conditionsOther) base.push(profile.conditionsOther);
        return base.length ? base.join(", ") : "None selected";
      }

      // ========= Charts Hook =========
      function afterRenderCharts(){
        if(state.tab!=="TRENDS") return;

        // take last N points (older -> newer)
        const N = 14;

        const gluPts = state.glucose.slice(0,N).reverse().map(e=>({xLabel:fmtDate(e.ts), y:+e.mgdl}));
        const sysPts = state.bp.slice(0,N).reverse().map(e=>({xLabel:fmtDate(e.ts), y:+e.sys}));
        const diaPts = state.bp.slice(0,N).reverse().map(e=>({xLabel:fmtDate(e.ts), y:+e.dia}));
        const wtPts = state.weight.slice(0,N).reverse().map(e=>({xLabel:fmtDate(e.ts), y:+e.kg}));
        const bmiPts = state.weight.slice(0,N).reverse().map(e=>{
          const bmi = computeBMI(state.profile?.heightCm, e.kg);
          return {xLabel:fmtDate(e.ts), y: bmi==null ? NaN : bmi};
        }).filter(p=>Number.isFinite(p.y));

        const cg = qs("#chartGlu"); if(cg) drawLineChart(cg, gluPts, {title:"Glucose (mg/dL)"});
        const cs = qs("#chartSys"); if(cs) drawLineChart(cs, sysPts, {title:"Systolic"});
        const cd = qs("#chartDia"); if(cd) drawLineChart(cd, diaPts, {title:"Diastolic"});
        const cw = qs("#chartWt"); if(cw) drawLineChart(cw, wtPts, {title:"Weight (kg)"});
        const cb = qs("#chartBMI"); if(cb) drawLineChart(cb, bmiPts, {title:"BMI"});
      }

      // ========= Events =========
      function wireEvents(){
        // Tabs
        qsa(".tabs button").forEach(b=>{
          b.addEventListener("click", ()=>{
            state.tab = b.getAttribute("data-tab");
            render();
          });
        });

        // Person select (top)
        const personSelect=qs("#personSelect");
        if(personSelect){
          personSelect.addEventListener("change", ()=>{
            state.activeUserId = personSelect.value;
            setActiveUserId(state.activeUserId);
            refreshUserState();
            render();
          });
        }

        // Add person (max 10)
        const addBtn=qs("#addPersonBtn");
        if(addBtn){
          addBtn.addEventListener("click", ()=>{
            const name=(qs("#newPersonName")?.value||"").trim();
            if(!name) return;

            if(state.users.length >= 10){
              alert("Limit reached: maximum 10 people.");
              return;
            }

            const id=uid();
            state.users.push({id, name});
            saveUsers(state.users);
            state.activeUserId=id;
            setActiveUserId(id);

            // initialize profile with provided name
            const p = loadProfile(id);
            p.name = name;
            saveProfile(id, p);

            refreshUserState();
            const n=qs("#newPersonName"); if(n) n.value="";
            render();
          });
        }

        // Delete person
        const delBtn=qs("#delPersonBtn");
        if(delBtn){
          delBtn.addEventListener("click", ()=>{
            if(state.activeUserId==="me") return;
            if(!confirm("Delete this person and all their data?")) return;
            const id=state.activeUserId;

            state.users = state.users.filter(u=>u.id!==id);
            saveUsers(state.users);

            // remove per-user keys
            localStorage.removeItem(keyProfile(id));
            localStorage.removeItem(keyGlu(id));
            localStorage.removeItem(keyBP(id));
            localStorage.removeItem(keyWT(id));
            localStorage.removeItem(keyGI(id));
            localStorage.removeItem(keySYM(id));

            state.activeUserId="me";
            setActiveUserId("me");
            refreshUserState();
            render();
          });
        }

        // Snapshot quick nav
        const goProfile=qs("#goProfileFromSnap"); if(goProfile) goProfile.addEventListener("click", ()=>{ state.tab="PROFILE"; render(); });
        const goGI=qs("#goGIFromSnap"); if(goGI) goGI.addEventListener("click", ()=>{ state.tab="GI"; render(); });
        const goAddGlucose=qs("#goAddGlucose"); if(goAddGlucose) goAddGlucose.addEventListener("click", ()=>{ state.tab="ADD"; render(); setTimeout(()=>qs("#gluVal")?.focus(), 50); });
        const goAddBP=qs("#goAddBP"); if(goAddBP) goAddBP.addEventListener("click", ()=>{ state.tab="ADD"; render(); setTimeout(()=>qs("#bpSys")?.focus(), 50); });
        const goAddWeight=qs("#goAddWeight"); if(goAddWeight) goAddWeight.addEventListener("click", ()=>{ state.tab="ADD"; render(); setTimeout(()=>qs("#wtKg")?.focus(), 50); });

        // Add view buttons
        const goSnap=qs("#goSnapshotFromAdd"); if(goSnap) goSnap.addEventListener("click", ()=>{ state.tab="SNAPSHOT"; render(); });
        const goTr=qs("#goTrendsFromAdd"); if(goTr) goTr.addEventListener("click", ()=>{ state.tab="TRENDS"; render(); });

        // Save glucose
        const saveGlu=qs("#saveGlu");
        if(saveGlu){
          saveGlu.addEventListener("click", ()=>{
            const v = +qs("#gluVal")?.value;
            if(!Number.isFinite(v) || v<=0){ alert("Enter a valid glucose mg/dL."); return; }
            const note = (qs("#gluNote")?.value||"").trim().slice(0,200);
            const entry = {id:uid(), ts:new Date().toISOString(), mgdl: Math.round(v), note};
            state.glucose = [entry, ...state.glucose];
            saveArr(keyGlu(state.activeUserId), state.glucose);
            // auto update snapshot
            state.tab="SNAPSHOT";
            render();
          });
        }

        // Save BP
        const saveBP=qs("#saveBP");
        if(saveBP){
          saveBP.addEventListener("click", ()=>{
            const sys = +qs("#bpSys")?.value;
            const dia = +qs("#bpDia")?.value;
            if(!Number.isFinite(sys) || !Number.isFinite(dia) || sys<=0 || dia<=0){
              alert("Enter valid systolic and diastolic values.");
              return;
            }
            const pulseVal = qs("#bpPulse")?.value;
            const pulse = pulseVal ? Math.round(+pulseVal) : "";
            const note = (qs("#bpNote")?.value||"").trim().slice(0,200);
            const entry = {id:uid(), ts:new Date().toISOString(), sys:Math.round(sys), dia:Math.round(dia), pulse, note};
            state.bp = [entry, ...state.bp];
            saveArr(keyBP(state.activeUserId), state.bp);
            state.tab="SNAPSHOT";
            render();
          });
        }

        // Save weight
        const saveWT=qs("#saveWT");
        if(saveWT){
          saveWT.addEventListener("click", ()=>{
            const kg = +qs("#wtKg")?.value;
            if(!Number.isFinite(kg) || kg<=0){ alert("Enter a valid weight (kg)."); return; }
            const note = (qs("#wtNote")?.value||"").trim().slice(0,200);
            const entry = {id:uid(), ts:new Date().toISOString(), kg: Math.round(kg*10)/10, note};
            state.weight = [entry, ...state.weight];
            saveArr(keyWT(state.activeUserId), state.weight);

            // If profile weight is empty, optionally sync it (keeps BMI meaningful)
            const p = state.profile;
            if(p && (!p.weightKg || String(p.weightKg).trim()==="")){
              p.weightKg = entry.kg;
              state.profile = saveProfile(state.activeUserId, p);
            }

            state.tab="SNAPSHOT";
            render();
          });
        }

        // Save GI
        const saveGI=qs("#saveGI");
        if(saveGI){
          saveGI.addEventListener("click", ()=>{
            const bristol = clampInt(qs("#gi_bristol")?.value ?? 4, 1, 7);
            const frequency = clampInt(qs("#gi_frequency")?.value ?? 1, 0, 20);
            const urgency = qs("#gi_urgency")?.value ?? "none";
            const pain = qs("#gi_pain")?.value ?? "none";
            const durationDays = clampInt(qs("#gi_durationDays")?.value ?? 1, 0, 365);

            const redFlags = {
              blood: !!qs("#gi_blood")?.checked,
              blackTarry: !!qs("#gi_blackTarry")?.checked,
              fever: !!qs("#gi_fever")?.checked,
              severePain: !!qs("#gi_severePain")?.checked,
              vomiting: !!qs("#gi_vomiting")?.checked,
              weightLoss: !!qs("#gi_weightLoss")?.checked,
              wateryOver48h: !!qs("#gi_wateryOver48h")?.checked,
            };

            const notes = (qs("#gi_notes")?.value||"").trim().slice(0,1000);
            const base = { bristol, frequency, urgency, pain, durationDays, redFlags, notes };
            const computed = computeGiStability(base);
            const stored = { id:uid(), ts:new Date().toISOString(), ...base, computed };

            state.gi = [stored, ...state.gi];
            saveArr(keyGI(state.activeUserId), state.gi);

            // After save, go snapshot (tile updates)
            state.tab="SNAPSHOT";
            render();
          });
        }

        // Symptom list render + selection
        const symList = qs("#symList");
        if(symList){
          const existingSel = new Set((state.symptoms?.[0]?.selectedIds)||[]);
          function renderSymptomList(){
            const area = (qs("#symArea")?.value||"").trim();
            const q = (qs("#symSearch")?.value||"").trim().toLowerCase();

            const filtered = SYMPTOMS.filter(s=>{
              const okArea = !area || s.area===area;
              const okQ = !q || s.label.toLowerCase().includes(q) || s.id.toLowerCase().includes(q);
              return okArea && okQ;
            });

            setHTML(symList, filtered.map(s=>{
              const checked = existingSel.has(s.id);
              return `<label class="check">
                <input type="checkbox" class="symBox" value="${escapeHtml(s.id)}" ${checked?"checked":""}>
                <span>${escapeHtml(s.label)} <span class="mini muted">(${escapeHtml(s.area)})</span></span>
              </label>`;
            }).join("") || `<div class="muted">No matches.</div>`);

            qsa(".symBox", symList).forEach(box=>{
              box.addEventListener("change", ()=>{
                const id = box.value;
                if(box.checked){
                  if(existingSel.size >= 10){
                    box.checked = false;
                    alert("Max 10 symptoms at a time.");
                    return;
                  }
                  existingSel.add(id);
                } else {
                  existingSel.delete(id);
                }
              });
            });
          }

          const areaSel = qs("#symArea"); if(areaSel) areaSel.addEventListener("change", renderSymptomList);
          const search = qs("#symSearch"); if(search) search.addEventListener("input", renderSymptomList);
          renderSymptomList();

          const runBtn = qs("#runSym");
          if(runBtn){
            runBtn.addEventListener("click", ()=>{
              const selectedIds = Array.from(existingSel);
              if(!selectedIds.length){ alert("Select at least one symptom."); return; }

              const result = runSymptomEngine(state.profile, selectedIds);
              const stored = {id:uid(), ts:new Date().toISOString(), selectedIds, result};
              state.symptoms = [stored, ...state.symptoms];
              saveArr(keySYM(state.activeUserId), state.symptoms);

              const out = qs("#symResult");
              if(out){
                setHTML(out, `
                  <div class="${triageStyle(result.triage)}">${result.triage}</div>
                  <div class="mini muted">${escapeHtml(result.headline)}</div>
                  <div class="hr"></div>
                  <div><b>Summary:</b> ${escapeHtml(result.summary)}</div>
                  <div class="hr"></div>
                  <div class="label">Selected</div>
                  <ul>${result.selected.map(s=>`<li>${escapeHtml(s.label)}</li>`).join("")}</ul>
                  <div class="hr"></div>
                  ${result.notes.length ? `<div class="label">Profile risk notes</div><ul>${result.notes.map(n=>`<li>${escapeHtml(n)}</li>`).join("")}</ul><div class="hr"></div>` : ""}
                  <div class="label">Recommended actions</div>
                  <ul>${result.actions.map(a=>`<li>${escapeHtml(a)}</li>`).join("")}</ul>
                `);
              }
            });
          }

          const clearBtn = qs("#clearSymSel");
          if(clearBtn){
            clearBtn.addEventListener("click", ()=>{
              existingSel.clear();
              renderSymptomList();
              const out = qs("#symResult");
              if(out) out.textContent = "Selection cleared. Select symptoms, then run analysis.";
            });
          }
        }

        // Reports
        qsa("[data-report]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const type = btn.getAttribute("data-report");
            const range = computeReportRange(type);
            const html = buildReportHTML(range.start, range.end);
            setHTML(qs("#reportOut"), html);
          });
        });
        const runCustom = qs("#runCustom");
        if(runCustom){
          runCustom.addEventListener("click", ()=>{
            const start = qs("#repStart")?.value || todayISO();
            const end = qs("#repEnd")?.value || todayISO();
            const html = buildReportHTML(start, end);
            setHTML(qs("#reportOut"), html);
          });
        }
        const printBtn = qs("#printReport");
        if(printBtn){
          printBtn.addEventListener("click", ()=>{
            const out = qs("#reportOut");
            if(!out) return;
            const w = window.open("", "_blank");
            w.document.write(`
              <html><head><title>HealthChecker+ Report</title>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <style>body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;padding:18px;} h1,h2{margin:0 0 10px 0;} .muted{opacity:.75;} .card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0;}</style>
              </head><body>
                <h1>HealthChecker+ Report</h1>
                <div class="muted">Person: ${escapeHtml(state.profile?.name||"")}</div>
                ${out.innerHTML}
              </body></html>
            `);
            w.document.close();
            w.focus();
            w.print();
          });
        }
        const exportBtn = qs("#exportCSV");
        if(exportBtn){
          exportBtn.addEventListener("click", ()=>{
            const csv = buildCSV();
            downloadText(csv, `HealthCheckerPlus_${safeFile(state.profile?.name||"user")}_export.csv`, "text/csv");
          });
        }

        // Trends clear buttons
        const clear = (btnId, arrName, storageKeyFn)=>{
          const b = qs(btnId);
          if(!b) return;
          b.addEventListener("click", ()=>{
            if(!confirm("Clear this dataset for active person?")) return;
            state[arrName] = [];
            saveArr(storageKeyFn(state.activeUserId), []);
            render();
          });
        };
        clear("#clearGlu","glucose", keyGlu);
        clear("#clearBP","bp", keyBP);
        clear("#clearWT","weight", keyWT);
        clear("#clearGI","gi", keyGI);
        clear("#clearSYM","symptoms", keySYM);

        // Profile user selector
        const profileUserSelect = qs("#profileUserSelect");
        if(profileUserSelect){
          profileUserSelect.addEventListener("change", ()=>{
            state.activeUserId = profileUserSelect.value;
            setActiveUserId(state.activeUserId);
            refreshUserState();
            render();
          });
        }

        // Existing conditions: Other toggle
        const otherToggle = qs("#condOtherToggle");
        if(otherToggle){
          otherToggle.addEventListener("change", ()=>{
            const t = qs("#condOtherText");
            if(!t) return;
            if(otherToggle.checked){
              t.disabled = false;
              t.focus();
            } else {
              t.value = "";
              t.disabled = true;
            }
          });
        }

        // Save Profile (auto BMI + Age, update header name)
        const saveProfileBtn = qs("#saveProfileBtn");
        if(saveProfileBtn){
          saveProfileBtn.addEventListener("click", ()=>{
            const name = (qs("#p_name")?.value||"").trim();
            if(!name){ alert("Please enter a name."); return; }

            const sex = qs("#p_sex")?.value || "unspecified";
            const dob = qs("#p_dob")?.value || "";
            const heightCm = qs("#p_height")?.value || "";
            const weightKg = qs("#p_weight")?.value || "";
            const notes = (qs("#p_notes")?.value||"").trim().slice(0,300);

            const conditions = qsa(".condBox").filter(x=>x.checked).map(x=>x.value);
            const otherOn = !!qs("#condOtherToggle")?.checked;
            const conditionsOther = otherOn ? (qs("#condOtherText")?.value||"").trim().slice(0,200) : "";

            // persist to profile
            const updated = saveProfile(state.activeUserId, {
              ...state.profile,
              name, sex, dob, heightCm, weightKg, notes,
              conditions, conditionsOther
            });
            state.profile = updated;

            // Update Users list name as well (so the top selector matches)
            const u = state.users.find(x=>x.id===state.activeUserId);
            if(u){ u.name = name; saveUsers(state.users); }

            // optional: ensure DOB-derived age shown instantly
            alert("Profile saved. Name, BMI, and Age updated automatically.");
            render();
          });
        }
      }

      // ========= Reports implementation =========
      function computeReportRange(type){
        const now = new Date();
        const start = new Date(now);
        const end = new Date(now);
        if(type==="daily"){
          // today
        } else if(type==="weekly"){
          start.setDate(now.getDate()-6);
        } else if(type==="monthly"){
          start.setDate(now.getDate()-29);
        }
        const toISO = d=>{
          const pad=n=>String(n).padStart(2,"0");
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        };
        return {start:toISO(start), end:toISO(end)};
      }

      function inRange(tsISO, startISO, endISO){
        const t = new Date(tsISO).getTime();
        const s = new Date(startISO+"T00:00:00").getTime();
        const e = new Date(endISO+"T23:59:59").getTime();
        return t>=s && t<=e;
      }

      function buildReportHTML(startISO, endISO){
        const profile = state.profile;
        const glu = state.glucose.filter(e=>inRange(e.ts,startISO,endISO));
        const bp = state.bp.filter(e=>inRange(e.ts,startISO,endISO));
        const wt = state.weight.filter(e=>inRange(e.ts,startISO,endISO));
        const gi = state.gi.filter(e=>inRange(e.ts,startISO,endISO));
        const sym = state.symptoms.filter(e=>inRange(e.ts,startISO,endISO));

        const latestG = latest(glu) || latest(state.glucose);
        const latestBP = latest(bp) || latest(state.bp);
        const latestGI = latest(gi) || latest(state.gi);

        const gInterp = latestG ? interpretGlucose(latestG.mgdl, profile) : {band:"—", note:"No glucose."};
        const bpInterp = latestBP ? interpretBP(latestBP.sys, latestBP.dia, profile) : {band:"—", note:"No BP."};
        const giC = latestGI ? (latestGI.computed || computeGiStability(latestGI)) : null;

        return `
          <div class="card">
            <h2 style="margin:0 0 6px 0;">Period</h2>
            <div class="muted">${escapeHtml(startISO)} to ${escapeHtml(endISO)}</div>
            <div class="muted">Person: ${escapeHtml(profile.name || "")} (${profile.ageYears==null?"—":profile.ageYears} yrs, ${escapeHtml(profile.sex||"unspecified")})</div>
          </div>

          <div class="card">
            <h2 style="margin:0 0 6px 0;">Highlights (Latest)</h2>
            <ul>
              <li><b>Glucose:</b> ${latestG ? `${latestG.mgdl} mg/dL (${escapeHtml(gInterp.band)})` : "—"} — ${escapeHtml(gInterp.note)}</li>
              <li><b>BP:</b> ${latestBP ? `${latestBP.sys}/${latestBP.dia} (${escapeHtml(bpInterp.band)})` : "—"} — ${escapeHtml(bpInterp.note)}</li>
              <li><b>GI:</b> ${giC ? `${escapeHtml(giC.summary)} (Triage: ${giC.triage})` : "—"}</li>
            </ul>
          </div>

          <div class="card">
            <h2 style="margin:0 0 6px 0;">Counts in Period</h2>
            <ul>
              <li>Glucose entries: ${glu.length}</li>
              <li>BP entries: ${bp.length}</li>
              <li>Weight entries: ${wt.length}</li>
              <li>GI entries: ${gi.length}</li>
              <li>Symptom runs: ${sym.length}</li>
            </ul>
          </div>
        `;
      }

      function safeFile(s){ return String(s).replace(/[^\w\-]+/g,"_").slice(0,40) || "user"; }
      function downloadText(text, filename, mime){
        const blob = new Blob([text], {type: mime || "text/plain"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 500);
      }

      function buildCSV(){
        const rows = [];
        const p = state.profile;
        rows.push(["section","field","value","timestamp"].join(","));
        rows.push(["profile","name",csvEsc(p.name||""),""].join(","));
        rows.push(["profile","sex",csvEsc(p.sex||""),""].join(","));
        rows.push(["profile","dob",csvEsc(p.dob||""),""].join(","));
        rows.push(["profile","ageYears",csvEsc(p.ageYears==null?"":String(p.ageYears)),""].join(","));
        rows.push(["profile","heightCm",csvEsc(p.heightCm||""),""].join(","));
        rows.push(["profile","weightKg",csvEsc(p.weightKg||""),""].join(","));
        rows.push(["profile","bmi",csvEsc(p.bmi==null?"":String(p.bmi)),""].join(","));
        rows.push(["profile","conditions",csvEsc(formatConditions(p)),""].join(","));

        state.glucose.forEach(e=>{
          rows.push(["glucose","mgdl",csvEsc(e.mgdl),csvEsc(e.ts)].join(","));
        });
        state.bp.forEach(e=>{
          rows.push(["bp","sys/dia",csvEsc(`${e.sys}/${e.dia}`),csvEsc(e.ts)].join(","));
        });
        state.weight.forEach(e=>{
          rows.push(["weight","kg",csvEsc(e.kg),csvEsc(e.ts)].join(","));
        });
        state.gi.forEach(e=>{
          const c = e.computed || computeGiStability(e);
          rows.push(["gi","summary",csvEsc(c.summary),csvEsc(e.ts)].join(","));
        });
        state.symptoms.forEach(e=>{
          rows.push(["symptoms","triage",csvEsc(e.result?.triage||""),csvEsc(e.ts)].join(","));
        });

        return rows.join("\n");
      }
      function csvEsc(v){
        const s = String(v ?? "");
        if(s.includes(",") || s.includes('"') || s.includes("\n")){
          return `"${s.replaceAll('"','""')}"`;
        }
        return s;
      }

      // ========= Boot =========
      render();

    })();
  </script>
</body>
</html>
