<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0f14" />
<title>HealthChecker+ — GI</title>

<style>
:root{color-scheme:dark}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b0f14;color:#e9eef5}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.topbar{position:sticky;top:0;background:#0b0f14;border-bottom:1px solid #1b2430;padding:14px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs button{border:1px solid #223043;background:#0f1620;color:#e9eef5;padding:9px 10px;border-radius:10px;cursor:pointer}
.tabs button.active{border-color:#6a4d00;background:#16120a}
.card{border:1px solid #1b2430;background:#0f1620;border-radius:14px;padding:14px}
.h{font-weight:800;margin-bottom:10px}
.btn{border:1px solid #223043;background:#0b0f14;color:#e9eef5;padding:10px 12px;border-radius:10px;cursor:pointer}
.btnPrimary{border-color:#6a4d00;background:#16120a;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.label{opacity:.75;font-size:12px}
.kvs{display:flex;gap:12px;flex-wrap:wrap}
.kv{min-width:140px}
.hr{height:1px;background:#1b2430;margin:12px 0}
.badge{padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px}
.badge.stable{background:#1f5a2a}
.badge.routine{background:#143b5a}
.badge.soon{background:#6b4d00}
.badge.urgent{background:#5c1a1a}
</style>
</head>

<body><script>
const app = document.getElementById("app");

// --- Simple tab state (baseline wiring) ---
let state = { tab: "SNAPSHOT" };

function badge(t){
  return "badge " + (
    t==="URGENT"?"urgent":
    t==="SOON"?"soon":
    t==="ROUTINE"?"routine":"stable"
  );
}

function viewSnapshot(){
  return `
    <div class="wrap">
      <div class="grid">
        <div class="card">
          <div class="h">GI Stability</div>
          <div class="${badge("STABLE")}">STABLE</div>

          <div class="kvs">
            <div class="kv"><div class="label">Score</div><div>—</div></div>
            <div class="kv"><div class="label">Latest Entry</div><div>None</div></div>
          </div>

          <div class="hr"></div>
          <button class="btn btnPrimary" id="goAddBtn">Add First GI Entry</button>
        </div>
      </div>
    </div>
  `;
}

function viewAdd(){
  return `
    <div class="wrap">
      <div class="grid">
        <div class="card">
          <div class="h">Add Entry (Baseline)</div>
          <div class="label">This is the wired Add screen. Next step is to paste the full form + scoring.</div>

          <div class="hr"></div>
          <button class="btn" id="backToSnapshotBtn">Back to Snapshot</button>
        </div>

        <div class="card">
          <div class="h">Status</div>
          <div>Tabs and buttons are now active.</div>
        </div>
      </div>
    </div>
  `;
}

function render(){
  app.innerHTML = `
    <div class="topbar">
      <div class="row">
        <strong>HealthChecker+ — GI</strong>
        <a href="./index.html" style="margin-left:auto;color:#e9eef5">Back to Dashboard</a>
      </div>

      <div class="tabs row" style="margin-top:10px">
        <button data-tab="SNAPSHOT" class="${state.tab==="SNAPSHOT" ? "active" : ""}">Snapshot</button>
        <button data-tab="ADD" class="${state.tab==="ADD" ? "active" : ""}">Add Entry</button>
        <button data-tab="TRENDS" class="${state.tab==="TRENDS" ? "active" : ""}">Trends</button>
        <button data-tab="HISTORY" class="${state.tab==="HISTORY" ? "active" : ""}">History</button>
      </div>
    </div>

    ${
      state.tab==="SNAPSHOT" ? viewSnapshot()
      : state.tab==="ADD" ? viewAdd()
      : `<div class="wrap"><div class="card"><div class="h">${state.tab}</div><div class="label">Next step: wire ${state.tab.toLowerCase()} view.</div></div></div>`
    }
  `;

  wireEvents();
}

function wireEvents(){
  // Tabs
  document.querySelectorAll(".tabs button[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.tab = btn.getAttribute("data-tab");
      render();
    });
  });

  // Snapshot button -> Add
  const goAdd = document.getElementById("goAddBtn");
  if(goAdd){
    goAdd.addEventListener("click", ()=>{
      state.tab = "ADD";
      render();
    });
  }

  // Add screen -> back
  const backBtn = document.getElementById("backToSnapshotBtn");
  if(backBtn){
    backBtn.addEventListener("click", ()=>{
      state.tab = "SNAPSHOT";
      render();
    });
  }
}

render();
</script>

<div id="app"></div>

</body>
</html>
