name: HealthChecker Release Validation

on:
  pull_request:
    branches: [ main, agents/hc-352-consumer-ui-polish ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/production.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/production.txt
          python -m pip install -r requirements-hc311.txt
          python -m pip install pytest httpx2
      - name: Run focused release regression
        run: |
          python -m pytest -q -k "not unsafe_vault_paths_rejected" \
            tests/test_hc329_t52_startup_wrapper_regression.py \
            tests/test_hc329_consumer_theme_account_recovery.py \
            tests/test_hc329_clinical_rules_parity.py \
            tests/test_hc317b_records_backend.py \
            tests/test_hc317c_consumer_records_ui.py \
            tests/test_hc320b_production_security_closure.py \
            tests/test_hc320c_production_runtime_connectivity.py \
            tests/test_hc318b_authentication_foundation.py \
            tests/test_hc325_r5_password_lifecycle.py \
            tests/test_hc325_r6_android_production_origin_lock.py \
            tests/test_hc322a_consumer_screenshot_policy.py \
            tests/test_hc311c_encrypted_vault_store.py \
            tests/test_hc321_b3_android_signed_release.py \
            tests/test_hc321_c_a_backup_restore_dr.py \
            tests/test_hc320d_release_recovery_packaging.py \
            tests/test_hc325_r6b_android_saf_record_import.py \
            tests/test_hc304b_private_host_foundation.py \
            tests/test_hc304br1_proxy_topology.py \
            tests/test_hc319d_mobile_consumer_launcher.py \
            tests/test_hc331_vault_import_semantics.py \
            tests/test_hc356_dashboard_freshness.py \
            tests/test_hc358_import_preview_protocol.py \
            tests/test_hc358_import_atomicity.py \
            tests/test_hc359_local_vision_ocr.py \
            tests/test_hc359_import_preview_ocr_gate.py \
            tests/test_hc359_scanned_pdf_and_screenshots.py \
            tests/test_hc360_production_lock.py \
            tests/test_hc360_ocr_import_qualification.py \
            tests/test_hc360_ocr_locality.py

      - name: Validate consumer import JavaScript syntax
        run: node --check js/health_vault/records.js


  windows-production-lock:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements/production.txt
      - name: Verify Windows x86-64 CPython 3.12
        shell: pwsh
        run: python -c "import platform, struct, sys; assert sys.version_info[:2] == (3, 12); assert struct.calcsize('P') * 8 == 64; assert platform.system() == 'Windows'; print(platform.platform(), platform.machine(), sys.version)"
      - name: Install production dependencies from hashes
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/production.txt
      - name: Install qualification harness
        shell: pwsh
        run: python -m pip install pytest
      - name: Verify locked runtime and local OCR qualification
        shell: pwsh
        run: |
          python -c "import cryptography; assert cryptography.__version__ == '45.0.7'"
          python -m pytest -q tests/test_hc360_production_lock.py tests/test_hc360_ocr_import_qualification.py tests/test_hc360_ocr_locality.py

  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Run Android debug and release unit tests
        env:
          HC_ANDROID_REQUIRE_PRODUCTION_SIGNING: "false"
        run: ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest --no-daemon
